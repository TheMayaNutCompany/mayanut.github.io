  <defs>
    <style>
      .red{fill:#B22234}
      .white{fill:#FFFFFF}
      .blue{fill:#3C3B6E}
    </style>

    <!-- 5-point star centered at (0,0) -->
    <symbol id="star" viewBox="-50 -50 100 100">
      <polygon class="white" points="
        0,-50 14.694,-20.225 47.553,-15.451 23.776,7.725 29.389,40.451
        0,25 -29.389,40.451 -23.776,7.725 -47.553,-15.451 -14.694,-20.225
      "></polygon>
    </symbol>
  </defs>

  <!-- Stripes -->
  <rect class="red" width="1900" height="1000"></rect>
  <!-- stripe height = 1000/13 -->
  <rect class="white" x="0" y="76.9230769231" width="1900" height="76.9230769231"></rect>
  <rect class="white" x="0" y="230.7692307692" width="1900" height="76.9230769231"></rect>
  <rect class="white" x="0" y="384.6153846154" width="1900" height="76.9230769231"></rect>
  <rect class="white" x="0" y="538.4615384615" width="1900" height="76.9230769231"></rect>
