  <rect class="white" x="0" y="846.1538461538" width="1900" height="76.9230769231"></rect>

  <!-- Canton -->
  <!-- width D = 0.76A = 760; height C = 7/13A = 538.461538... -->
  <rect class="blue" x="0" y="0" width="760" height="538.4615384615"></rect>

  <!-- Stars (EO10834 geometry) -->
  <!-- A = 1000
       G (left margin to star centers) = 0.063A = 63
       F (top margin to star centers)  = 0.054A = 54
       H (half horizontal step)        = 0.063A = 63
       V (vertical step)              = 0.054A = 54
       K (star diameter)              = 0.0616A = 61.6
       6-star rows x: G + i*(2H)  i=0..5
       5-star rows x: G + H + i*(2H) i=0..4
       y rows: F + j*V  j=0..8
  -->
  <g>
    <!-- helper: place star by translating to center, then drawing star box centered -->
    <!-- Row 1 (6) y=54 -->
    <g transform="translate(63 54)"><use href="#star" x="-30.8" y="-30.8" width="61.6" height="61.6"></use></g>
