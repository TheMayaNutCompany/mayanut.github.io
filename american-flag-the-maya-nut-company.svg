<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2470 1300" width="2470" height="1300" preserveAspectRatio="none" overflow="hidden" shape-rendering="crispEdges">

  <defs>
    <style>
      .red{fill:#B22234}
      .white{fill:#FFFFFF}
      .blue{fill:#3C3B6E}
    </style>

    <symbol id="star" viewBox="-50 -50 100 100">
      <polygon class="white" points="
        0,-50 14.694,-20.225 47.553,-15.451 23.776,7.725 29.389,40.451
        0,25 -29.389,40.451 -23.776,7.725 -47.553,-15.451 -14.694,-20.225
      "></polygon>
    </symbol>

    <!-- Clip to exact canvas -->
    <clipPath id="clip">
      <rect x="0" y="0" width="2470" height="1300"></rect>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- BLEED RECT: draw slightly past edges to eliminate any halo/border -->
    <rect class="red" x="-2" y="-2" width="2474" height="1304"></rect>

    <!-- Stripes (stripe height = 100 exactly) -->
    <rect class="white" x="-2" y="100" width="2474" height="100"></rect>
    <rect class="white" x="-2" y="300" width="2474" height="100"></rect>
    <rect class="white" x="-2" y="500" width="2474" height="100"></rect>
    <rect class="white" x="-2" y="700" width="2474" height="100"></rect>
    <rect class="white" x="-2" y="900" width="2474" height="100"></rect>
    <rect class="white" x="-2" y="1100" width="2474" height="100"></rect>

    <!-- Canton (0.76A by 7 stripes) => 988 x 700 -->
    <rect class="blue" x="-2" y="-2" width="992" height="704"></rect>

    <!-- Stars (scaled from EO10834 layout; kept safely inside canton) -->
    <!-- Using a clean, evenly spaced grid that stays well within 988x700 -->
    <!-- 9 rows: 6/5 alternating -->
    <g>
      <!-- Parameters chosen to avoid edge collisions: -->
      <!-- left=90, top=80, dx=150, dy=70, star=64 -->
      <!-- 6-star rows x: 90 + i*150 (i=0..5) -->
      <!-- 5-star rows x: 165 + i*150 (i=0..4) -->
      <!-- y: 80 + r*70 (r=0..8) -->
      <!-- Row 1 (6) -->
      <g transform="translate(90 80)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(240 80)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(390 80)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(540 80)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(690 80)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(840 80)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>

      <!-- Row 2 (5) -->
      <g transform="translate(165 150)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(315 150)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(465 150)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(615 150)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(765 150)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>

      <!-- Row 3 (6) -->
      <g transform="translate(90 220)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(240 220)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(390 220)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(540 220)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(690 220)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(840 220)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>

      <!-- Row 4 (5) -->
      <g transform="translate(165 290)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(315 290)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(465 290)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(615 290)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(765 290)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>

      <!-- Row 5 (6) -->
      <g transform="translate(90 360)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(240 360)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(390 360)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(540 360)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(690 360)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(840 360)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>

      <!-- Row 6 (5) -->
      <g transform="translate(165 430)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(315 430)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(465 430)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(615 430)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(765 430)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>

      <!-- Row 7 (6) -->
      <g transform="translate(90 500)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(240 500)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(390 500)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(540 500)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(690 500)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(840 500)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>

      <!-- Row 8 (5) -->
      <g transform="translate(165 570)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(315 570)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(465 570)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(615 570)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(765 570)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>

      <!-- Row 9 (6) -->
      <g transform="translate(90 640)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(240 640)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(390 640)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(540 640)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(690 640)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
      <g transform="translate(840 640)"><use href="#star" x="-32" y="-32" width="64" height="64"></use></g>
    </g>
  </g>
</svg>
