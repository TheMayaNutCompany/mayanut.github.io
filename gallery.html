<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Gallery – The MayaNut Company</title>
  <meta name="description" content="Gallery of The MayaNut Company — MayaNut trees, fruit, nursery work, branding, and early cultivation imagery." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://mayanut.com/gallery.html" />

  <link rel="icon" type="image/png" href="mayanut-the-maya-nut-company-logo.png" />
  <link rel="preload" as="image" href="menuart-the-maya-nut-company-art.jpeg" />

  <style>
    :root{
      --text-main:#0f172a;
      --text-muted:#6b7280;
      --accent-blue:#084ac5;
      --border-soft:#e5e7eb;
      --frame-line:#d1d5db;
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
    body{
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:#ffffff;
      color:var(--text-main);
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }
    img{ display:block; max-width:100%; }

    /* FRAME */
    .frame-wrap{
      max-width:1200px;
      margin:0 auto;
      border-left:1px solid var(--frame-line);
      border-right:1px solid var(--frame-line);
      min-height:100vh;
      background:#fff;
    }

    /* HEADER */
    .site-header{
      background-image:url("menuart-the-maya-nut-company-art.jpeg");
      background-size:cover;
      background-position:center;
      padding:16px 22px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      transform:translateY(3px);
    }

    #logo-top{
      width:120px;
      cursor:pointer;
    }

    .main-nav{
      display:flex;
      gap:16px;
    }
    .main-nav a{
      font-size:13px;
      letter-spacing:0.18em;
      text-transform:uppercase;
      text-decoration:none;
      color:#0f172a;
      font-weight:500;
    }

    .top-sep,
    .bottom-sep{
      height:1px;
      background:var(--frame-line);
      width:100%;
    }

    /* BODY */
    main{
      padding:26px 22px 40px;
    }

    .page-title{
      max-width:1100px;
      margin:0 auto 18px;
    }
    .kicker{
      font-size:11px;
      letter-spacing:0.16em;
      text-transform:uppercase;
      color:var(--text-muted);
      margin-bottom:6px;
    }
    h1{
      font-size:26px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:0.08em;
      font-style:italic;
    }

    /* GALLERY GRID */
    .gallery-grid{
      max-width:1100px;
      margin:0 auto;
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
      gap:16px;
    }

    .gallery-item{
      border-radius:18px;
      overflow:hidden;
      border:1px solid var(--border-soft);
      background:#f8fafc;
      aspect-ratio:1 / 1;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .gallery-item img{
      width:100%;
      height:100%;
      object-fit:cover;
      transition:transform .3s ease;
    }

    .gallery-item:hover img{
      transform:scale(1.04);
    }

    /* FOOTER */
    footer{
      background:radial-gradient(circle at top center,#e0f2fe,#bfdbfe 45%,#1d4ed8 120%);
      padding:16px 22px 26px;
    }

    .footer-inner{
      max-width:1100px;
      margin:0 auto;
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      font-size:11px;
    }

    .footer-logo img{
      width:80px;
      cursor:pointer;
    }

    .footer-links{
      display:flex;
      gap:10px;
      margin-top:4px;
    }
    .footer-links a{
      text-decoration:none;
      color:#0f172a;
      border-bottom:1px dotted rgba(15,23,42,.5);
    }

    .footer-right{
      display:flex;
      justify-content:flex-end;
      gap:10px;
    }

    .footer-right svg{
      width:26px;
      height:26px;
      stroke:#0f172a;
      fill:none;
      stroke-width:2;
    }

    @media(max-width:860px){
      .main-nav{ display:none; }
      .footer-inner{
        grid-template-columns:1fr;
        gap:6px;
        text-align:center;
      }
      .footer-right{ justify-content:center; }
    }
  </style>
</head>

<body>

<div class="frame-wrap">

  <!-- HEADER -->
  <header class="site-header">
    <img src="mayanut-the-maya-nut-company-logo.png" id="logo-top" alt="The MayaNut Company logo">
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="research.html">Research</a>
      <a href="gallery.html">Gallery</a>
      <a href="faq.html">FAQ</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <div class="top-sep"></div>

  <!-- MAIN -->
  <main>
    <div class="page-title">
      <div class="kicker">MayaNut • Brosimum alicastrum</div>
      <h1>Gallery</h1>
    </div>

    <section class="gallery-grid">

      <!-- PLACEHOLDER IMAGES (already used on site) -->
      <div class="gallery-item">
        <img src="maya-nut-mayanut-plant-tree-nursery.jpg" alt="MayaNut nursery">
      </div>

      <div class="gallery-item">
        <img src="maya-nut-mayanut-fruit-brosimum-alicastrum.jpg" alt="MayaNut fruit">
      </div>

      <div class="gallery-item">
        <img src="menuart-the-maya-nut-company-art.jpeg" alt="MayaNut brand art">
      </div>

      <div class="gallery-item">
        <img src="mayanut-the-maya-nut-company-logo.png" alt="The MayaNut Company logo">
      </div>

      <div class="gallery-item">
        <img src="maya-nut-mayanut-plant-tree-moraceae.jpg" alt="MayaNut Moraceae tree">
      </div>

      <div class="gallery-item">
        <img src="maya-nut-mayanut-fruit-brosimum-alicastrum.jpg" alt="MayaNut fruit detail">
      </div>

    </section>
  </main>

  <div class="bottom-sep"></div>

  <!-- FOOTER -->
  <footer>
    <div class="footer-inner">
      <div>
        © <span id="year"></span> The MayaNut Company, Inc.
        <div class="footer-links">
          <a href="privacy.html">Privacy</a>
          <a href="terms.html">Terms</a>
        </div>
      </div>

      <div class="footer-logo">
        <img src="mayanut-the-maya-nut-company-logo.png" alt="The MayaNut Company logo">
      </div>

      <div class="footer-right">
        <a href="mailto:themayanutcompany@gmail.com" aria-label="Email">
          <svg viewBox="0 0 24 24">
            <rect x="4" y="6" width="16" height="12" rx="2"></rect>
            <path d="M4 7l8 6 8-6"></path>
          </svg>
        </a>
        <a href="https://www.instagram.com/themayanutcompany" target="_blank" aria-label="Instagram">
          <svg viewBox="0 0 24 24">
            <rect x="3.5" y="3.5" width="17" height="17" rx="4"></rect>
            <circle cx="12" cy="12" r="4.2"></circle>
            <circle cx="17.3" cy="6.7" r="0.9"></circle>
          </svg>
        </a>
      </div>
    </div>
  </footer>

</div>

<script>
  document.getElementById("year").textContent = new Date().getFullYear();
  document.getElementById("logo-top").onclick = () => location.href = "index.html";
</script>

</body>
</html>
