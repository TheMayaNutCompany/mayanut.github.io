<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MayaNut Gradient Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #e5e7eb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrap {
      background: #ffffff;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(15,23,42,0.15);
      display: flex;
      gap: 16px;
    }
    .swatch {
      width: 180px;
      height: 130px;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
    }
    .label {
      position: absolute;
      top: 8px;
      left: 10px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.85);
      font-size: 11px;
    }
    .a {
      background: radial-gradient(circle at top center,
        #f4d9ff 0%,
        #e7c4ff 35%,
        #d0a8ff 70%,
        #c296ff 100%);
    }
    .b {
      background: radial-gradient(circle at top center,
        #ffd6f9 0%,
        #f2b8ff 35%,
        #d89aff 70%,
        #c077ff 100%);
    }
    .c {
      background: radial-gradient(circle at top center,
        #e4c8ff 0%,
        #c79bff 35%,
        #a979ff 70%,
        #8a5cf5 100%);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="swatch a">
      <div class="label">A – soft lavender</div>
    </div>
    <div class="swatch b">
      <div class="label">B – pinkish</div>
    </div>
    <div class="swatch c">
      <div class="label">C – deeper purple</div>
    </div>
  </div>
</body>
</html>
