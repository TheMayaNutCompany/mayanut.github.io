<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The MayaNut Company – Maya Nut • Brosimum alicastrum</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Basic SEO -->
  <meta name="description"
        content="The MayaNut Company is building a future food and reforestation industry around MayaNut (Brosimum alicastrum, ramón, ojoche, breadnut) – a resilient tropical tree with edible seeds and deep ecological value." />
  <meta name="keywords"
        content="MayaNut, Maya Nut, Brosimum alicastrum, ramón, ojoche, breadnut, nuez de ramón, tropical superfood, tree superfood, agroforestry, reforestation, South Florida, The MayaNut Company, jackfruit family" />
  <meta name="author" content="The MayaNut Company, Inc." />

  <link rel="icon" type="image/png" href="mayanut-the-maya-nut-company-logo.png" />

  <style>
    :root{
      --text-main: #0f172a;
      --text-muted: #6b7280;
      --accent-blue: #084ac5;
      --accent-cyan: #07edda;
      --border-soft: #e5e7eb;
      --green: #16a34a;
      --bg-color: #07edda; /* Transparent version of button blue */
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
    body{
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:linear-gradient(to bottom,#d1fae5,#bbf7d0,#a7f3d0); /* Light green gradient background */
      color:var(--text-main);
      -webkit-font-smoothing:antialiased;
      overflow: hidden;
      position:relative;
    }
    img{ max-width:100%; display:block; }

    main{
      min-height:100vh;
      padding:20px 12px 40px;
      display:flex;
      justify-content:center;
    }

    .page-frame{
      width:100%;
      max-width:1050px;
      background:transparent; /* let outer gradient show in gaps */
      border-radius:28px;
      box-shadow:0 20px 60px rgba(15,23,42,0.08);
      overflow:visible;
      position:relative;
    }

    /* FLOATING LOGO – fixed, in the green/grey frame, upper-left */
    .floating-logo{
      position:fixed;
      top:16px;
      left:16px;        /* move it way left into the background frame */
      z-index:60;
      pointer-events:none;
    }
    .floating-logo img{
      width:120px;      /* good size, can tweak */
      cursor:pointer;
      pointer-events:auto;
    }

    /* HEADER / TOP TAB */
    .site-header{
      padding:14px 22px;
      background:#ffffff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      position:relative;
      z-index:10;
      border-radius:28px 28px 0 0;
    }

    .header-left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    /* Gear icon */
    .icon-gear{
      width:30px;
      height:30px;
      border-radius:999px;
      border:1px solid #d1d5db;
      background:rgba(7,237,218,0.18);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      backdrop-filter:blur(8px);
    }
    .icon-gear svg{
      width:16px;
      height:16px;
      fill:#4b5563;
    }

    .header-center{
      flex:1;
    }

    .header-right{
      display:flex;
      align-items:center;
      gap:10px;
    }

    /* Hamburger menu */
    .icon-menu{
      width:30px;
      height:30px;
      border-radius:999px;
      border:1px solid #d1d5db;
      background:rgba(7,237,218,0.18);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      backdrop-filter:blur(8px);
    }
    .icon-menu svg{
      width:16px;
      height:16px;
      fill:#4b5563;
    }

    /* GAP BETWEEN HEADER AND MAIN CONTENT – shows outer background */
    .tab-gap{
      height:38px;
      background:transparent;
      width:100%;
    }

    /* MAIN CONTENT WRAPPER (white -> light grey) */
    .content-wrapper{
      background:linear-gradient(to bottom,var(--bg-frame-top),var(--bg-frame-mid),var(--bg-frame-bottom));
      border-radius:20px;
      padding:26px 22px 30px;
      width:100%;
    }

    /* HERO LAYOUT */
    #hero{
      display:grid;
      grid-template-columns:1.1fr 1.1fr;
      gap:26px;
    }
    @media(max-width:880px){
      #hero{
        grid-template-columns:1fr;
      }
    }

    .hero-left{
      display:flex;
      flex-direction:column;
      gap:14px;
      justify-content:flex-start;
    }

    /* placeholder image above text */
    .hero-placeholder{
      margin-bottom:10px;
    }
    .hero-placeholder img{
      max-width:260px;
      border-radius:16px;
      box-shadow:0 12px 30px rgba(15,23,42,0.22);
    }

    .hero-kicker{
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:0.16em;
      color:var(--text-muted);
    }

    .hero-title{
      font-size:clamp(24px, 3vw, 30px);
      line-height:1.1;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:0.08em;
      color:#000000;
      font-style:italic;
    }
    .hero-title span{
      color:var(--accent-blue);
      text-decoration:underline;
      text-decoration-thickness:2px;
      text-underline-offset:2px;
    }

    .hero-sub{
      font-size:14px;
      line-height:1.9;
      color:var(--text-muted);
    }
    .hero-sub em{ font-style:italic; }
    .hero-sub .name-green{
      color:var(--green);
      font-weight:600;
    }

    .hero-cta-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:6px;
    }
    .btn{
      padding:8px 16px;
      border-radius:999px;
      border:1px solid rgba(148,163,184,0.7);
      background:rgba(7,237,218,0.16);
      color:#111827;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:0.14em;
      cursor:pointer;
      backdrop-filter:blur(8px);
      transition:background .16s ease,border-color .16s ease;
    }
    .btn:hover{
      background:rgba(7,237,218,0.22);
      border-color:#9ca3af;
    }

    .hero-meta{
      margin-top:4px;
      font-size:11px;
      color:#6b7280;
    }
    .hero-meta strong{ color:#111827; }
      </ul>
    </div>
  </div>

  <!-- SCRIPT SECTION -->
  <script>
    // Scroll to top when clicking floating or footer logo
    const floatingLogo = document.getElementById('floating-logo-img');
    const footerLogo = document.getElementById('footer-logo');
    function scrollTopSmooth(e){
      e.preventDefault();
      window.scrollTo({top:0, behavior:'smooth'});
    }
    if(floatingLogo) floatingLogo.addEventListener('click', scrollTopSmooth);
    if(footerLogo) footerLogo.addEventListener('click', scrollTopSmooth);

    // Footer year auto-update
    document.getElementById('year').textContent = new Date().getFullYear();

    // SETTINGS OVERLAY
    const settingsBtn = document.getElementById('settings-btn');
    const settingsOverlay = document.getElementById('settings-overlay');
    if(settingsBtn){
      settingsBtn.addEventListener('click', ()=> settingsOverlay.classList.add('active'));
    }

    // MENU OVERLAY
    const menuBtn = document.getElementById('menu-btn');
    const menuOverlay = document.getElementById('menu-overlay');
    if(menuBtn){
      menuBtn.addEventListener('click', ()=> menuOverlay.classList.add('active'));
    }

    // CLOSE ANY OVERLAY (except welcome)
    document.querySelectorAll('.overlay-close').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.getAttribute('data-close');
        const panel = document.getElementById(id);
        if(panel) panel.classList.remove('active');
      });
    });

    // Close overlay when clicking background
    document.querySelectorAll('.overlay').forEach(ov=>{
      if(ov.id !== 'welcome-overlay'){ // do NOT allow closing welcome overlay by accident
        ov.addEventListener('click', e=>{
          if(e.target === ov) ov.classList.remove('active');
        });
      }
    });

    // CHANGE LANGUAGE (Settings panel)
    const settingsLang = document.getElementById('settings-lang');
    if(settingsLang){
      settingsLang.addEventListener('change', ()=>{
        const selected = settingsLang.value;
        if(selected !== 'en'){
          window.location.href = `index-${selected}.html`;
        }
      });
    }

    // DARK THEME
    const darkLink = document.getElementById('dark-link');
    if(darkLink){
      darkLink.addEventListener('click', ()=>{
        window.location.href = 'index-dark.html';
      });
    }

    // MENU NAVIGATION BUTTONS
    document.querySelectorAll('.menu-list button').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const dest = btn.getAttribute('data-nav');
        if(dest) window.location.href = dest;
      });
    });

    // HERO BUTTON NAVIGATION
    document.querySelectorAll('.btn[data-nav]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const link = btn.getAttribute('data-nav');
        if(link) window.location.href = link;
      });
    });

    //-------------------------------
    // 🔍 SEARCH BAR FUNCTIONALITY
    //-------------------------------
    const searchInput = document.getElementById('store-search');
    const searchButton = document.getElementById('store-search-btn');

    // Show arrow button when typing
    searchInput.addEventListener('input', ()=>{
      const val = searchInput.value.trim();
      searchButton.style.opacity = val.length > 0 ? '1' : '0';
    });

    // Execute search function
    function runSearch(){
      const q = searchInput.value.trim().toLowerCase();
      document.querySelectorAll('.product-card').forEach(card=>{
        const name = (card.dataset.name || '').toLowerCase();
        if(q && name.includes(q)) {
          card.style.opacity = '1';
          card.style.transform = 'scale(1.02)';
        } else if(q) {
          card.style.opacity = '0.25';
          card.style.transform = 'scale(1.0)';
        } else {
          card.style.opacity = '1';
          card.style.transform = 'scale(1.0)';
        }
      });
    }

    searchButton.addEventListener('click', runSearch);
    searchInput.addEventListener('keypress', (e)=>{
      if(e.key === 'Enter') runSearch();
    });

    //-------------------------------
    // FULL STORE BUTTON
    //-------------------------------
    const fullStoreBtn = document.getElementById('store-view-full');
    if(fullStoreBtn){
      fullStoreBtn.addEventListener('click', ()=>{
        window.location.href = 'store.html';
      });
    }

    //-------------------------------
    // PRODUCT CARD → store.html
    //-------------------------------
    document.querySelectorAll('.product-card').forEach(card=>{
      card.addEventListener('click', ()=>{
        window.location.href = 'store.html';
      });
    });

    //-------------------------------
    // WELCOME OVERLAY LOGIC
    //-------------------------------
    const welcomeOverlay = document.getElementById('welcome-overlay');
    const welcomeLang    = document.getElementById('welcome-lang');
    const welcomeProceed = document.getElementById('welcome-proceed');

    welcomeProceed.addEventListener('click', ()=>{
      const lang = welcomeLang.value;
      if(lang !== 'en'){
        window.location.href = `index-${lang}.html`;
        return;
      }
      welcomeOverlay.classList.remove('active');
    });

    document.querySelector('[data-close="welcome-overlay"]').addEventListener('click', ()=>{
      welcomeOverlay.classList.remove('active');
    });
  </script>
</body>
</html>
