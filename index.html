<!-- =========================
FILE: store.html
(Full store page. "Close Store" returns to index.html)
========================= -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="x-ua-compatible" content="ie=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Store | The MayaNut Company</title>
  <meta name="description" content="The MayaNut Company store — MayaNut products coming soon." />
  <link rel="canonical" href="https://mayanut.com/store.html" />
  <meta name="robots" content="index,follow" />

  <link rel="icon" type="image/png" href="mayanut-the-mayanut-comapny-logo.png" />
  <meta name="theme-color" content="#1a6800" />

  <style>
    /* Keep store.html self-contained by reusing the same core tokens + minimal layout */
    :root{
      --text-main:#0f172a;
      --green:#1a6800;
      --green-deep:#0b3b17;
      --frame-line: rgba(12, 90, 42, 0.95);
      --tan:#f3e6d1;
      --tan-top:#c9a981;
      --tan-top2:#e7d5b6;

      --orange:#fd6c02;
      --orange-dark:#e95f02;
      --orange-mid:#ff7a1a;
      --orange-hi:#ffd2a8;

      --cream:#ffffc5;

      --store-g1:#d8ff6a;
      --store-g2:#7ae78a;
      --store-g3:#1a6800;

      --store-green-grad: linear-gradient(
        to bottom,
        var(--store-g1) 0%,
        var(--store-g2) 52%,
        var(--store-g3) 100%
      );

      --metal-orange: linear-gradient(
        180deg,
        var(--orange-hi) 0%,
        var(--orange-mid) 18%,
        var(--orange) 48%,
        var(--orange-dark) 72%,
        var(--orange-mid) 100%
      );

      --para-bg: rgba(255,255,255,0.82);
      --font-pretty: "Palatino Linotype", Palatino, Georgia, serif;
      --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      --shadow: 0 18px 55px rgba(15,23,42,0.18);
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
    body{
      font-family: var(--font-sans);
      background: var(--tan);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }
    img{ max-width:100%; display:block; }

    .wrap{
      max-width: 1240px;
      margin: 18px auto 28px;
      padding: 0 16px;
    }

    .topbar{
      border-radius:18px;
      border:2px solid var(--frame-line);
      background: var(--store-green-grad);
      box-shadow: var(--shadow);
      padding: 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .top-left{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }
    .logo{
      width:78px;
      height:auto;
      filter: drop-shadow(0 10px 18px rgba(15,23,42,0.18));
      user-select:none;
      -webkit-user-select:none;
    }
    .title{
      font-weight:950;
      letter-spacing:.18em;
      text-transform:uppercase;
      font-size:13px;
      color:#0b1220;
      text-shadow:0 1px 0 rgba(255,255,255,0.35);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .metal-btn{
      border: 1px solid var(--cream);
      background: var(--metal-orange);
      color: var(--cream);
      border-radius: 12px;
      padding:10px 12px;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:0.10em;
      font-weight:950;
      cursor:pointer;
      user-select:none;
      -webkit-user-select:none;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:160px; /* same size feel as before */
      min-height:38px;
      box-shadow: 0 10px 22px rgba(15,23,42,0.10);
    }

    .panel{
      margin-top:14px;
      border-radius:18px;
      border:2px solid var(--frame-line);
      background: var(--store-green-grad);
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .store-search{
      height:44px;
      border-radius:999px;
      border:1px solid rgba(12,90,42,.65);
      background: var(--para-bg);
      display:flex;
      align-items:center;
      overflow:hidden;
      width:100%;
      position:relative;
      box-shadow:0 10px 20px rgba(15,23,42,0.10);
      margin-bottom:12px;
    }
    .store-search .mag,
    .store-search .xbtn{
      width:46px;height:44px;
      display:flex;align-items:center;justify-content:center;
      flex:0 0 46px;
      cursor:pointer;
      user-select:none;
    }
    .store-search .mag svg,
    .store-search .xbtn svg{
      width:19px;height:19px;
      stroke:var(--orange);
      fill:none;
      stroke-width:2.2;
      stroke-linecap:round;
      stroke-linejoin:round;
      opacity:.98;
    }
    .store-search input{
      border:none;
      outline:none;
      background:transparent;
      color:#0b1220;
      font-weight:950;
      letter-spacing:.02em;
      font-size:12px;
      padding:0 10px;
      width:100%;
      min-width:0;
      caret-color: var(--orange);
    }
    .store-search input::placeholder{ color: rgba(12,90,42,.92); font-weight:950; }
    .blink-on-focus::placeholder{ animation: blinkPH 1s steps(2,end) infinite; }
    @keyframes blinkPH{ 0%,49%{opacity:1} 50%,100%{opacity:.25} }

    .grid{
      display:grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap:12px;
    }

    .product-card{
      border-radius: 18px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.95) 0%, rgba(156,163,175,0.55) 60%, rgba(55,65,81,0.40) 100%);
      border:1px solid var(--frame-line);
      padding:10px 10px 12px;
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      min-height:260px;
      gap:10px;
    }
    .pimg{
      width:100%;
      max-width: 170px;
      height:160px;
      border-radius:16px;
      border:1px solid var(--frame-line);
      background:#fff;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .pimg img{ width:100%; height:100%; object-fit:cover; }
    .ptitle{
      font-size:13px;
      font-weight:950;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      line-height:1.15;
    }
    .ptitle .dot{ font-size:14px; transform: translateY(-1px); }

    .add-row{
      margin-top:auto;
      width:100%;
      display:flex;
      justify-content:center;
      align-items:stretch;
      gap:0;
    }
    .sq-btn{
      width:34px;
      border:1px solid var(--cream);
      background: var(--metal-orange);
      color:var(--cream);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
      -webkit-user-select:none;
      touch-action:manipulation;
      font-weight:950;
    }
    .sq-btn.left{ border-radius:12px 0 0 12px; }
    .sq-btn.right{ border-radius:0 12px 12px 0; }
    .add-box{
      border-top:1px solid var(--cream);
      border-bottom:1px solid var(--cream);
      background: rgba(255,255,255,0.14);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:6px 8px;
      min-width:160px;
    }
    .add-btn{
      border:1px solid var(--cream);
      background: var(--metal-orange);
      color: var(--cream);
      font-weight:950;
      letter-spacing:.10em;
      text-transform:uppercase;
      font-size:11px;
      border-radius:10px;
      padding:6px 10px;
      cursor:pointer;
      white-space:nowrap;
      user-select:none;
      -webkit-user-select:none;
      touch-action:manipulation;
    }
    .qty-pill{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:46px;
      height:28px;
      border-radius:10px;
      background: rgba(255,255,255,0.22);
      border:1px solid rgba(255,255,255,0.45);
      position:relative;
      user-select:none;
      -webkit-user-select:none;
    }
    .qty-pill::before{
      content:"";
      position:absolute;
      inset:2px;
      border-radius:8px;
      background: rgba(255,255,255,0.10);
      pointer-events:none;
    }
    .qty-num{
      position:relative;
      z-index:1;
      font-weight:950;
      color:rgba(255,255,197,.98);
      text-shadow:0 1px 0 rgba(0,0,0,0.20);
      font-size:12px;
    }

    @media(max-width:980px){
      .grid{ grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    @media(max-width:540px){
      .grid{ grid-template-columns: 1fr 1fr; }
      .store-search{ margin-bottom:10px; }
      .topbar{ flex-direction:column; align-items:stretch; }
      .top-left{ justify-content:flex-start; }
      .metal-btn{ width:100%; min-width:0; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar" aria-label="Store top bar">
      <div class="top-left">
        <img class="logo" src="mayanut-the-mayanut-comapny-logo.png" alt="The MayaNut Company logo" />
        <div class="title">FULL STORE — COMING SOON</div>
      </div>

      <!-- As requested: same size feel, says Close Store, returns home -->
      <a class="metal-btn" href="index.html" aria-label="Close store">CLOSE STORE</a>
    </div>

    <div class="panel" aria-label="Store products">
      <div class="store-search" aria-label="Search products">
        <div class="mag" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="6.5"></circle>
            <path d="M16.2 16.2L21 21"></path>
          </svg>
        </div>
        <input id="store-search" type="text" placeholder="Search MayaNut Products..." autocomplete="off" />
        <div class="xbtn" id="store-search-clear" aria-label="Clear search">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12"></path>
            <path d="M18 6L6 18"></path>
          </svg>
        </div>
      </div>

      <!-- 4 in a row on desktop -->
      <div class="grid" id="grid">
        <article class="product-card" data-title="MayaNut Powder">
          <div class="pimg" aria-hidden="true">
            <img src="mayanut-powder-maya-nut-brosimum-alicastrum.png" alt="MayaNut Powder product image" loading="eager" decoding="async">
          </div>
          <div class="ptitle"><span class="dot">🟠</span> MayaNut Powder</div>
          <div class="add-row">
            <button class="sq-btn left" type="button" data-action="minus" aria-label="Decrease quantity">−</button>
            <div class="add-box">
              <button class="add-btn" type="button" data-action="add">ADD</button>
              <div class="qty-pill"><span class="qty-num" data-qty>1</span></div>
            </div>
            <button class="sq-btn right" type="button" data-action="plus" aria-label="Increase quantity">+</button>
          </div>
        </article>

        <article class="product-card" data-title="MayaNut Instant Latte">
          <div class="pimg" aria-hidden="true">
            <img src="mayanut-powder-maya-nut-brosimum-alicastrum.png" alt="MayaNut Instant Latte product image" loading="lazy" decoding="async">
          </div>
          <div class="ptitle"><span class="dot">🟠</span> MayaNut Instant Latte</div>
          <div class="add-row">
            <button class="sq-btn left" type="button" data-action="minus" aria-label="Decrease quantity">−</button>
            <div class="add-box">
              <button class="add-btn" type="button" data-action="add">ADD</button>
              <div class="qty-pill"><span class="qty-num" data-qty>1</span></div>
            </div>
            <button class="sq-btn right" type="button" data-action="plus" aria-label="Increase quantity">+</button>
          </div>
        </article>

        <article class="product-card" data-title="MayaNut Baking Blend">
          <div class="pimg" aria-hidden="true">
            <img src="mayanut-powder-maya-nut-brosimum-alicastrum.png" alt="MayaNut Baking Blend product image" loading="lazy" decoding="async">
          </div>
          <div class="ptitle"><span class="dot">🟠</span> MayaNut Baking Blend</div>
          <div class="add-row">
            <button class="sq-btn left" type="button" data-action="minus" aria-label="Decrease quantity">−</button>
            <div class="add-box">
              <button class="add-btn" type="button" data-action="add">ADD</button>
              <div class="qty-pill"><span class="qty-num" data-qty>1</span></div>
            </div>
            <button class="sq-btn right" type="button" data-action="plus" aria-label="Increase quantity">+</button>
          </div>
        </article>

        <article class="product-card" data-title="MayaNut Mug">
          <div class="pimg" aria-hidden="true">
            <img src="mayanut-powder-maya-nut-brosimum-alicastrum.png" alt="MayaNut Mug product image" loading="lazy" decoding="async">
          </div>
          <div class="ptitle"><span class="dot">🟠</span> MayaNut Mug</div>
          <div class="add-row">
            <button class="sq-btn left" type="button" data-action="minus" aria-label="Decrease quantity">−</button>
            <div class="add-box">
              <button class="add-btn" type="button" data-action="add">ADD</button>
              <div class="qty-pill"><span class="qty-num" data-qty>1</span></div>
            </div>
            <button class="sq-btn right" type="button" data-action="plus" aria-label="Increase quantity">+</button>
          </div>
        </article>
      </div>
    </div>
  </div>

  <script>
    // Search: blink on focus + clear
    (function(){
      const input = document.getElementById("store-search");
      const clear = document.getElementById("store-search-clear");
      if(!input) return;

      input.addEventListener("focus", ()=> input.classList.add("blink-on-focus"));
      input.addEventListener("blur", ()=> input.classList.remove("blink-on-focus"));

      clear?.addEventListener("click", ()=>{
        input.value = "";
        input.focus();
      });
    })();

    // Qty controls: click + hold (medium auto-repeat), min 1 max 99
    (function(){
      const clamp = (n)=> Math.max(1, Math.min(99, n));

      function startHold(stepFn){
        const state = { t0:null, ti:null };
        state.t0 = setTimeout(()=>{
          state.ti = setInterval(stepFn, 110);
        }, 260);
        stepFn();
        return state;
      }
      function stopHold(state){
        if(!state) return;
        clearTimeout(state.t0);
        clearInterval(state.ti);
      }

      function wireCard(card){
        const qtyEl = card.querySelector("[data-qty]");
        const minus = card.querySelector("[data-action='minus']");
        const plus  = card.querySelector("[data-action='plus']");
        const add   = card.querySelector("[data-action='add']");
        let qty = 1;

        const render = ()=>{ if(qtyEl) qtyEl.textContent = String(qty); };

        const stepMinus = ()=>{ qty = clamp(qty - 1); render(); };
        const stepPlus  = ()=>{ qty = clamp(qty + 1); render(); };

        function bindHold(btn, stepFn){
          if(!btn) return;
          let holdState = null;

          const down = (e)=>{
            e.preventDefault();
            if(holdState) return;
            holdState = startHold(stepFn);
          };
          const up = ()=>{
            stopHold(holdState);
            holdState = null;
          };

          btn.addEventListener("pointerdown", down);
          btn.addEventListener("pointerup", up);
          btn.addEventListener("pointercancel", up);
          btn.addEventListener("pointerleave", up);
          btn.addEventListener("contextmenu", (e)=> e.preventDefault());
        }

        bindHold(minus, stepMinus);
        bindHold(plus, stepPlus);

        add?.addEventListener("click", ()=> alert("This function is unavailable yet."));
        render();
      }

      document.querySelectorAll(".product-card").forEach(wireCard);
    })();
  </script>
</body>
</html>
