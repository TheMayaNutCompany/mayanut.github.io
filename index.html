<!-- A LITTLE ABOUT US (paragraphs on top, images on bottom) -->
<section class="about-us" id="about-us" aria-label="A Little About Us">
  <style>
    .about-us{
      max-width:1200px;
      margin:18px auto 0;
      border-radius:18px;
      border:2px solid var(--frame-line, rgba(12, 90, 42, 0.95));
      background: var(--para-bg, rgba(255,255,255,0.82));
      box-shadow: 0 12px 30px rgba(15,23,42,0.10);
      padding:14px;
      overflow:hidden;
    }
    .about-us .about-title{
      font-weight:950;
      letter-spacing:0.14em;
      text-transform:uppercase;
      font-size:12px;
      color:#0b1220;
      text-shadow:0 1px 0 rgba(255,255,255,0.35);
      margin-bottom:10px;
    }
    .about-us .about-text{
      font-family: var(--font-pretty, "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif);
      font-style: italic;
      font-weight:850;
      color: var(--green-deep, #0b3b17);
      line-height:1.85;
      font-size:14px;
      text-shadow:0 1px 0 rgba(255,255,255,0.45);
      margin-bottom:10px;
    }
    .about-us .about-text p{ margin:0 0 10px; }
    .about-us .about-text p:last-child{ margin-bottom:0; }

    .about-us .about-images{
      margin-top:14px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
      align-items:start;
    }
    .about-us .about-images img{
      width:100%;
      aspect-ratio: 4 / 3;
      border-radius:16px;
      object-fit:cover;
      border:2px solid var(--frame-line, rgba(12, 90, 42, 0.95));
      background:#fff;
    }

    @media (max-width:780px){
      .about-us .about-images{ grid-template-columns: 1fr; }
    }
  </style>

  <div class="about-title">A Little About Us</div>

  <div class="about-text">
    <p>
      The MayaNut Company is building a South Florida farm focused on
      <em style="color:var(--orange, #fd6c02);font-weight:950;">Brosimum alicastrum</em>.
    </p>
    <p>
      We’re growing seed-grown trees, testing what performs best, and developing future-ready MayaNut products—while sharing research and farm progress as we scale.
    </p>
  </div>

  <div class="about-images" aria-label="About images">
    <img
      src="maya-nut-mayanut-plant-tree-nursery.jpg"
      alt="Seed-grown MayaNut trees in a nursery"
      loading="lazy"
      decoding="async"
    />
    <img
      src="maya-nut-mayanut-fruit-brosimum-alicastrum.jpg"
      alt="MayaNut fruit on the tree"
      loading="lazy"
      decoding="async"
    />
  </div>
</section>
