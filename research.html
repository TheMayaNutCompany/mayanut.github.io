<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="x-ua-compatible" content="ie=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Research Database | The MayaNut Company</title>

  <!-- SEO -->
  <meta name="description" content="Research Database for MayaNut™ (Brosimum alicastrum): explore research and facts about MayaNut—cultivation, range, food traits, cold tolerance, processing, and Florida observations." />
  <meta name="keywords" content="The MayaNut Company,MayaNut,Brosimum alicastrum,research database,cultivation,cold hardiness,range,agriculture,reforestation,processing,seed traits,Florida farm,morphology" />
  <link rel="canonical" href="https://mayanut.com/research.html" />
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />

  <link rel="icon" type="image/png" href="mayanut-the-mayanut-comapny-logo.png" />
  <link rel="apple-touch-icon" href="mayanut-the-mayanut-comapny-logo.png" />
  <meta name="theme-color" content="#066100" />
  <meta name="format-detection" content="telephone=no" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Acme&display=swap" rel="stylesheet" />

  <style>
    :root{
      --green:#066100;
      --orange:#fd6c02;

      --pale:#e9ffd6;

      --page:#ffffff;
      --softBorder: 1px solid rgba(12,90,42,0.45);
      --softShadow: 0 14px 40px rgba(15,23,42,0.06);

      --font-ui: "Acme", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;

      --stickyOffset: 170px;
      --navH: 152px;

      --darkOrange: rgba(0,0,0,0.18);

      /* match index/store walls */
      --maxw: 1200px;

      --titleDark:#1f2937;
      --subGrey: rgba(31,41,55,.62);

      --searchLine: rgba(216,255,106,0.75); /* lime-ish divider in green bar */
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }

    html{
      background: var(--page);
      overflow-x:hidden;
      scroll-padding-top: calc(var(--stickyOffset) + 14px);
      text-rendering: geometricPrecision;
      -webkit-text-size-adjust: 100%;
    }

    body{
      font-family: var(--font-ui);
      background:#fff;
      color:#0f172a;
      -webkit-font-smoothing: antialiased;
      overflow-x:hidden;
      overscroll-behavior-y:none;
    }

    img{ max-width:100%; height:auto; display:block; }
    a{ color:inherit; text-decoration:none; }
    button,input{ font-family:inherit; }

    .top-banner{ height:18px; background: var(--green); border-bottom: 1px solid rgba(255,255,255,0.18); }

    .frame-wrap{ position:relative; width:100%; min-height:100vh; padding-top: var(--stickyOffset); overflow-x: clip; }

    .sticky-top{
      position:fixed; top:0; left:0; right:0;
      z-index:999;
      background: var(--green);
      box-shadow:0 10px 28px rgba(15,23,42,0.12);
      transform: translateZ(0);
      border-bottom: 1px solid rgba(12,90,42,0.55);
    }

    .site-header{
      width:100%;
      background-image:url("menuart-the-maya-nut-company-art.jpeg");
      background-size:cover;
      background-position:center center;
      background-repeat:no-repeat;
      padding: 26px 0 26px;
      display:flex; align-items:center; justify-content:center;
      position:relative; min-height: var(--navH);
      overflow:visible;
    }
    .site-header::after{
      content:""; position:absolute; inset:0;
      background: linear-gradient(to bottom, rgba(255,255,255,0.06), rgba(255,255,255,0.0) 58%);
      pointer-events:none;
    }

    .brand-group{
      position:absolute;
      left:50%;
      top:56%;
      transform: translate(-54%, -50%);
      display:flex;
      align-items:center;
      gap:12px;
      z-index:2;
      pointer-events:none;
      user-select:none;
      white-space:nowrap;
    }
    .brand-logo{ width:78px; height:78px; object-fit:contain; filter: drop-shadow(0 14px 30px rgba(15,23,42,0.22)); }
    .brand-text{
      font-weight:900;
      letter-spacing:.06em;
      font-size:44px;
      color: #d8ff6a;
      -webkit-text-stroke: 0.9px rgba(11,59,23,0.95);
      text-shadow:0 14px 34px rgba(15,23,42,0.20);
    }

    .main-nav{
      position:absolute; left:0; right:0;
      top:56%;
      transform: translateY(-50%);
      height:56px;
      z-index:5;
      pointer-events:none;
    }
    .nav-left,.nav-right{
      position:absolute;
      top:50%;
      transform: translateY(-50%);
      display:flex;
      align-items:center;
      gap:10px;
      pointer-events:auto;
      white-space:nowrap;
      z-index:6;
    }
    .nav-left{ left:12px; }
    .nav-right{ right:12px; }

    .pill-btn{
      height:40px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.55);
      background: var(--orange);
      box-shadow:0 10px 22px rgba(15,23,42,0.12);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
      padding:0 14px;
      gap:8px;
      color:#ffffff;
      letter-spacing:0.12em;
      text-transform:uppercase;
      font-size:12px;
      font-weight:900;
      white-space:nowrap;
      transition: box-shadow .12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .pill-btn:hover{ box-shadow: inset 0 0 0 999px var(--darkOrange), 0 10px 22px rgba(15,23,42,0.12); }

    .menu-row{
      position:absolute;
      left:50%;
      top: calc(56% + 44px);
      transform: translate(-54%, -50%);
      z-index:4;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:18px;
      pointer-events:auto;
      user-select:none;
      white-space:nowrap;
    }
    .menu-row a{
      position:relative;
      font-weight:900;
      font-size:17px;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:#ffffff;
      text-shadow:0 10px 22px rgba(15,23,42,0.18);
      padding:2px 0;
      line-height:1;
    }
    .menu-row a.is-active{ color: var(--orange); }

    main{ background:#ffffff; min-height: calc(100vh - var(--stickyOffset)); }

    .content-wrapper{
      padding: 18px 16px 28px;
      max-width: var(--maxw);
      margin:0 auto;
    }

    .oframe{
      border-radius:18px;
      background: transparent;
      padding:0;
      box-shadow: var(--softShadow);
      border: var(--softBorder);
      overflow:hidden;
    }

    /* ===== TOP GREEN BAR (now full “normal” thickness) ===== */
    .frame-topbar{
      height: 56px; /* was thin; now “normal thickness” */
      background: var(--green);
      border-bottom: 1px solid rgba(255,255,255,0.18);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding: 0 14px;
    }

    .topbar-title{
      font-weight:950;
      letter-spacing:.14em;
      text-transform:uppercase;
      font-size:14px;
      color:#ffffff;
      white-space:nowrap;
    }

    .topbar-right{
      display:flex;
      align-items:center;
      gap:12px;
      min-width: 0;
    }

    .topbar-divider{
      width: 6px;
      height: 34px;
      border-radius: 999px;
      background: var(--searchLine);
      opacity: .95;
      flex:0 0 auto;
    }

    .searchbar{
      height:40px;
      border-radius:14px;
      border: 1px solid rgba(255,255,255,0.55);
      background: rgba(255,255,255,0.96);
      display:flex;
      align-items:center;
      overflow:hidden;
      width: 420px;
      max-width: min(520px, 48vw);
      box-shadow:0 10px 18px rgba(15,23,42,0.10);
    }
    .searchbar .mag{
      width:40px; height:40px;
      display:flex; align-items:center; justify-content:center;
      flex:0 0 40px;
      user-select:none;
    }
    .searchbar .mag svg{ width:16px; height:16px; stroke: var(--orange); fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
    .searchbar input{
      border:none; outline:none; background:transparent; color:#0b1220;
      font-weight:900; letter-spacing:.01em; font-size:12px;
      padding:0 10px 0 2px; width:100%; min-width:0;
      caret-color: var(--orange);
    }
    .searchbar .xbtn{
      width:40px; height:40px;
      display:flex; align-items:center; justify-content:center;
      flex:0 0 40px; cursor:pointer;
      user-select:none;
      background:transparent;
    }
    .searchbar .xbtn svg{ width:16px; height:16px; stroke: rgba(15,23,42,0.70); fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }

    /* ===== WHITE HEADER (updated copy) ===== */
    .research-head{
      background:#ffffff;
      padding: 14px 14px 12px;
      border-bottom: var(--softBorder);
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .head-title{
      font-weight:950;
      letter-spacing:.02em;
      font-size:26px;
      color:#0b1220;
      line-height:1.05;
    }
    .head-sub{
      font-weight:950;
      font-size:14px;
      letter-spacing:.02em;
      color: var(--orange);
      text-decoration: underline;
      text-underline-offset: 3px;
      line-height:1.25;
    }

    .research-body{ background:#ffffff; padding: 12px 14px 16px; }

    /* ===== LIST (no “PROJECT FILES” green tab) ===== */
    .panel-body{
      padding: 0;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    /* Row format: [icon] [title/sub] [ONE image] */
    .topic-row{
      display:grid;
      grid-template-columns: 72px 1fr 132px;
      gap:12px;
      align-items:center;
      border-radius:16px;
      border: var(--softBorder);
      background:#ffffff;
      overflow:hidden;
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .topic-row:hover{
      transform: translateY(-1px);
      box-shadow:0 14px 26px rgba(15,23,42,0.10);
    }

    .topic-icon{
      height:100%;
      min-height:74px;
      background: var(--orange);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .topic-icon svg{
      width:34px; height:34px;
      fill:none;
      stroke:#ffffff;
      stroke-width:2.2;
      stroke-linecap:round;
      stroke-linejoin:round;
      opacity:0.98;
      filter: drop-shadow(0 10px 18px rgba(15,23,42,0.16));
    }

    .topic-text{
      padding: 10px 0;
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .topic-title{
      font-weight:950;
      letter-spacing:.06em;
      text-transform:uppercase;
      font-size:14px;
      color: var(--titleDark);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      line-height:1.12;
    }
    .topic-sub{
      font-weight:900;
      font-size:12.5px;
      line-height:1.45;
      color: var(--subGrey);
      overflow:hidden;
      display:-webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      padding-right: 8px;
    }

    .topic-image{
      height:100%;
      background: var(--pale);
      border-left: var(--softBorder);
      padding: 10px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .topic-image img{
      width:100%;
      aspect-ratio: 1 / 1;
      border-radius:12px;
      border: var(--softBorder);
      object-fit:cover;
      background:#ffffff;
    }

    /* Small line under list for match count */
    .count-row{
      margin-top: 10px;
      display:flex;
      justify-content:flex-end;
    }
    .count-pill{
      font-weight:950;
      letter-spacing:.10em;
      text-transform:uppercase;
      font-size:10px;
      background: var(--pale);
      border: var(--softBorder);
      padding:8px 12px;
      border-radius:999px;
      color:#0b1220;
    }

    @media(max-width:980px){
      .brand-text{ font-size:36px; }
      .menu-row{ flex-wrap:wrap; gap:14px; }
    }
    @media(max-width:860px){
      .searchbar{ width: 100%; max-width:none; }
      .frame-topbar{ flex-wrap:wrap; height:auto; padding: 10px 14px; }
      .topbar-right{ width:100%; justify-content:flex-end; }
    }
    @media(max-width:680px){
      .topic-row{ grid-template-columns: 72px 1fr; }
      .topic-image{
        grid-column: 1 / -1;
        border-left:none;
        border-top: var(--softBorder);
        justify-content:flex-start;
      }
      .topic-image img{ width: 160px; }
    }
  </style>
</head>

<body>
  <div class="top-banner" aria-hidden="true"></div>

  <div class="frame-wrap">
    <div class="sticky-top" id="sticky-top">
      <header class="site-header" aria-label="Site header">
        <div class="brand-group" aria-hidden="true">
          <img class="brand-logo" src="mayanut-the-mayanut-comapny-logo.png" alt="" />
          <div class="brand-text">The MayaNut Company</div>
        </div>

        <nav class="main-nav" aria-label="Top controls">
          <div class="nav-left">
            <a class="pill-btn" href="contact.html" aria-label="Contact">CONTACT</a>
          </div>
          <div class="nav-right">
            <a class="pill-btn" href="research-es.html" aria-label="Switch to Español">ESPAÑOL</a>
          </div>
        </nav>

        <div class="menu-row" aria-label="Primary navigation">
          <a href="index.html">HOME</a>
          <a href="store.html">STORE</a>
          <a href="about.html">ABOUT</a>
          <a class="is-active" href="research.html" aria-current="page">RESEARCH</a>
        </div>
      </header>
    </div>

    <main id="main-content" tabindex="-1" aria-label="Research Database">
      <div class="content-wrapper">

        <section class="oframe" aria-label="Research frame">

          <!-- TOP GREEN BAR: title left, divider + search upper right -->
          <div class="frame-topbar" aria-label="Research top bar">
            <div class="topbar-title">RESEARCH &amp; DATABASE</div>

            <div class="topbar-right" aria-label="Search">
              <div class="topbar-divider" aria-hidden="true"></div>

              <div class="searchbar" aria-label="Search key terms in our database">
                <div class="mag" aria-hidden="true">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="11" cy="11" r="6.5"></circle>
                    <path d="M16.2 16.2L21 21"></path>
                  </svg>
                </div>
                <input id="db-search" type="text" placeholder="Search key terms in our database..." autocomplete="off" />
                <div class="xbtn" id="db-search-clear" aria-label="Clear search" role="button" tabindex="0">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 6l12 12"></path>
                    <path d="M18 6L6 18"></path>
                  </svg>
                </div>
              </div>
            </div>
          </div>

          <!-- WHITE HEADER: updated text -->
          <div class="research-head" aria-label="Research header">
            <div class="head-title">Explore Field Notes, Data, &amp; More</div>
            <div class="head-sub">Click on a file to read in-depth research about each topic relating to Brosimum alicastrum.</div>
          </div>

          <div class="research-body" aria-label="Research database content">
            <div class="panel-body" id="file-panel">
              <!-- Filled by JS -->
            </div>

            <div class="count-row" aria-label="Match count">
              <div class="count-pill" id="count-pill">0 MATCHES</div>
            </div>
          </div>

        </section>

      </div>
    </main>
  </div>

  <script>
    const $ = (s, r=document)=> r.querySelector(s);

    (function(){
      function setStickyOffset(){
        const sticky = document.getElementById("sticky-top");
        if(!sticky) return;
        const h = Math.ceil(sticky.getBoundingClientRect().height);
        document.documentElement.style.setProperty("--stickyOffset", h + "px");
      }
      window.addEventListener("load", setStickyOffset, { once:true });
      window.addEventListener("resize", ()=>{ clearTimeout(window.__st); window.__st=setTimeout(setStickyOffset,80); });
      window.addEventListener("pageshow", setStickyOffset);
      document.addEventListener("DOMContentLoaded", setStickyOffset);
    })();

    (function(){
      // Use ONE consistent placeholder image you already use elsewhere on the site.
      // Replace this with your actual placeholder file name/path.
      const PLACEHOLDER_IMG = "placeholder-image.jpg";

      const FILES = [
        { id:"reforestation", title:"Reforestation", href:"research-reforestation.html",
          desc:"Why a long-lived evergreen food tree can matter in reforestation projects; survival traits, shade architecture, and considerations for responsible planting." },

        { id:"agriculture", title:"Use in Agriculture", href:"research-agriculture.html",
          desc:"Practical notes on how MayaNut may fit into farm systems: long-horizon structure, spacing logic, pruning philosophy, and operational realities." },

        { id:"morphology", title:"Morphology", href:"research-morphology.html",
          desc:"Botanical morphology notes: leaf structure, venation, fruit size ranges, seed traits, and descriptive measurements for Brosimum alicastrum." },

        { id:"flavor", title:"Fruit Taste", href:"research-fruit-taste.html",
          desc:"Observed flavor descriptors for fruit and roasted seed, including how handling, maturity, and processing may shift taste and aroma." },

        { id:"range", title:"Range & Habitat", href:"research-range.html",
          desc:"Geographic range context and habitat notes; how to interpret regional presence without overgeneralizing performance in new environments." },

        { id:"history", title:"Discovery & Naming", href:"research-history-naming.html",
          desc:"A clear breakdown of naming conventions and terminology used for Brosimum alicastrum, plus context for how names appear across regions." },

        { id:"cold", title:"Cold Hardiness", href:"research-cold-hardiness.html",
          desc:"Cold exposure notes, symptoms to watch for, recovery behavior, and how to track tolerance across seed-grown variation over time." },

        { id:"ourplants", title:"Our Trees", href:"research-our-trees.html",
          desc:"Observations from the company’s seed-grown population: structure differences, vigor signals, and what gets tracked for long-horizon selection." },

        { id:"processing", title:"Processing & Products", href:"research-processing.html",
          desc:"Processing observations: cleaning, drying, roasting response, milling behavior, and repeatable notes for creating consistent powder." },

        { id:"germination", title:"Germination", href:"research-germination.html",
          desc:"What is tracked from sowing to emergence: timing variation, failure modes, handling sensitivity, and early-stage growth behavior." },

        { id:"soil", title:"Soil & Water", href:"research-soil-water.html",
          desc:"Soil media behavior, watering patterns, and root-zone observations—especially where small differences change outcomes in containers and early field trials." }
      ];

      const filePanel = document.getElementById("file-panel");
      const countPill = document.getElementById("count-pill");

      const search = document.getElementById("db-search");
      const clear = document.getElementById("db-search-clear");

      const folderIcon = `
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 7.5h6.2l1.7 2H20.5c.8 0 1.5.7 1.5 1.5v7.5c0 .8-.7 1.5-1.5 1.5H4.9c-.8 0-1.4-.6-1.4-1.4V9c0-.8.7-1.5 1.5-1.5z"></path>
          <path d="M3.5 7.5V6.2c0-.9.7-1.7 1.7-1.7h4.7l1.6 1.7"></path>
        </svg>
      `;

      function norm(s){ return String(s||"").toLowerCase().trim(); }

      function render(list){
        filePanel.innerHTML = "";

        list.forEach(f=>{
          const a = document.createElement("a");
          a.className = "topic-row";
          a.href = f.href;
          a.setAttribute("aria-label", f.title);

          a.innerHTML = `
            <div class="topic-icon" aria-hidden="true">${folderIcon}</div>

            <div class="topic-text">
              <div class="topic-title">${f.title}</div>
              <div class="topic-sub">${f.desc}</div>
            </div>

            <div class="topic-image" aria-hidden="true">
              <img src="${PLACEHOLDER_IMG}" alt="" loading="lazy" decoding="async" onerror="this.style.opacity='.35';" />
            </div>
          `;

          filePanel.appendChild(a);
        });

        countPill.textContent = `${list.length} MATCHES`;
      }

      function applySearch(){
        const q = norm(search?.value);
        if(!q){ render(FILES); return; }
        const filtered = FILES.filter(f=>{
          const hay = norm(`${f.title} ${f.desc}`);
          return hay.includes(q);
        });
        render(filtered);
      }

      render(FILES);

      search?.addEventListener("input", applySearch);
      clear?.addEventListener("click", ()=>{ if(!search) return; search.value=""; applySearch(); search.focus(); });
      clear?.addEventListener("keydown",(e)=>{ if(e.key==="Enter" || e.key===" "){ e.preventDefault(); clear.click(); } });

      applySearch();
    })();
  </script>
</body>
</html>
