<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="x-ua-compatible" content="ie=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Store | The MayaNut Company</title>

  <meta name="description" content="MayaNut Store (concept preview): MayaNut powder, merch, seeds and seedlings from Brosimum alicastrum by The MayaNut Company in South Florida." />
  <meta name="keywords" content="The MayaNut Company,MayaNut,maya nut,Brosimum alicastrum,MayaNut store,MayaNut powder,MayaNut merch,MayaNut seeds,MayaNut seedlings,South Florida farm" />
  <link rel="canonical" href="https://mayanut.com/store.html" />
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />

  <link rel="icon" type="image/png" href="mayanut-the-mayanut-comapny-logo.png" />
  <link rel="apple-touch-icon" href="mayanut-the-mayanut-comapny-logo.png" />
  <meta name="theme-color" content="#066100" />
  <meta name="format-detection" content="telephone=no" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Acme&family=Aprecu&display=swap" rel="stylesheet" />

  <style>
    :root{
      --green:#066100;

      --orange:#fd6c02;
      --orangeBadge:#d24f02;

      --lime:#d8ff6a;
      --pale:#e9ffd6;

      --page:#ffffff;
      --softBorder: 1px solid rgba(12,90,42,0.45);

      --font-ui: "Acme", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      --font-side: "Aprecu", "Acme", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;

      --stickyOffset: 170px;
      --filterGap: 10px;

      --navH: 152px;

      --catTabW: 56px;
      --cardImgH: 206px;
      --cardMinH: 382px;

      --bannerH: 18px;
      --topBarOutline: 1px solid rgba(12,90,42,0.55);
      --menuUnderlineH: 2px;

      /* “dark orange already in the middle of qty” */
      --darkOrange: rgba(0,0,0,0.18);
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
    html{
      background: var(--page);
      overflow-x:hidden;
      scroll-padding-top: calc(var(--stickyOffset) + var(--filterGap) + 12px);
      text-rendering: geometricPrecision;
      -webkit-text-size-adjust: 100%;
    }
    body{
      font-family: var(--font-ui);
      background: var(--page);
      color:#0f172a;
      -webkit-font-smoothing: antialiased;
      overflow-x:hidden;
      overscroll-behavior-y:none;
    }
    img{ max-width:100%; height:auto; display:block; }
    a{ color:inherit; text-decoration:none; }
    button,input,select{ font-family:inherit; }

    .top-banner{ height: var(--bannerH); background: var(--green); border-bottom: 1px solid rgba(255,255,255,0.18); }

    .frame-wrap{ position:relative; width:100%; min-height:100vh; padding-top: var(--stickyOffset); overflow-x: clip; }
    .sticky-top{
      position:fixed; top:0; left:0; right:0;
      z-index:999;
      background: var(--green);
      box-shadow:0 10px 28px rgba(15,23,42,0.12);
      overflow:hidden;
      transform: translateZ(0);
      border-bottom: var(--topBarOutline);
    }

    .site-header{
      width:100%;
      background-image:url("menuart-the-maya-nut-company-art.jpeg");
      background-size:cover;
      background-position:center center;
      background-repeat:no-repeat;
      padding: 26px 0 26px;
      display:flex; align-items:center; justify-content:center;
      position:relative; min-height: var(--navH);
      overflow: visible;
    }
    .site-header::after{
      content:""; position:absolute; inset:0;
      background: linear-gradient(to bottom, rgba(255,255,255,0.06), rgba(255,255,255,0.0) 58%);
      pointer-events:none;
    }

    .brand-group{
      position:absolute;
      left:50%;
      top:52%;
      transform: translate(-54%, -50%);
      display:flex;
      align-items:center;
      gap:12px;
      z-index:2;
      pointer-events:none;
      user-select:none;
      white-space:nowrap;
    }
    .brand-logo{ width:78px; height:78px; object-fit:contain; filter: drop-shadow(0 14px 30px rgba(15,23,42,0.22)); }
    .brand-text{
      font-family: var(--font-ui);
      font-weight:900;
      letter-spacing:.06em;
      font-size:44px;
      color: var(--lime);
      -webkit-text-stroke: 0.9px rgba(11,59,23,0.95);
      text-shadow:0 14px 34px rgba(15,23,42,0.20);
      text-align:center;
    }

    .main-nav{
      position:absolute; left:0; right:0;
      top:52%;
      transform: translateY(-50%);
      height:56px;
      z-index:3;
      pointer-events:none;
      overflow: visible;
    }
    .nav-left,.nav-right{
      position:absolute;
      top:50%;
      transform: translateY(-50%);
      display:flex;
      align-items:center;
      gap:10px;
      pointer-events:auto;
      white-space:nowrap;
      z-index:5;
    }
    .nav-left{ left:12px; }
    .nav-right{ right:12px; }

    .pill-btn{
      height:40px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.55);
      background: var(--orange);
      box-shadow:0 10px 22px rgba(15,23,42,0.12);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
      padding:0 14px;
      gap:8px;
      color:#ffffff;
      letter-spacing:0.12em;
      text-transform:uppercase;
      font-size:12px;
      font-weight:900;
      white-space:nowrap;
      transition: box-shadow .12s ease;
    }
    .pill-btn:hover{ box-shadow: inset 0 0 0 999px var(--darkOrange), 0 10px 22px rgba(15,23,42,0.12); }
    .pill-icon{ width:40px; padding:0; }
    .pill-icon svg{ width:20px; height:20px; stroke:#ffffff; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }

    .menu-row{
      position:absolute;
      left:50%;
      top: calc(52% + 54px);
      transform: translate(-54%, -50%);
      z-index:4;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:18px;
      pointer-events:auto;
      user-select:none;
      white-space:nowrap;
    }
    .menu-row a{
      position:relative;
      font-weight:900;
      font-size:17px;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:#ffffff;
      text-shadow:0 10px 22px rgba(15,23,42,0.18);
      padding:2px 0;
      line-height:1;
    }
    .menu-row a::after{
      content:"";
      position:absolute;
      left:0;
      bottom:-3px;
      height: var(--menuUnderlineH);
      width:100%;
      transform: scaleX(0);
      transform-origin:left;
      transition: transform .18s ease;
      background: rgba(255,255,255,0.92);
      border-radius:999px;
      opacity:.9;
    }
    .menu-row a:hover::after{ transform: scaleX(1); }
    .menu-row a.is-active{ color: var(--orange); }
    .menu-row a.is-active::after{ transform: scaleX(1); background: var(--orange); opacity:1; }

    main{ background:#ffffff; min-height: calc(100vh - var(--stickyOffset)); overflow: visible; position: relative; z-index: 1; }
    .content-wrapper{ padding:12px 10px 18px; max-width:1400px; margin:0 auto; }

    .store-layout{
      display:grid;
      grid-template-columns: 222px 1fr;
      gap:10px;
      align-items:start;
      margin-left:-6px;
    }

    .filter-outline, .oframe{
      border-radius:18px;
      background: transparent;
      padding:0;
      box-shadow:0 14px 40px rgba(15,23,42,0.06);
      border: var(--softBorder);
      overflow:hidden;
    }

    /* FILTER */
    .left-shell{ position: sticky; top: calc(var(--stickyOffset) + var(--filterGap)); width:100%; z-index: 10; }
    .left-head{
      background: var(--green);
      padding:10px 12px;
      font-weight:900;
      letter-spacing:.14em;
      text-transform:uppercase;
      font-size:14px;
      color:#ffffff;
      border-bottom: var(--softBorder);
      min-height:46px;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .left-head::after{
      content:"";
      flex:1;
      height:2px;
      background: rgba(255,255,255,0.55);
      border-radius:999px;
      opacity:.55;
      transform: translateY(2px);
    }
    .left-body{ padding:12px; display:flex; flex-direction:column; gap:10px; background: rgba(255,255,255,0.35); }

    /* CATEGORY radios: GREEN circle */
    .filter-item input[name="catmode"]{ accent-color: var(--green); }

    /* SORT radios: GREEN circle */
    .filter-item input[name="nameorder"],
    .filter-item input[name="priceorder"]{ accent-color: var(--green); }

    .filter-item input[type="checkbox"]{ accent-color: var(--green); }

    .filter-group{ border-radius:12px; background: var(--pale); padding:10px; border: var(--softBorder); }
    .filter-title{ margin-bottom:8px; display:flex; align-items:flex-end; justify-content:flex-start; gap:10px; }
    .filter-title .ftag{
      background: transparent; border:none; padding:0; border-radius:0;
      font-weight:900; letter-spacing:.08em; text-transform:uppercase; font-size:14px;
      color:#0b1220; text-decoration: underline; text-underline-offset: 2px;
    }
    .filter-item{ display:flex; align-items:center; gap:10px; padding:6px 0; font-weight:800; font-size:12px; color:#0b1220; letter-spacing:.01em; }

    /* STORE TOP */
    .grid-wrap{ background:#ffffff; display:flex; flex-direction:column; border-radius:18px; overflow:hidden; }
    .grid-head{
      background: var(--green);
      padding:10px 12px;
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      border-bottom: var(--softBorder);
      min-height:46px;
    }
    .grid-tools{
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:10px;
      width:100%;
      min-width:0;
      overflow: visible;
    }

    /* Search bar: responsive so it never gets cut off */
    .store-search{
      height:36px;
      border-radius:14px;
      border: var(--softBorder);
      background:#fff;
      display:flex;
      align-items:center;
      overflow:hidden;
      flex: 1 1 360px;
      min-width: 220px;
      max-width: 520px;
      box-shadow:0 10px 18px rgba(15,23,42,0.06);
    }
    .store-search .mag{ width:36px; height:36px; display:flex; align-items:center; justify-content:center; flex:0 0 36px; user-select:none; }
    .store-search .mag svg{ width:16px; height:16px; stroke: var(--orange); fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
    .store-search input{ border:none; outline:none; background:transparent; color:#0b1220; font-weight:800; letter-spacing:.01em; font-size:12px; padding:0 10px 0 2px; width:100%; min-width:0; caret-color: var(--orange); }
    .store-search .xbtn{ width:34px; height:36px; display:flex; align-items:center; justify-content:center; flex:0 0 34px; cursor:pointer; user-select:none; background:transparent; }
    .store-search .xbtn svg{ width:16px; height:16px; stroke: rgba(15,23,42,0.65); fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }

    .head-divider{ height:2px; background: rgba(255,255,255,0.55); flex:1 1 auto; border-radius:999px; opacity:.55; min-width:18px; }

    .checkout-fused{
      height:36px; border-radius:14px; padding:0 10px;
      border: 1px solid rgba(255,255,255,0.55);
      background: var(--orange);
      display:flex; align-items:center; justify-content:center; gap:8px;
      cursor:pointer; box-shadow:0 10px 18px rgba(15,23,42,0.10);
      user-select:none; min-width:132px; position:relative; flex:0 0 auto;
    }
    .checkout-fused:hover{ box-shadow: inset 0 0 0 999px var(--darkOrange), 0 10px 18px rgba(15,23,42,0.10); }
    .checkout-fused svg{ width:22px; height:22px; stroke:#ffffff; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
    .checkout-fused .txt{ font-weight:900; letter-spacing:.14em; text-transform:uppercase; font-size:10px; color:#ffffff; white-space:nowrap; }

    .cart-wrap{ position:relative; display:flex; align-items:center; justify-content:center; }
    .cart-badge{
      position:absolute; top:-6px; right:-7px;
      min-width:12px; height:12px; padding:0 3px; border-radius:999px;
      background: var(--orangeBadge);
      border:1px solid rgba(255,255,255,0.65);
      color:#ffffff; font-weight:900; font-size:8px;
      display:flex; align-items:center; justify-content:center; line-height:1;
      pointer-events:none;
    }

    .grid-body{ padding:0; }
    .store-body-wrap{ display:flex; align-items:stretch; gap:0; }

    /* Side POWDER/MERCH/PLANTS */
    .cat-tab{
      width: var(--catTabW);
      flex:0 0 var(--catTabW);
      background: var(--green);
      border-right: var(--softBorder);
      display:flex; flex-direction:column; justify-content:space-between;
      padding-top: 46px; margin-top: -46px;
      border-top-left-radius:18px; border-bottom-left-radius:18px;
      overflow:hidden;
    }
    .cat-btn{ border:none; background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:1 1 0; padding:10px 0; }
    .cat-btn:hover{ background: rgba(255,255,255,0.06); }
    .cat-btn.is-active{ background: rgba(255,255,255,0.10); }
    .cat-text{
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:22px;
      font-family: var(--font-side);
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:0.28em;
      font-size:20px;
      line-height:1;
      width:100%;
      color:#ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.18);
    }

    .store-content{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:10px; padding:10px 12px 12px; background:#ffffff; }

    /* Section background (pale green); powder matches others */
    .section-block{ border-radius:18px; background: var(--pale); border: var(--softBorder); padding:8px; box-shadow:0 10px 22px rgba(15,23,42,0.05); }

    .product-grid{ display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:10px; }
    .product-shell{ border-radius:18px; background:#ffffff; box-shadow:0 10px 22px rgba(15,23,42,0.05); min-height: var(--cardMinH); border: var(--softBorder); overflow:hidden; display:flex; }
    .product-inner{ flex:1; display:flex; flex-direction:column; }

    .prod-head{ background: var(--green); padding:9px 10px; display:flex; align-items:center; gap:10px; border-bottom: var(--softBorder); min-height:46px; }
    .prod-title{ font-weight:900; font-size:14px; letter-spacing:.08em; text-transform:uppercase; color:#ffffff; text-shadow:0 10px 22px rgba(0,0,0,0.25); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; line-height:1.05; }

    .pimg{ background:#fff; border-bottom: var(--softBorder); }
    .pimg img{ width:100%; height:var(--cardImgH); object-fit:cover; display:block; cursor:pointer; }

    .pbot{ padding:10px; flex:1 1 auto; display:flex; background: var(--green); }

    .click-inner{ width:100%; display:grid; grid-template-columns: 1fr 1fr; grid-auto-rows: min-content; column-gap:10px; row-gap:6px; align-content:start; min-height: 98px; }
    .row1{ grid-column: 1 / -1; display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:0; }
    .price-inline{ height:22px; display:flex; align-items:center; justify-content:flex-start; color:#ffffff; font-weight:900; font-size:13px; letter-spacing:.02em; white-space:nowrap; background: transparent; border:none; padding:0; text-shadow:0 2px 10px rgba(0,0,0,0.20); }

    .variant-box{ height:28px; border: 1px solid rgba(12,90,42,0.55); background: rgba(255,255,255,0.92); border-radius:14px; padding:0 10px; display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none; min-width: 170px; max-width: 240px; justify-content:space-between; flex:0 0 auto; text-transform:uppercase; }
    .variant-left{ font-weight:900; letter-spacing:.12em; text-transform:uppercase; font-size:10px; color:#0b1220; white-space:nowrap; }
    .variant-value{ font-weight:900; font-size:12px; color:#0b1220; white-space:nowrap; }
    .variant-right{ display:flex; align-items:center; gap:8px; white-space:nowrap; }
    .variant-caret{ width:14px; height:14px; stroke:#0b1220; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; opacity:.9; }

    .row2{ grid-column: 1 / -1; display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:0; }

    .addq{ height:34px; flex:1 1 auto; border-radius:14px; border: 1px solid rgba(255,255,255,0.55); background: var(--orange); color:#ffffff; font-weight:900; letter-spacing:.14em; text-transform:uppercase; font-size:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 18px rgba(0,0,0,0.12); white-space:nowrap; }
    .addq:hover{ box-shadow: inset 0 0 0 999px var(--darkOrange), 0 10px 18px rgba(0,0,0,0.12); }

    .qty-unified{ height:34px; flex:0 0 170px; border-radius:14px; border: 1px solid rgba(253,108,2,0.55); background: var(--orange); display:flex; align-items:stretch; overflow:hidden; box-shadow:0 10px 18px rgba(0,0,0,0.10); }
    .qty-btn{ width:40px; border:none; background: rgba(255,255,255,0.12); color:#ffffff; font-weight:900; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; user-select:none; line-height:1; flex:0 0 40px; transition: background .12s ease; }
    .qty-btn:hover{ background: var(--darkOrange); }
    .qty-mid{ flex:1 1 auto; display:flex; align-items:center; justify-content:center; background: var(--darkOrange); border-left:1px solid rgba(255,255,255,0.25); border-right:1px solid rgba(255,255,255,0.25); }
    .qty-number{ width:100%; border:none; outline:none; background:transparent; color:#ffffff; font-weight:900; font-size:12px; text-align:center; -moz-appearance:textfield; }
    .qty-number::-webkit-outer-spin-button,.qty-number::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }

    .tagline{ grid-column: 1 / -1; font-weight:800; font-size:12px; color: rgba(255,255,255,0.95); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; text-shadow:0 2px 10px rgba(0,0,0,0.20); }

    footer{ margin-top:10px; color:#ffffff; background-color: #0b3b17; background-image: url("mayanuts-the-maya-nut-company-image.jpeg"); background-repeat: repeat-x; background-size: auto 100%; background-position: center center; }
    .footer-thin{ height: var(--bannerH); background: var(--green); border-top: 1px solid rgba(255,255,255,0.18); }

    @media(max-width:1100px){
      .product-grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media(max-width:980px){
      .store-layout{ grid-template-columns: 1fr; margin-left:0; }
      .filter-col{ display:none; }
      .cat-tab{ display:none; }
      .menu-row a{ font-size:16px; }
      .row1{ flex-direction:column; align-items:flex-start; }
      .variant-box{ align-self:flex-start; }
      .row2{ flex-direction:column; align-items:stretch; }
      .qty-unified{ flex:1 1 auto; width:100%; }
    }
  </style>
</head>

<body>
  <div class="top-banner"></div>

  <div class="frame-wrap">
    <div class="sticky-top" id="sticky-top">
      <header class="site-header" aria-label="Site header">
        <div class="brand-group" aria-hidden="true">
          <img class="brand-logo" src="mayanut-the-mayanut-comapny-logo.png" alt="" />
          <div class="brand-text">The MayaNut Company</div>
        </div>

        <nav class="main-nav" aria-label="Top controls">
          <div class="nav-left">
            <a class="pill-btn pill-icon" href="mailto:info@mayanut.com" aria-label="Email">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4.5 6.5h15v11h-15z"></path>
                <path d="M4.5 7l7.5 6 7.5-6"></path>
              </svg>
            </a>
          </div>
          <div class="nav-right">
            <a class="pill-btn" href="store-es.html" aria-label="Switch to Español">ESPAÑOL</a>
          </div>
        </nav>

        <div class="menu-row" aria-label="Primary navigation">
          <a href="index.html">HOME</a>
          <a class="is-active" href="store.html" aria-current="page">STORE</a>
          <a href="about.html">ABOUT</a>
          <a href="research.html">RESEARCH</a>
        </div>
      </header>
    </div>

    <main id="main-content" tabindex="-1" aria-label="Store">
      <div class="content-wrapper">
        <div class="store-layout">

          <div class="filter-col" aria-label="Filter column">
            <div class="filter-outline">
              <div class="left-shell" aria-label="Filter sticky">
                <aside aria-label="Filter">
                  <div class="left-head">FILTER</div>

                  <div class="left-body">
                    <div class="filter-group" aria-label="Category">
                      <div class="filter-title"><span class="ftag">CATEGORY</span></div>

                      <!-- Category keeps store intact; selection scrolls only -->
                      <label class="filter-item"><input type="radio" name="catmode" value="all" checked> All</label>
                      <label class="filter-item"><input type="radio" name="catmode" value="powder"> Powder</label>
                      <label class="filter-item"><input type="radio" name="catmode" value="merch"> Merch</label>
                      <label class="filter-item"><input type="radio" name="catmode" value="plants"> Plants</label>
                    </div>

                    <div class="filter-group" aria-label="Sort">
                      <div class="filter-title"><span class="ftag">SORT</span></div>

                      <!-- No sort selected by default -->
                      <label class="filter-item"><input type="radio" name="nameorder" value="az"> A → Z</label>
                      <label class="filter-item"><input type="radio" name="nameorder" value="za"> Z → A</label>

                      <div style="height:6px" aria-hidden="true"></div>

                      <label class="filter-item"><input type="radio" name="priceorder" value="price_low"> Price (Low → High)</label>
                      <label class="filter-item"><input type="radio" name="priceorder" value="price_high"> Price (High → Low)</label>

                      <div style="height:8px" aria-hidden="true"></div>

                      <label class="filter-item"><input type="checkbox" id="in-stock-only"> In Stock</label>
                    </div>
                  </div>
                </aside>
              </div>
            </div>
          </div>

          <section class="oframe" aria-label="Store listings">
            <div class="grid-wrap">
              <div class="grid-head">
                <div class="grid-tools">
                  <div class="store-search" aria-label="Search products">
                    <div class="mag" aria-hidden="true">
                      <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="11" cy="11" r="6.5"></circle>
                        <path d="M16.2 16.2L21 21"></path>
                      </svg>
                    </div>
                    <input id="store-search" type="text" placeholder="Search MayaNut Store..." autocomplete="off" />
                    <div class="xbtn" id="store-search-clear" aria-label="Clear search" role="button" tabindex="0">
                      <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6 6l12 12"></path>
                        <path d="M18 6L6 18"></path>
                      </svg>
                    </div>
                  </div>

                  <div class="head-divider" aria-hidden="true"></div>

                  <button class="checkout-fused" id="checkout-top" type="button" aria-label="Checkout">
                    <span class="cart-wrap" aria-hidden="true">
                      <span class="cart-badge" id="cart-badge">0</span>
                      <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6 7h15l-1.5 8.5H7.2L6 7z"></path>
                        <path d="M6 7l-1-3H2.5"></path>
                        <circle cx="9" cy="19" r="1.6"></circle>
                        <circle cx="17" cy="19" r="1.6"></circle>
                      </svg>
                    </span>
                    <span class="txt">CHECKOUT</span>
                  </button>
                </div>
              </div>

              <div class="grid-body">
                <div class="store-body-wrap">
                  <aside class="cat-tab" aria-label="Categories">
                    <button class="cat-btn is-active" type="button" data-jump="#sec-powder" aria-label="Powder">
                      <span class="cat-text"><span>P</span><span>O</span><span>W</span><span>D</span><span>E</span><span>R</span></span>
                    </button>
                    <button class="cat-btn" type="button" data-jump="#sec-merch" aria-label="Merch">
                      <span class="cat-text"><span>M</span><span>E</span><span>R</span><span>C</span><span>H</span></span>
                    </button>
                    <button class="cat-btn" type="button" data-jump="#sec-plants" aria-label="Plants">
                      <span class="cat-text"><span>P</span><span>L</span><span>A</span><span>N</span><span>T</span><span>S</span></span>
                    </button>
                  </aside>

                  <div class="store-content">
                    <div class="section-block" id="sec-powder" aria-label="Powder products"><div class="product-grid" id="grid-powder"></div></div>
                    <div class="section-block" id="sec-merch" aria-label="Merch products"><div class="product-grid" id="grid-merch"></div></div>
                    <div class="section-block" id="sec-plants" aria-label="Plant products"><div class="product-grid" id="grid-plants"></div></div>
                  </div>

                </div>
              </div>

            </div>
          </section>

        </div>
      </div>
    </main>

    <footer aria-label="Footer">
      <div class="footer-thin" aria-hidden="true"></div>
    </footer>
  </div>

  <div id="variant-menu-root" style="position:fixed; inset:0; pointer-events:none; z-index:2500;"></div>

  <script>
    const $$ = (s, r=document)=> Array.from(r.querySelectorAll(s));
    const $  = (s, r=document)=> r.querySelector(s);

    (function(){
      function setStickyOffset(){
        const sticky = document.getElementById("sticky-top");
        if(!sticky) return;
        const h = Math.ceil(sticky.getBoundingClientRect().height);
        document.documentElement.style.setProperty("--stickyOffset", h + "px");
      }
      window.addEventListener("load", setStickyOffset, { once:true });
      window.addEventListener("resize", ()=>{ clearTimeout(window.__st); window.__st=setTimeout(setStickyOffset,80); });
      window.addEventListener("pageshow", setStickyOffset);
      document.addEventListener("DOMContentLoaded", setStickyOffset);
    })();

    /* Category click = scroll only (store stays intact) */
    (function(){
      const map = { all:null, powder:"#sec-powder", merch:"#sec-merch", plants:"#sec-plants" };
      document.querySelectorAll('input[name="catmode"]').forEach(r=>{
        r.addEventListener("change", ()=>{
          const sel = map[r.value] || null;
          if(sel){
            const el = document.querySelector(sel);
            if(el) el.scrollIntoView({ behavior:"smooth", block:"start" });
          }else{
            window.scrollTo({ top: 0, behavior:"smooth" });
          }
        });
      });
    })();

    /* Variant menu */
    (function(){
      const root = document.getElementById("variant-menu-root");
      let openMenu = null;

      function closeMenu(){
        if(!openMenu) return;
        openMenu.remove();
        openMenu = null;
      }

      window.__openVariantMenu = function(anchorEl, options, activeKey, onPick){
        closeMenu();
        const r = anchorEl.getBoundingClientRect();
        const menu = document.createElement("div");
        menu.style.pointerEvents = "auto";
        menu.style.position = "fixed";
        menu.style.left = Math.min(window.innerWidth - 220, Math.max(10, Math.round(r.left))) + "px";
        menu.style.top  = Math.min(window.innerHeight - 10, Math.round(r.bottom + 6)) + "px";
        menu.style.zIndex = "2500";
        menu.style.minWidth = "190px";
        menu.style.padding = "6px";
        menu.style.borderRadius = "12px";
        menu.style.border = "1px solid rgba(12,90,42,0.55)";
        menu.style.background = "rgba(255,255,255,0.98)";
        menu.style.boxShadow = "0 18px 55px rgba(15,23,42,0.18)";

        options.forEach(opt=>{
          const row = document.createElement("div");
          row.textContent = opt.label;
          row.style.borderRadius = "10px";
          row.style.padding = "8px 10px";
          row.style.cursor = "pointer";
          row.style.fontWeight = "900";
          row.style.fontSize = "12px";
          row.style.color = "#0b1220";
          row.style.background = "rgba(233,255,214,0.95)";
          row.style.border = "1px solid rgba(12,90,42,0.55)";
          row.style.marginBottom = "6px";
          if(opt.key === activeKey){
            row.style.outline = "2px solid rgba(12,90,42,0.55)";
            row.style.outlineOffset = "-2px";
          }
          row.addEventListener("click", ()=>{ onPick(opt.key); closeMenu(); });
          menu.appendChild(row);
        });
        if(menu.lastChild) menu.lastChild.style.marginBottom = "0";

        root.appendChild(menu);
        openMenu = menu;
      };

      document.addEventListener("click",(e)=>{
        if(openMenu){
          const anchor = e.target.closest?.("[data-variant-anchor]");
          const withinMenu = openMenu.contains(e.target);
          if(!withinMenu && !anchor) closeMenu();
        }
      });
      document.addEventListener("keydown",(e)=>{ if(e.key==="Escape") closeMenu(); });
    })();

    /* Store rendering + multi-sort (A-Z and Price can both be active) */
    (function(){
      const PRODUCTS = [
        { id:"powder", cat:"powder", title:"MayaNut Powder", img:"mayanut-powder-maya-nut-brosimum-alicastrum.png", tagline:"Flavorful powder, great for acai bowls, granola, cookies", variant:{ label:"WEIGHT", defaultKey:"qtr", options:[ { key:"qtr", label:"1/4 LB", price:9.95 }, { key:"half", label:"1/2 LB", price:18.95 }, { key:"one", label:"1 LB", price:35.95 } ] } },
        { id:"hat", cat:"merch", title:"MayaNut Hat", img:"mayanut-merch-hat-brosimum-alicastrum.png", tagline:"", variant:{ label:"SIZE", defaultKey:"os", options:[ { key:"os", label:"OS", price:15.00 } ] } },
        { id:"shirt", cat:"merch", title:"MayaNut T-Shirt", img:"mayanut-merch-shirt-brosimum-alicastrum.png", tagline:"", variant:{ label:"SIZE", defaultKey:"m", options:[ { key:"s", label:"S", price:18.00 }, { key:"m", label:"M", price:18.00 }, { key:"l", label:"L", price:18.00 }, { key:"xl", label:"XL", price:18.00 } ] } },
        { id:"hoodie", cat:"merch", title:"MayaNut Hoodie", img:"mayanut-merch-hoodie-brosimum-alicastrum.png", tagline:"", variant:{ label:"SIZE", defaultKey:"m", options:[ { key:"s", label:"S", price:30.00 }, { key:"m", label:"M", price:30.00 }, { key:"l", label:"L", price:30.00 }, { key:"xl", label:"XL", price:30.00 } ] } },
        { id:"seedling", cat:"plants", title:"MayaNut Seedling", img:"maya-nut-mayanut-plant-tree-nursery.jpg", tagline:"", variant:{ label:"SIZE", defaultKey:"1gl", options:[ { key:"1gl", label:"1 GL", price:34.95 } ] } },
        { id:"seeds", cat:"plants", title:"MayaNut Seeds", img:"maya-nut-mayanut-fruit-brosimum-alicastrum.jpg", tagline:"", variant:{ label:"PACK", defaultKey:"10pc", options:[ { key:"10pc", label:"10 PC", price:9.95 } ] } }
      ];

      const gridPowder = document.getElementById("grid-powder");
      const gridMerch  = document.getElementById("grid-merch");
      const gridPlants = document.getElementById("grid-plants");

      const badge = document.getElementById("cart-badge");
      let cartCount = 0;
      const setBadge = ()=> { if(badge) badge.textContent = String(cartCount); };

      const money = (n)=> Number(n||0).toLocaleString(undefined,{style:"currency",currency:"USD"});
      const norm = (s)=> String(s||"").toLowerCase().trim();

      // Sort defaults: none selected
      const state = { nameorder:null, priceorder:null, q:"" };

      function getVariantPrice(p, key){
        const v = p.variant.options.find(o=>o.key===key) || p.variant.options[0];
        return v.price;
      }
      function getVariantLabel(p, key){
        const v = p.variant.options.find(o=>o.key===key) || p.variant.options[0];
        return v.label;
      }
      function basePriceForSort(p){ return getVariantPrice(p, p.variant.defaultKey); }

      function cardHTML(p){
        const baseKey = p.variant.defaultKey;
        const basePrice = getVariantPrice(p, baseKey);
        const baseLabel = getVariantLabel(p, baseKey);

        return `
          <div class="product-shell" data-shell data-id="${p.id}" data-title="${p.title}" data-cat="${p.cat}" data-variant-key="${baseKey}">
            <article class="product-inner">
              <div class="prod-head"><div class="prod-title">${p.title}</div></div>
              <div class="pimg"><img src="${p.img}" alt="${p.title}" loading="lazy" decoding="async" /></div>
              <div class="pbot">
                <div class="click-inner">
                  <div class="row1">
                    <div class="price-inline" data-price>${money(basePrice)}</div>
                    <div class="variant-box" data-variant-anchor data-variant="${p.id}">
                      <div class="variant-left">${p.variant.label}</div>
                      <div class="variant-right">
                        <div class="variant-value" data-variant-value>${baseLabel}</div>
                        <svg class="variant-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
                      </div>
                    </div>
                  </div>

                  <div class="row2">
                    <button class="addq" type="button" data-add>ADD</button>
                    <div class="qty-unified" aria-label="Quantity">
                      <button class="qty-btn" type="button" data-minus aria-label="Decrease">−</button>
                      <div class="qty-mid"><input class="qty-number" type="number" min="1" max="99" step="1" value="1" inputmode="numeric" aria-label="Quantity value" /></div>
                      <button class="qty-btn" type="button" data-plus aria-label="Increase">+</button>
                    </div>
                  </div>

                  ${p.tagline ? `<div class="tagline">${p.tagline}</div>` : ``}
                </div>
              </div>
            </article>
          </div>`;
      }

      function multiCompare(a,b){
        const aName = a.title.toLowerCase(), bName = b.title.toLowerCase();
        const aPrice = basePriceForSort(a), bPrice = basePriceForSort(b);

        // If nameorder is set, apply it first; otherwise skip name compare
        if(state.nameorder === "az" && aName !== bName) return aName.localeCompare(bName);
        if(state.nameorder === "za" && aName !== bName) return bName.localeCompare(aName);

        // Then apply priceorder if set
        if(state.priceorder === "price_low" && aPrice !== bPrice) return aPrice - bPrice;
        if(state.priceorder === "price_high" && aPrice !== bPrice) return bPrice - aPrice;

        return 0;
      }

      function apply(){
        const q = norm(state.q);

        let list = PRODUCTS.slice();
        if(q) list = list.filter(p=> norm(p.title).includes(q));

        const doSort = !!state.nameorder || !!state.priceorder;
        if(doSort) list.sort(multiCompare);

        gridPowder.innerHTML = list.filter(p=>p.cat==="powder").map(cardHTML).join("");
        gridMerch.innerHTML  = list.filter(p=>p.cat==="merch").map(cardHTML).join("");
        gridPlants.innerHTML = list.filter(p=>p.cat==="plants").map(cardHTML).join("");

        wireQty();
        wireAdd();
        wireVariants();
      }

      function wireQty(){
        const clamp = (n)=> Math.max(1, Math.min(99, n));
        document.querySelectorAll(".product-shell").forEach(shell=>{
          const qty = shell.querySelector(".qty-number");
          const plus = shell.querySelector("[data-plus]");
          const minus = shell.querySelector("[data-minus]");
          if(!qty || !plus || !minus) return;
          const set = (v)=> qty.value = String(clamp(parseInt(v,10)||1));
          set(qty.value);
          qty.addEventListener("input", ()=> set(qty.value));
          qty.addEventListener("blur", ()=> set(qty.value));
          plus.addEventListener("click", ()=> set((parseInt(qty.value,10)||1)+1));
          minus.addEventListener("click", ()=> set((parseInt(qty.value,10)||1)-1));
        });
      }

      function wireAdd(){
        document.querySelectorAll("[data-add]").forEach(btn=>{
          btn.addEventListener("click", ()=>{
            const shell = btn.closest(".product-shell");
            const qtyEl = shell?.querySelector(".qty-number");
            const q = Math.max(1, Math.min(99, parseInt(qtyEl?.value||"1",10)||1));
            cartCount += q;
            setBadge();
          });
        });
      }

      function wireSearch(){
        const s = document.getElementById("store-search");
        const clear = document.getElementById("store-search-clear");
        function onInput(){ state.q = s.value || ""; apply(); }
        s?.addEventListener("input", onInput);
        clear?.addEventListener("click", ()=>{ if(!s) return; s.value=""; state.q=""; apply(); s.focus(); });
      }

      function wireVariants(){
        document.querySelectorAll(".variant-box").forEach(box=>{
          const pid = box.getAttribute("data-variant");
          const p = PRODUCTS.find(x=>x.id===pid);
          if(!p) return;

          box.addEventListener("click",(e)=>{
            e.stopPropagation();
            const shell = box.closest(".product-shell");
            const activeKey = shell?.getAttribute("data-variant-key") || p.variant.defaultKey;

            window.__openVariantMenu?.(
              box,
              p.variant.options.map(o=>({ key:o.key, label:o.label })),
              activeKey,
              (newKey)=>{
                if(!shell) return;
                shell.setAttribute("data-variant-key", newKey);
                const newPrice = getVariantPrice(p, newKey);
                shell.querySelector("[data-price]").textContent = money(newPrice);
                shell.querySelector("[data-variant-value]").textContent = getVariantLabel(p, newKey);
              }
            );
          });
        });
      }

      function bindSortControls(){
        // Sort selections are optional; no default checked in HTML
        document.querySelectorAll('input[name="nameorder"]').forEach(r=>{
          r.addEventListener("change", ()=>{ state.nameorder = r.value; apply(); });
        });
        document.querySelectorAll('input[name="priceorder"]').forEach(r=>{
          r.addEventListener("change", ()=>{ state.priceorder = r.value; apply(); });
        });
      }

      setBadge();
      apply();
      bindSortControls();
      wireSearch();

      document.getElementById("checkout-top")?.addEventListener("click", ()=> alert("Store is under development."));
    })();
  </script>
</body>
</html>
