<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="x-ua-compatible" content="ie=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Store | The MayaNut Company</title>

  <!-- SEO -->
  <meta name="description" content="MayaNut Store (concept preview): MayaNut (maya nut) powder, pods, merch, seeds and seedlings from Brosimum alicastrum by The MayaNut Company in South Florida." />
  <meta name="keywords" content="The MayaNut Company,MayaNut,maya nut,Brosimum alicastrum,MayaNut store,MayaNut powder,MayaNut pods,Instant MayaNut pods,MayaNut merch,MayaNut seeds,MayaNut seedlings,South Florida farm,America's premier MayaNut farm" />
  <link rel="canonical" href="https://mayanut.com/store.html" />
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />

  <!-- Open Graph / Twitter -->
  <meta property="og:title" content="Store | The MayaNut Company" />
  <meta property="og:description" content="MayaNut (maya nut) product concepts from Brosimum alicastrum: powder, pods, merch, seeds and seedlings." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://mayanut.com/store.html" />
  <meta property="og:image" content="https://mayanut.com/mayanut-the-mayanut-comapny-logo.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Store | The MayaNut Company" />
  <meta name="twitter:description" content="MayaNut (maya nut) product concepts from Brosimum alicastrum." />
  <meta name="twitter:image" content="https://mayanut.com/mayanut-the-mayanut-comapny-logo.png" />

  <link rel="icon" type="image/png" href="mayanut-the-mayanut-comapny-logo.png" />
  <link rel="apple-touch-icon" href="mayanut-the-mayanut-comapny-logo.png" />
  <meta name="theme-color" content="#1a6800" />
  <meta name="format-detection" content="telephone=no" />

  <!-- Slackey font -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Slackey&display=swap" />

  <!-- Preload -->
  <link rel="preload" as="image" href="menuart-the-maya-nut-company-art.jpeg" />
  <link rel="preload" as="image" href="mayanut-the-mayanut-comapny-logo.png" />
  <link rel="preload" as="image" href="mayanuts-the-maya-nut-company-image.jpeg" />

  <style>
    :root{
      --green:#1a6800;         /* solid green everywhere requested */
      --green-deep:#0b3b17;
      --pale:#e9ffd6;          /* pale green used inside boxes */
      --orange:#fd6c02;        /* solid orange buttons */
      --page-bg:#ffffff;

      --shadow: 0 18px 55px rgba(15,23,42,0.18);
      --thin-outline: 1px solid rgba(12,90,42,0.45);

      --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      --font-pretty: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;

      --stickyOffset: 170px; /* set via JS */
      --filterGap: 10px;

      --navH: 152px;

      --cardImgH: 206px;
      --cardMinH: 382px;

      --catTabW: 56px;
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
    html{
      background: var(--page-bg);
      overflow-x:hidden;
      scroll-padding-top: calc(var(--stickyOffset) + var(--filterGap) + 12px);
    }
    body{
      font-family: var(--font-sans);
      background: var(--page-bg);
      color:#0f172a;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      overflow-x:hidden;
      overscroll-behavior-y:none;
    }
    img{ max-width:100%; height:auto; display:block; }
    a{ color:inherit; text-decoration:none; }
    button,input,select{ font-family:inherit; }

    .frame-wrap{ position:relative; width:100%; min-height:100vh; padding-top: var(--stickyOffset); overflow-x: clip; }

    /* Top and bottom thin banners (solid green, same exact color) */
    .thin-banner{
      width:100%;
      height:18px;
      background: var(--green);
      border-bottom: 1px solid rgba(255,255,255,0.18);
    }
    .thin-banner.bottom{
      border-top: 1px solid rgba(255,255,255,0.18);
      border-bottom:none;
    }

    /* Sticky header wrapper */
    .sticky-top{
      position:fixed; top:0; left:0; right:0;
      z-index:999;
      background: var(--green);
      box-shadow:0 10px 28px rgba(15,23,42,0.12);
      overflow:hidden;
      transform: translateZ(0);
    }

    .site-header{
      width:100%;
      background-image:url("menuart-the-maya-nut-company-art.jpeg");
      background-size:cover;
      background-position:center center;
      background-repeat:no-repeat;
      padding: 28px 0 26px;
      display:flex; align-items:center; justify-content:center;
      position:relative; min-height: var(--navH);
    }
    .site-header::after{
      content:""; position:absolute; inset:0;
      background: linear-gradient(to bottom, rgba(255,255,255,0.06), rgba(255,255,255,0.0) 58%);
      pointer-events:none;
    }

    /* Center brand: logo just left of the “T” */
    .brand-group{
      position:absolute;
      left:50%;
      top:54%;
      transform: translate(-54%, -50%);
      display:flex;
      align-items:center;
      gap:10px;
      z-index:2;
      pointer-events:none;
      user-select:none;
      white-space:nowrap;
    }
    .brand-logo{
      width:78px;
      height:78px;
      object-fit:contain;
      filter: drop-shadow(0 14px 30px rgba(15,23,42,0.22));
    }
    .brand-text{
      font-family:"Slackey", system-ui, sans-serif;
      font-weight:400;
      letter-spacing:.02em;
      font-size:36px;
      color:#d8ff6a;
      -webkit-text-stroke: 1px rgba(11,59,23,0.95);
      text-shadow:0 14px 34px rgba(15,23,42,0.20);
    }

    /* Nav row aligned to brand */
    .main-nav{
      position:absolute;
      left:0; right:0;
      top:54%;
      transform: translateY(-50%);
      height:56px;
      z-index:3;
      pointer-events:none;
    }

    /* Email left, Español right */
    .nav-left,
    .nav-right{
      position:absolute;
      top:50%;
      transform: translateY(-50%);
      display:flex;
      align-items:center;
      gap:10px;
      pointer-events:auto;
      white-space:nowrap;
    }
    .nav-left{ left:12px; }
    .nav-right{ right:12px; }

    .email-top{
      width:40px; height:40px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.55);
      background: rgba(255,255,255,0.10);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 10px 22px rgba(15,23,42,0.12);
    }
    .email-top svg{
      width:20px; height:20px;
      stroke: #b7ff3f;
      fill:none;
      stroke-width:2.2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .lang-pill{
      height:40px;
      padding:0 14px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.55);
      background: rgba(255,255,255,0.10);
      color:#ffffff;
      font-weight:950;
      letter-spacing:0.10em;
      text-transform:uppercase;
      font-size:12px;
      box-shadow:0 10px 22px rgba(15,23,42,0.12);
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }

    /* Menu links under brand (no pill buttons) */
    .menu-row{
      position:absolute;
      left:50%;
      top: calc(54% + 44px);
      transform: translate(-50%, -50%);
      z-index:3;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:18px;
      pointer-events:auto;
      user-select:none;
      white-space:nowrap;
    }
    .menu-row a{
      font-family:"Slackey", system-ui, sans-serif;
      font-weight:400;
      font-size:20px;
      letter-spacing:.01em;
      color:#ffffff;
      -webkit-text-stroke: 0.9px rgba(11,59,23,0.95);
      text-shadow:0 10px 22px rgba(15,23,42,0.18);
      padding:2px 4px;
      border-radius:10px;
      line-height:1;
    }
    .menu-row a.is-active{
      color: var(--orange);
      -webkit-text-stroke: 0.9px rgba(11,59,23,0.95);
    }

    main{
      background: #ffffff;
      min-height: calc(100vh - var(--stickyOffset));
      overflow: visible;
    }
    /* remove double thin line effect at header/body seam */
    .content-wrapper{
      padding:12px 10px 28px;
      max-width:1400px;
      margin:0 auto;
    }

    .store-layout{
      display:grid;
      grid-template-columns: 222px 1fr;
      gap:10px;
      align-items:start;
    }

    .filter-outline, .oframe{
      border-radius:18px;
      background: transparent;
      padding:0;
      box-shadow:0 14px 40px rgba(15,23,42,0.06);
      border: var(--thin-outline);
      overflow:hidden;
    }

    /* FILTER */
    .left-shell{
      position: sticky;
      top: calc(var(--stickyOffset) + var(--filterGap));
      width:100%;
    }
    .left-head{
      background: var(--green); /* solid green */
      padding:10px 12px;
      font-weight:950;
      letter-spacing:.10em;
      text-transform:uppercase;
      font-size:12px;
      color:#ffffff;
      border-bottom: var(--thin-outline);
      min-height:46px;
      display:flex;
      align-items:center;
      gap:10px;
      font-family:"Slackey", system-ui, sans-serif; /* Slackey for FILTER */
    }
    .left-body{
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
      background: rgba(255,255,255,0.35);
    }
    .filter-group{
      border-radius:12px;
      background: var(--pale);
      padding:10px;
      border: var(--thin-outline);
    }
    .filter-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:8px;
    }
    .filter-title .ftag{
      display:inline-flex;
      align-items:center;
      background: rgba(0,0,0,0.06);
      color:#0b1220;
      border-radius:10px;
      padding:6px 10px;
      border: var(--thin-outline);
      font-weight:950;
      letter-spacing:.10em;
      text-transform:uppercase;
      font-size:10px;
    }
    .filter-item{
      display:flex;
      align-items:center;
      gap:10px;
      padding:6px 0;
      font-weight:900;
      font-size:12px;
      color:#0b1220;
      letter-spacing:.01em;
    }
    .filter-item input{ accent-color: var(--green); }

    /* STORE */
    .grid-wrap{
      background: rgba(11,59,23,0.08);
      display:flex;
      flex-direction:column;
      border-radius:18px;
      overflow:hidden;
    }
    .grid-head{
      background: var(--green); /* solid green */
      padding:10px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      border-bottom: var(--thin-outline);
      min-height:46px;
    }

    .grid-tools{
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:10px;
      width:100%;
    }

    /* Search bar: not cut off, icon on left, no vertical lines */
    .store-search{
      height:36px;
      border-radius:14px;
      border: var(--thin-outline);
      background:#fff;
      display:flex;
      align-items:center;
      overflow:hidden;
      flex:0 1 520px;          /* controlled length */
      max-width:520px;
      min-width:300px;
      margin-left:0;
      box-shadow:0 10px 18px rgba(15,23,42,0.06);
    }
    .store-search .mag{
      width:36px; height:36px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex:0 0 36px;
      user-select:none;
    }
    .store-search .mag svg{
      width:16px; height:16px;
      stroke: var(--orange);
      fill:none;
      stroke-width:2.2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    .store-search input{
      border:none;
      outline:none;
      background:transparent;
      color:#0b1220;
      font-weight:900;
      letter-spacing:.01em;
      font-size:12px;
      padding:0 10px 0 2px;
      width:100%;
      min-width:0;
      caret-color: var(--orange);
    }
    .store-search .xbtn{
      width:34px; height:36px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex:0 0 34px;
      cursor:pointer;
      user-select:none;
      background:transparent;
    }
    .store-search .xbtn svg{
      width:16px; height:16px;
      stroke: rgba(15,23,42,0.65);
      fill:none;
      stroke-width:2.2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    /* Thin green divider line between search and checkout */
    .head-divider{
      height:2px;
      background: rgba(255,255,255,0.55);
      flex:1 1 auto;
      border-radius:999px;
      opacity:.55;
      min-width:24px;
    }

    /* Checkout button: short/compact, solid orange */
    .checkout-fused{
      height:36px;
      border-radius:14px;
      padding:0 10px;
      border: 1px solid rgba(255,255,255,0.55);
      background: var(--orange);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      cursor:pointer;
      box-shadow:0 10px 18px rgba(15,23,42,0.10);
      user-select:none;
      min-width:132px;
      position:relative;
      flex:0 0 auto;
    }
    .checkout-fused svg{
      width:18px; height:18px;
      stroke:#ffffff; fill:none;
      stroke-width:2.2;
      stroke-linecap:round; stroke-linejoin:round;
      position:relative;
    }
    .checkout-fused .txt{
      font-weight:950;
      letter-spacing:.10em;
      text-transform:uppercase;
      font-size:10px;
      color:#ffffff;
      white-space:nowrap;
    }
    /* badge on cart tip, smaller; orange circle with white number */
    .cart-wrap{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .cart-badge{
      position:absolute;
      top:-7px;
      right:-8px;
      min-width:16px;
      height:16px;
      padding:0 5px;
      border-radius:999px;
      background: var(--orange);
      border:1px solid rgba(255,255,255,0.65);
      color:#ffffff;
      font-weight:1000;
      font-size:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      line-height:1;
      pointer-events:none;
    }

    /* body */
    .grid-body{
      padding:0; /* no extra top seam lines */
    }
    .store-body-wrap{
      display:flex;
      align-items:stretch;
      gap:0;
      position:relative;
    }

    /* left category tab connected to top store header */
    .cat-tab{
      width: var(--catTabW);
      flex:0 0 var(--catTabW);
      background: var(--green); /* solid green */
      border-right: var(--thin-outline);
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      padding-top: 46px;   /* match grid-head min-height */
      margin-top: -46px;   /* pull up into header */
      border-top-left-radius:18px;
      border-bottom-left-radius:18px;
      overflow:hidden;
    }
    .cat-btn{
      border:none;
      background:transparent;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      flex:1 1 0;
      padding:10px 0;
    }
    .cat-btn:hover{ background: rgba(255,255,255,0.06); }
    .cat-btn.is-active{ background: rgba(255,255,255,0.10); }

    /* bigger words, taller spacing between letters */
    .cat-text{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;                 /* taller spacing */
      font-weight:1000;
      text-transform:uppercase;
      letter-spacing:0.05em;
      color: var(--orange);
      -webkit-text-stroke: 1px rgba(11,59,23,0.95);
      text-shadow: 0 2px 10px rgba(15,23,42,0.15);
      line-height:1;
      font-size:28px;
      width:100%;
    }

    .store-content{
      flex:1 1 auto;
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:10px;
      padding:10px 12px 12px;
    }

    /* remove across-the-page green separator bars entirely */
    .section-sep{ display:none !important; }

    .section-block{
      border-radius:18px;
      background: rgba(255,255,255,0.42);
      border: var(--thin-outline);
      padding:8px;
      box-shadow:0 10px 22px rgba(15,23,42,0.05);
    }

    .product-grid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap:10px;
    }

    .product-shell{
      border-radius:18px;
      background: rgba(255,255,255,0.62);
      box-shadow:0 10px 22px rgba(15,23,42,0.05);
      min-height: var(--cardMinH);
      border: var(--thin-outline);
      overflow:hidden;
      display:flex;
    }
    .product-inner{ flex:1; display:flex; flex-direction:column; }

    /* Product title bar: left dark green -> right pale green gradient */
    .prod-head{
      background: linear-gradient(90deg, var(--green-deep) 0%, var(--pale) 70%, var(--pale) 100%);
      padding:9px 10px;
      display:flex;
      align-items:center;
      gap:10px;
      border-bottom: var(--thin-outline);
      min-height:46px;
    }
    /* Titles Slackey; different color: white for readability */
    .prod-title{
      font-family:"Slackey", system-ui, sans-serif;
      font-weight:400;
      font-size:16px;
      letter-spacing:.01em;
      color:#ffffff;
      -webkit-text-stroke: 0.8px rgba(11,59,23,0.92);
      text-shadow:0 10px 22px rgba(15,23,42,0.20);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:100%;
      line-height:1.05;
    }

    .pimg{ background:#fff; border-bottom: var(--thin-outline); }
    .pimg img{
      width:100%;
      height:var(--cardImgH);
      object-fit:cover;
      display:block;
      cursor:pointer;
    }

    .pbot{
      padding:10px;
      flex:1 1 auto;
      display:flex;
      background: var(--pale);
    }

    /* Layout: price left aligned above ADD, dropdown right aligned, then ADD and Qty */
    .click-inner{
      width:100%;
      display:grid;
      grid-template-columns: 1fr 1fr;
      grid-auto-rows: min-content;
      column-gap:10px;
      row-gap:8px;
      align-content:start;
    }

    /* price left aligned */
    .price-inline{
      grid-column: 1 / -1;
      height:22px;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      color:#0b1220;
      font-weight:950;
      font-size:13px;
      letter-spacing:.01em;
      text-decoration:none;
    }

    /* variant dropdown right aligned */
    .variant-box{
      grid-column: 1 / -1;
      justify-self:end;
      height:30px;
      border: var(--thin-outline);
      background: rgba(255,255,255,0.70);
      border-radius:14px;
      padding:0 10px;
      display:flex;
      align-items:center;
      gap:10px;
      cursor:pointer;
      user-select:none;
      min-width: 170px;
      max-width: 240px;
      justify-content:space-between;
    }
    .variant-left{
      font-weight:950;
      letter-spacing:.10em;
      text-transform:uppercase;
      font-size:10px;
      color:#0b1220;
      white-space:nowrap;
    }
    .variant-value{
      font-weight:1000;
      font-size:12px;
      color:#0b1220;
      white-space:nowrap;
    }
    .variant-right{ display:flex; align-items:center; gap:8px; white-space:nowrap; }
    .variant-caret{
      width:14px; height:14px;
      stroke:#0b1220; fill:none;
      stroke-width:2.2;
      stroke-linecap:round;
      stroke-linejoin:round;
      opacity:.9;
    }

    /* ADD button solid orange */
    .addq{
      grid-column: 1;
      height:34px;
      border-radius:14px;
      border: var(--thin-outline);
      background: var(--orange);
      color:#ffffff;
      font-weight:950;
      letter-spacing:.10em;
      text-transform:uppercase;
      font-size:10px;
      cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 10px 18px rgba(15,23,42,0.08);
      white-space:nowrap;
    }

    /* Qty: rounded rectangle; minus left, number center (green), plus right */
    .qty-unified{
      grid-column: 2;
      justify-self:end;
      height:34px;
      border-radius:14px;
      border: var(--thin-outline);
      background: rgba(255,255,255,0.65);
      display:flex;
      align-items:stretch;
      overflow:hidden;
      box-shadow:0 10px 18px rgba(15,23,42,0.08);
      min-width:136px;
      max-width:180px;
    }
    .qty-btn{
      width:40px;
      border:none;
      background: var(--green);
      color:#ffffff;
      font-weight:1000;
      font-size:14px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      user-select:none;
      line-height:1;
    }
    .qty-mid{
      flex:1 1 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      background: linear-gradient(180deg, rgba(42,139,47,0.95), rgba(26,104,0,0.95));
      border-left:1px solid rgba(255,255,255,0.25);
      border-right:1px solid rgba(255,255,255,0.25);
    }
    .qty-number{
      width:100%;
      border:none;
      outline:none;
      background:transparent;
      color:#ffffff;
      font-weight:1000;
      font-size:12px;
      text-align:center;
      -moz-appearance:textfield;
    }
    .qty-number::-webkit-outer-spin-button,
    .qty-number::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }

    /* Product descriptions same style as search text */
    .tagline{
      grid-column: 1 / -1;
      font-family: var(--font-sans);
      font-weight:800;
      font-size:12px;
      color: rgba(15,23,42,0.60);
      white-space:nowrap;
      overflow:hidden;

    /* Sticky offset */
    (function(){
      function setStickyOffset(){
        const sticky = document.getElementById("sticky-top");
        if(!sticky) return;
        const h = Math.ceil(sticky.getBoundingClientRect().height);
        document.documentElement.style.setProperty("--stickyOffset", h + "px");
      }
      window.addEventListener("load", setStickyOffset, { once:true });
      window.addEventListener("resize", ()=>{ clearTimeout(window.__st); window.__st=setTimeout(setStickyOffset,80); });
      window.addEventListener("pageshow", setStickyOffset);
      document.addEventListener("DOMContentLoaded", setStickyOffset);
    })();

    /* Variant menu + modal helpers */
    (function(){
      const root = document.getElementById("variant-menu-root");
      let openMenu = null;

      function closeMenu(){
        if(!openMenu) return;
        openMenu.el.remove();
        openMenu = null;
      }

      function openVariantMenu(anchorEl, options, activeKey, onPick){
        closeMenu();
        const r = anchorEl.getBoundingClientRect();
        const menu = document.createElement("div");
        menu.className = "variant-menu";
        menu.style.pointerEvents = "auto";

        const left = Math.min(window.innerWidth - 210, Math.max(10, Math.round(r.left)));
        const top = Math.min(window.innerHeight - 10, Math.round(r.bottom + 6));
        menu.style.left = left + "px";
        menu.style.top = top + "px";

        options.forEach(opt=>{
          const row = document.createElement("div");
          row.className = "opt" + (opt.key === activeKey ? " is-active" : "");
          row.textContent = opt.label;
          row.addEventListener("click", ()=>{ onPick(opt.key); closeMenu(); });
          menu.appendChild(row);
        });

        root.appendChild(menu);
        openMenu = { el: menu };
      }

      document.addEventListener("click", (e)=>{
        if(openMenu){
          const within = e.target.closest(".variant-menu");
          const anchor = e.target.closest("[data-variant-anchor]");
          if(!within && !anchor) closeMenu();
        }
      });
      document.addEventListener("keydown",(e)=>{ if(e.key==="Escape") closeMenu(); });

      window.__openVariantMenu = openVariantMenu;

      const overlay = document.getElementById("desc-overlay");
      const closeBtn = document.getElementById("modal-close");

      function openModal(title, imgSrc, text){
        document.body.classList.add("modal-open");
        overlay.setAttribute("aria-hidden","false");
        document.getElementById("modal-title").textContent = title || "Product";
        const mimg = document.getElementById("modal-img");
        mimg.src = imgSrc || "";
        mimg.alt = title || "Product image";
        document.getElementById("modal-copy").textContent = text || "";
      }
      function closeModal(){
        document.body.classList.remove("modal-open");
        overlay.setAttribute("aria-hidden","true");
      }

      closeBtn?.addEventListener("click", closeModal);
      overlay?.addEventListener("click", (e)=>{ if(e.target && e.target.id === "desc-overlay") closeModal(); });
      document.addEventListener("keydown",(e)=>{ if(e.key==="Escape") closeModal(); });

      window.__openDescModal = openModal;
    })();

        },
        { id:"hat",    cat:"merch",  title:"MayaNut Hat",     price:15.00, img:"mayanut-merch-hat-brosimum-alicastrum.png", inStock:false, desc:"Lookin' good, support us in style!", tagline:"" },
        { id:"shirt",  cat:"merch",  title:"MayaNut T-Shirt", price:18.00, img:"mayanut-merch-shirt-brosimum-alicastrum.png", inStock:false, desc:"MayaNut T-shirt for MayaNut lovers!", tagline:"", variant:{ label:"SIZE", defaultKey:"m", options:[
          { key:"s", label:"Small", price:18.00 }, { key:"m", label:"Medium", price:18.00 }, { key:"l", label:"Large", price:18.00 }, { key:"xl", label:"XL", price:18.00 }
        ]}},
        { id:"hoodie", cat:"merch",  title:"MayaNut Hoodie",  price:30.00, img:"mayanut-merch-hoodie-brosimum-alicastrum.png", inStock:false, desc:"Stay warm like our trees!", tagline:"", variant:{ label:"SIZE", defaultKey:"m", options:[
          { key:"s", label:"Small", price:30.00 }, { key:"m", label:"Medium", price:30.00 }, { key:"l", label:"Large", price:30.00 }, { key:"xl", label:"XL", price:30.00 }
        ]}},
        { id:"seedling_1g", cat:"plants", title:"MayaNut Seedling", price:34.95, img:"maya-nut-mayanut-plant-tree-nursery.jpg", inStock:false, desc:"Seedlings will be shipped bareroot.", tagline:"", variant:{ label:"SIZE", defaultKey:"1gl", options:[
          { key:"1gl", label:"1 GL", price:34.95 }
        ]}},
        { id:"seeds_10",    cat:"plants", title:"MayaNut Seeds", price:9.95, img:"maya-nut-mayanut-fruit-brosimum-alicastrum.jpg", inStock:false, desc:"Seeds are water tested for improved viability.", tagline:"", variant:{ label:"PACK", defaultKey:"10pc", options:[
          { key:"10pc", label:"10 PC", price:9.95 }
        ]}}
      ];

      const grids = {
        powder: document.getElementById("grid-powder"),
        merch:  document.getElementById("grid-merch"),
        plants: document.getElementById("grid-plants")
      };

      const badge = document.getElementById("cart-badge");
      let cartCount = 0;
      const setBadge = ()=> { if(badge) badge.textContent = String(cartCount); };

      const money = (n)=> Number(n||0).toLocaleString(undefined,{style:"currency",currency:"USD"});
      const norm = (s)=> String(s||"").toLowerCase().trim();

      function getVariantPrice(p, key){
        const v = p.variant?.options?.find(o=>o.key===key) || p.variant?.options?.[0];
        return v ? v.price : (p.price || 0);
      }
      function getVariantLabel(p, key){
        const v = p.variant?.options?.find(o=>o.key===key) || p.variant?.options?.[0];
        return v ? v.label : "";
      }

      function cardHTML(p){
        const hasVariant = !!p.variant;
        const defaultKey = hasVariant ? p.variant.defaultKey : null;
        const basePrice = hasVariant ? getVariantPrice(p, defaultKey) : (p.price || 0);
        const variantLabel = hasVariant ? getVariantLabel(p, defaultKey) : "";

        const safeDesc = (p.desc || "").replace(/"/g,"&quot;");
        const safeTag = (p.tagline || "").replace(/"/g,"&quot;");

        return `
          <div class="product-shell" data-shell data-id="${p.id}" data-cat="${p.cat}" data-title="${p.title}"
               data-price="${basePrice}" data-stock="${p.inStock ? "1":"0"}" data-img="${p.img}" data-desc="${safeDesc}"
               ${hasVariant ? `data-variant-key="${defaultKey}"` : ""}>
            <article class="product-inner">
              <div class="prod-head">
                <div class="prod-title">${p.title}</div>
              </div>

              <div class="pimg">
                <img src="${p.img}" alt="${p.title}" loading="lazy" decoding="async" data-open-desc />
              </div>

              <div class="pbot">
                <div class="click-inner">
                  <div class="price-inline" data-price>${money(basePrice)}</div>

                  ${hasVariant ? `
                    <div class="variant-box" data-variant-anchor data-variant="${p.id}">
                      <div class="variant-left">${p.variant.label}</div>
                      <div class="variant-right">
                        <div class="variant-value" data-variant-value>${variantLabel}</div>
                        <svg class="variant-caret" viewBox="0 0 24 24" aria-hidden="true">
                          <path d="M6 9l6 6 6-6"></path>
                        </svg>
                      </div>
                    </div>
                  ` : ``}

                  <button class="addq" type="button" data-add>ADD</button>

                  <div class="qty-unified" aria-label="Quantity">
                    <button class="qty-btn" type="button" data-minus aria-label="Decrease">−</button>
                    <div class="qty-mid">
                      <input class="qty-number" type="number" min="1" max="99" step="1" value="1" inputmode="numeric" aria-label="Quantity value" />
                    </div>
                    <button class="qty-btn" type="button" data-plus aria-label="Increase">+</button>
                  </div>

                  ${safeTag ? `<div class="tagline">${safeTag}</div>` : `<div class="tagline" style="opacity:0">.</div>`}
                </div>
              </div>
            </article>
          </div>
        `;
      }

      const state = { sort:"newest", stockOnly:false, q:"" };

      function compareFn(sort){
        if(sort==="az") return (a,b)=> a.title.localeCompare(b.title);
        if(sort==="za") return (a,b)=> b.title.localeCompare(a.title);
        if(sort==="price_low") return (a,b)=> (a._priceSort||0) - (b._priceSort||0);
        if(sort==="price_high") return (a,b)=> (b._priceSort||0) - (a._priceSort||0);
        return (a,b)=> PRODUCTS.findIndex(x=>x.id===a.id) - PRODUCTS.findIndex(x=>x.id===b.id);
      }

      function wireQtyButtons(){
        const clamp = (n)=> Math.max(1, Math.min(99, n));
        document.querySelectorAll(".product-shell").forEach(shell=>{
          const qty = shell.querySelector(".qty-number");
          const plus = shell.querySelector("[data-plus]");
          const minus = shell.querySelector("[data-minus]");
          if(!qty || !plus || !minus) return;

          const set = (v)=> qty.value = String(clamp(parseInt(v,10)||1));
          set(qty.value);

          qty.addEventListener("input", ()=> set(qty.value));
          qty.addEventListener("blur", ()=> set(qty.value));
          plus.addEventListener("click", ()=> set((parseInt(qty.value,10)||1)+1));
          minus.addEventListener("click", ()=> set((parseInt(qty.value,10)||1)-1));
        });
      }

      function wireAddButtons(){
        document.querySelectorAll(".product-shell [data-add]").forEach(add=>{
          add.addEventListener("click", ()=>{
            const shell = add.closest(".product-shell");
            const qtyEl = shell?.querySelector(".qty-number");
            const q = Math.max(1, Math.min(99, parseInt(qtyEl?.value || "1",10) || 1));
            cartCount += q;
            setBadge();
          });
        });
      }

      function wireVariants(){
        document.querySelectorAll(".variant-box").forEach(box=>{
          const pid = box.getAttribute("data-variant");
          const p = PRODUCTS.find(x=>x.id===pid);
          if(!p || !p.variant) return;

          box.addEventListener("click", (e)=>{
            e.stopPropagation();
            const shell = box.closest(".product-shell");
            const activeKey = shell?.getAttribute("data-variant-key") || p.variant.defaultKey;

            window.__openVariantMenu?.(
              box,
              p.variant.options.map(o=>({ key:o.key, label:o.label })),
              activeKey,
              (newKey)=>{
                if(!shell) return;
                shell.setAttribute("data-variant-key", newKey);

                const newPrice = getVariantPrice(p, newKey);
                shell.setAttribute("data-price", String(newPrice));

                const priceEl = shell.querySelector("[data-price]");
                if(priceEl) priceEl.textContent = money(newPrice);

                const valEl = shell.querySelector("[data-variant-value]");
                if(valEl) valEl.textContent = getVariantLabel(p, newKey);
              }
            );
          });
        });
      }

      function wireImageDesc(){
        document.addEventListener("click", (e)=>{
          const img = e.target?.closest?.("[data-open-desc]");
          if(!img) return;
          const shell = img.closest(".product-shell");
          if(!shell) return;

          const title = shell.getAttribute("data-title") || "Product";
          const imgSrc = shell.getAttribute("data-img") || img.getAttribute("src") || "";
          const desc = shell.getAttribute("data-desc") || "";

          const vid = shell.getAttribute("data-id");
          const p = PRODUCTS.find(x=>x.id===vid);

          let extra = "";
          if(p?.variant){
            const key = shell.getAttribute("data-variant-key") || p.variant.defaultKey;
            const vLabel = getVariantLabel(p, key);
            const vPrice = getVariantPrice(p, key);
            extra = `\n\nSelected ${p.variant.label.toLowerCase()}: ${vLabel}\nPreview price: ${money(vPrice)}`;
          }else{
            extra = `\n\nPreview price: ${money(parseFloat(shell.getAttribute("data-price")||"0")||0)}`;
          }

          window.__openDescModal?.(title, imgSrc, (desc || "Product details are conceptual while the store is under development.") + extra);
        });
      }

      function apply(){
        const q = norm(state.q);

        const listByCat = { powder:[], merch:[], plants:[] };
        PRODUCTS.forEach(p=>{
          let priceForSort = p.price || 0;
          if(p.variant) priceForSort = getVariantPrice(p, p.variant.defaultKey);
          const clone = { ...p, _priceSort: priceForSort };
          listByCat[p.cat].push(clone);
        });

        for(const k of ["powder","merch","plants"]){
          let list = listByCat[k];
          if(state.stockOnly) list = list.filter(p=>p.inStock);
          if(q) list = list.filter(p=> norm(p.title).includes(q));
          list = list.slice().sort(compareFn(state.sort));
          grids[k].innerHTML = list.map(cardHTML).join("");
        }

        wireQtyButtons();
        wireAddButtons();
        wireVariants();
      }

      function bindDesktopFilters(){
        document.querySelectorAll('input[name="sortmode"]').forEach(r=>{
          r.addEventListener("change", ()=>{ state.sort = r.value; apply(); });
        });
        const stock = document.getElementById("in-stock-only");
        stock?.addEventListener("change", ()=>{ state.stockOnly = !!stock.checked; apply(); });
      }

      function bindSearch(){
        const s = document.getElementById("store-search");
        const sc = document.getElementById("store-search-clear");
        s?.addEventListener("input", ()=>{ state.q = s.value; apply(); });
        sc?.addEventListener("click", ()=>{ if(!s) return; s.value=""; state.q=""; apply(); s.focus(); });
      }

      setBadge();
      apply();
      bindDesktopFilters();
      bindSearch();
      wireImageDesc();
      wireVariants();
    })();
  </script>
</body>
</html>
