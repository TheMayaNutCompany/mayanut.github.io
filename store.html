  <style>
    :root{
      --green:#1a6800;
      --green-deep:#0b3b17;

      --page-bg:#ffffff;

      --orange:#fd6c02;
      --orange-dark:#e95f02;
      --orange-mid:#ff7a1a;
      --orange-hi:#ffd2a8;

      --shadow: 0 18px 55px rgba(15,23,42,0.18);

      /* top tab gradient */
      --panel-green-grad: linear-gradient(
        90deg,
        #0b3b17 0%,
        #1a6800 20%,
        #2a8b2f 52%,
        #1a6800 82%,
        #0b3b17 100%
      );
      /* make left tab match top style but vertical */
      --panel-green-grad-vert: linear-gradient(
        180deg,
        #0b3b17 0%,
        #1a6800 20%,
        #2a8b2f 52%,
        #1a6800 82%,
        #0b3b17 100%
      );

      --head-grad: linear-gradient(180deg, #0b3b17 0%, #1a6800 60%, #0b3b17 100%);
      --mobile-green-grad: linear-gradient(180deg, #b7ff3f 0%, #2a8b2f 45%, #0b3b17 100%);

      --store-rest-bg: linear-gradient(
        180deg,
        rgba(11,59,23,0.08) 0%,
        rgba(26,104,0,0.06) 55%,
        rgba(216,255,106,0.08) 100%
      );

      --para-green: linear-gradient(
        180deg,
        rgba(233,255,214,0.98) 0%,
        rgba(201,245,165,0.92) 55%,
        rgba(179,232,135,0.96) 100%
      );

      --metal-orange: linear-gradient(
        180deg,
        var(--orange-hi) 0%,
        var(--orange-mid) 18%,
        var(--orange) 48%,
        var(--orange-dark) 72%,
        var(--orange-mid) 100%
      );

      --font-pretty: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;

      --stickyOffset: 140px;
      --filterGap: 10px;

      --navH: 138px;
      --cardImgH: 196px;
      --cardMinH: 365px;

      --catTabW: 56px;

      --a11y-blue:#084ac5;

      --thin-outline: 1px solid rgba(12,90,42,0.45);
      --btnText:#ffffff;

      --footerImg: "mayanuts-the-maya-nut-company-image.jpeg";
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
    html{
      background: var(--page-bg);
      overflow-x:hidden;
      scroll-padding-top: calc(var(--stickyOffset) + var(--filterGap) + 12px);
    }
    body{
      font-family: var(--font-sans);
      background: var(--page-bg);
      color:#0f172a;
      -webkit-font-smoothing: antialiased;
      overflow-x:hidden;
      overscroll-behavior-y:none;
    }
    img{ max-width:100%; height:auto; display:block; }
    a{ color:inherit; text-decoration:none; }
    button,input,select{ font-family:inherit; }

    .frame-wrap{ position:relative; width:100%; min-height:100vh; padding-top: var(--stickyOffset); overflow-x: clip; }

    .sticky-top{
      position:fixed; top:0; left:0; right:0;
      z-index:999;
      background: var(--panel-green-grad);
      border-top: 2px solid var(--green);
      border-bottom: 2px solid var(--green);
      box-shadow:0 10px 28px rgba(15,23,42,0.12);
      overflow:hidden;
      transform: translateZ(0);
    }

    .site-header{
      width:100%;
      background-image:url("menuart-the-maya-nut-company-art.jpeg");
      background-size:cover;
      background-position:center center;
      background-repeat:no-repeat;
      padding: 28px 0 32px;
      display:flex; align-items:center; justify-content:center;
      position:relative; min-height: var(--navH);
    }
    .site-header::after{
      content:""; position:absolute; inset:0;
      background: linear-gradient(to bottom, rgba(255,255,255,0.06), rgba(255,255,255,0.0) 55%);
      pointer-events:none;
    }

    .header-center-brand{
      position:absolute;
      left:50%;
      top:52%;
      transform: translate(-50%, -50%);
      font-family: "Slackey", system-ui, sans-serif;
      font-weight: 400;
      letter-spacing: .02em;
      text-transform: lowercase;
      font-size: 34px;
      color: #d8ff6a;
      -webkit-text-stroke: 1px rgba(11,59,23,0.95);
      text-shadow: 0 14px 34px rgba(15,23,42,0.20);
      pointer-events:none;
      user-select:none;
      z-index:2;
      white-space:nowrap;
    }

    .main-nav{
      width:100%;
      max-width:1240px;
      display:flex; align-items:center; justify-content:flex-start;
      gap:10px;
      padding:0;
      position:relative; z-index:3; min-height:56px;
    }

    /* left group: logo + tabs all the way left */
    .nav-left{
      display:flex;
      align-items:center;
      gap:10px;
      margin-left: 6px;
      flex:1 1 auto;
      min-width:0;
    }

    .nav-logo{
      display:flex;
      align-items:center;
      flex:0 0 auto;
    }
    .nav-logo img{
      width:92px;
      height:92px;
      border-radius:0;
      background: transparent;
      border: none;
      box-shadow:none;
      object-fit:contain;
      filter: drop-shadow(0 14px 30px rgba(15,23,42,0.22));
    }

    .nav-center{
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:12px;
      flex:1 1 auto;
      min-width:0;
    }
    .nav-pill{
      height:40px;
      padding:0 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.55);
      background: var(--mobile-green-grad);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 10px 22px rgba(15,23,42,0.10);
      transition: transform .12s ease;
      flex:0 0 auto;
    }
    .nav-pill:hover{ transform: translateY(-1px) scale(1.02); }
    .nav-pill span{
      font-size:12px;
      letter-spacing:0.10em;
      text-transform:uppercase;
      font-weight:950;
      color: var(--btnText);
      text-shadow:0 1px 0 rgba(0,0,0,0.18);
      white-space:nowrap;
    }
    .nav-pill.is-active{
      background: var(--metal-orange);
      border-color: rgba(255,255,255,0.55);
    }
    .nav-pill.is-active span{ color: var(--btnText); }

    /* right group: español + email all the way right */
    .nav-right{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:10px;
      margin-right: 6px;
      flex:0 0 auto;
      z-index:4;
    }
    .lang-pill{
      height:40px; padding:0 14px; border-radius:14px;
      border:1px solid rgba(255,255,255,0.55);
      background: var(--mobile-green-grad);
      color:var(--btnText);
      font-weight:950; letter-spacing:0.10em;
      text-transform:uppercase; font-size:12px;
      box-shadow:0 10px 22px rgba(15,23,42,0.12);
      display:inline-flex; align-items:center; justify-content:center;
      flex:0 0 auto;
    }
    .email-top{
      width:40px; height:40px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.55);
      background: rgba(255,255,255,0.18);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 10px 22px rgba(15,23,42,0.12);
      flex:0 0 auto;
    }
    .email-top svg{
      width:20px; height:20px;
      stroke: #1a6800;
      fill:none;
      stroke-width:2.2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    main{
      border-top: 2px solid rgba(12,90,42,0.95);
      border-bottom: 2px solid rgba(12,90,42,0.95);
      box-shadow: var(--shadow);
      background: #ffffff;
      min-height: calc(100vh - var(--stickyOffset));
      overflow: visible;
    }
    .content-wrapper{ padding:10px 10px 32px; max-width:1400px; margin:0 auto; }
    .store-layout{ display:grid; grid-template-columns: 220px 1fr; gap:10px; align-items:start; }

    .filter-outline, .oframe{
      border-radius:18px;
      background: transparent;
      padding:0;
      box-shadow:0 14px 40px rgba(15,23,42,0.06);
      border: var(--thin-outline);
      overflow:hidden;
    }

    .left-shell{ position: sticky; top: calc(var(--stickyOffset) + var(--filterGap)); width:100%; }
    .left-head{
      background: var(--head-grad);
      padding:10px 12px;
      font-family: var(--font-pretty);
      font-style: italic;
      font-weight:900;
      letter-spacing:.04em;
      text-transform:uppercase;
      font-size:14px;
      color: var(--btnText);
      border-bottom: var(--thin-outline);
      min-height:56px;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .left-head::after{
      content:"";
      flex:1;
      height:2px;
      background: var(--line-grad);
      border-radius:999px;
      opacity:.95;
      transform: translateY(2px);
    }
    .left-body{ padding:12px; display:flex; flex-direction:column; gap:10px; background: rgba(255,255,255,0.08); }
    .filter-group{ border-radius:12px; background: var(--para-green); padding:10px; border: var(--thin-outline); }
    .filter-title{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
    .filter-title::after{ content:""; flex:1; height:2px; background: var(--line-grad); border-radius:999px; transform: translateY(2px); opacity:.85; }
    .filter-title .ftag{
      display:inline-flex; align-items:center;
      background: var(--head-grad);
      color: var(--btnText);
      border-radius:12px;
      padding:5px 10px;
      border:1px solid rgba(255,255,255,0.35);
      font-family: var(--font-pretty);
      font-style: italic;
      font-weight:900;
      letter-spacing:.04em;
      text-transform:uppercase;
      font-size:12px;
      white-space:nowrap;
    }
    .filter-item{ display:flex; align-items:center; gap:10px; padding:6px 0; font-weight:900; font-size:12px; color:#0b1220; }
    .filter-item input{ accent-color: #1a6800; }

    .grid-wrap{
      background: var(--store-rest-bg);
      display:flex;
      flex-direction:column;
      border-radius:18px;
      overflow:hidden;
    }
    .grid-head{
      background: var(--head-grad);
      padding:10px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      border-bottom: var(--thin-outline);
      min-height:56px;
      border-top-left-radius:18px;
      border-top-right-radius:18px;
      position:relative;
      z-index:2;
    }
    .store-brand{ display:flex; align-items:center; gap:10px; min-width:0; flex:1 1 auto; }
    .store-logo{ width:44px; height:44px; filter: drop-shadow(0 10px 18px rgba(15,23,42,0.18)); }
    .grid-title{
      font-family: var(--font-pretty);
      font-style: italic;
      font-weight:900;
      letter-spacing:.04em;
      text-transform:uppercase;
      font-size:17px;
      color: #ffffff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:340px;
    }
    .title-line{
      height:2px;
      background: var(--line-grad);
      border-radius:999px;
      margin-left:12px;
      margin-right:12px;
      flex:1 1 auto;
      max-width:220px;
      transform: translateY(2px);
      opacity:.9;
    }

    .grid-tools{ display:flex; align-items:center; justify-content:flex-end; gap:8px; }
    .store-search{
      height:40px; border-radius:14px; border: var(--thin-outline);
      background:#fff; display:flex; align-items:center; overflow:hidden;
      width:min(420px, 34vw);
      box-shadow:0 10px 20px rgba(15,23,42,0.06);
      min-width:220px;
    }
    .store-search .mag,.store-search .xbtn{ width:40px; height:40px; display:flex; align-items:center; justify-content:center; flex:0 0 40px; cursor:pointer; user-select:none; }
    .store-search .xbtn{ border-left:none; background:transparent; }
    .store-search .mag svg,.store-search .xbtn svg{ width:16px; height:16px; stroke:var(--orange); fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
    .store-search input{
      border:none; outline:none; background:transparent;
      color:#0b1220; font-weight:950; letter-spacing:.02em; font-size:11px;
      padding:0 10px; width:100%; min-width:0; caret-color:var(--orange);
    }

    .checkout-fused{
      height:40px; border-radius:14px; padding:0 12px;
      border: 1px solid rgba(255,255,255,0.55);
      background: var(--metal-orange);
      display:flex; align-items:center; justify-content:center;
      gap:8px;
      cursor:pointer;
      box-shadow:0 10px 18px rgba(15,23,42,0.10);
      user-select:none;
      min-width:170px;
      position:relative;
    }
    .checkout-fused .dust{ display:flex; flex-direction:column; gap:3px; margin-right:-4px; align-items:flex-end; }
    .checkout-fused .dust span{ display:block; height:2px; border-radius:999px; background: #ffffff; opacity:.9; }
    .checkout-fused .dust span:nth-child(1){ width:10px; }
    .checkout-fused .dust span:nth-child(2){ width:16px; }
    .checkout-fused .dust span:nth-child(3){ width:12px; }
    .checkout-fused svg{ width:18px; height:18px; stroke: #ffffff; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
    .checkout-fused .txt{ font-weight:950; letter-spacing:.10em; text-transform:uppercase; font-size:10px; color: #ffffff; white-space:nowrap; }
    .cart-badge{
      position:absolute;
      top:-7px;
      right:-7px;
      min-width:18px;
      height:18px;
      padding:0 6px;
      border-radius:999px;
      background: #ffffff;
      border:1px solid rgba(255,255,255,0.65);
      color: var(--orange);
      font-weight:1000;
      font-size:11px;
      display:flex;
      align-items:center;
      justify-content:center;
      line-height:1;
      pointer-events:none;
    }

    .grid-body{ padding:10px 12px; padding-left:0; position:relative; }
    .store-body-wrap{ display:flex; align-items:stretch; gap:0; position:relative; }

    /* LEFT TAB background now matches top but vertical */
    .cat-tab{
      width: var(--catTabW);
      flex:0 0 var(--catTabW);
      background: var(--panel-green-grad-vert);
      border-right: var(--thin-outline);
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      padding:0;
      margin:0;
      border-top-left-radius:18px;
      border-bottom-left-radius:18px;
      overflow:hidden;
      position:relative;
    }
    .cat-tab::before{
      content:"";
      position:absolute;
      top:0;
      right:-18px;
      width:36px;
      height:36px;
      border-radius:18px;
      background: var(--store-rest-bg);
      box-shadow: -1px 0 0 rgba(12,90,42,0.20);
      pointer-events:none;
    }

    .cat-btn{ border:none; background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:1 1 0; padding:10px 0; }
    .cat-btn:hover{ background: rgba(255,255,255,0.06); }
    .cat-btn.is-active{ background: rgba(255,255,255,0.10); }

    /* Powder/Merch/Plants ORANGE text with THIN DARK GREEN OUTLINE (no lime boxes/lines) */
    .cat-text{
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:2px;
      font-weight:1000;
      text-transform:uppercase;
      letter-spacing:0.02em;
      color: var(--orange);
      -webkit-text-stroke: 1px rgba(11,59,23,0.95); /* thin dark green outline */
      text-shadow: 0 2px 10px rgba(15,23,42,0.15);
      line-height:1;
      font-size:26px;
      width:100%;
    }

    .store-content{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:10px; padding-left:12px; }

    /* keep section separators as-is */
    .section-sep{
      height:4px;
      background: var(--line-grad);
      border-radius:999px;
      opacity:.85;
      margin: 2px 0;
      width: calc(100% + var(--catTabW) + 24px);
      margin-left: calc(-1 * (var(--catTabW) + 12px));
    }
    .section-block{ border-radius:18px; background: rgba(255,255,255,0.35); border: var(--thin-outline); padding:8px; box-shadow:0 10px 22px rgba(15,23,42,0.05); }

    .product-grid{ display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:10px; }
    .product-shell{
      border-radius:18px;
      background: rgba(255,255,255,0.55);
      box-shadow:0 10px 22px rgba(15,23,42,0.05);
      min-height: var(--cardMinH);
      border: var(--thin-outline);
      overflow:hidden;
      display:flex;
    }
    .product-inner{ flex:1; display:flex; flex-direction:column; }

    .prod-head{
      background: var(--para-green);
      padding:8px 10px;
      display:flex; align-items:center; gap:10px;
      border-bottom: var(--thin-outline);
      min-height:44px;
    }
    .prod-title-pill{
      background: var(--head-grad);
      color: #ffffff;
      border-radius:12px;
      padding:5px 10px;
      border:1px solid rgba(255,255,255,0.35);
      font-family: var(--font-pretty);
      font-style: italic;
      font-weight:900;
      letter-spacing:.04em;
      font-size:12px;
      white-space:nowrap;
      max-width: 100%;
      overflow:hidden;
      text-overflow:ellipsis;
      display:inline-flex;
      align-items:center;
    }
    .prod-title-line{
      flex:1; height:2px; background: var(--line-grad);
      border-radius:999px; transform: translateY(2px);
      opacity:.85; min-width: 18px;
    }

    /* ... rest unchanged ... */
    .pimg{ background:#fff; border-bottom: var(--thin-outline); position:relative; }
    .pimg img{ width:100%; height: var(--cardImgH); object-fit:cover; display:block; cursor:pointer; }

    .pbot{ padding:8px; flex:1 1 auto; display:flex; background: var(--para-green); }
    .click-inner{
      width:100%;
      display:grid;
      grid-template-columns: 1fr 1fr;
      grid-auto-rows: min-content;
      column-gap:10px;
      row-gap:6px;
      align-content:start;
    }

    .price-inline{
      grid-column: 1;
      height:26px;
      display:flex; align-items:center; justify-content:flex-start;
      color:#0b1220;
      font-weight:1000;
      font-size:13px;
      text-decoration: underline;
      text-underline-offset:2px;
      white-space:nowrap;
      padding-left:2px;
    }

    .variant-box{
      grid-column: 2;
      justify-self:end;
      height:26px;
      border: var(--thin-outline);
      background: rgba(255,255,255,0.55);
      border-radius:0;
      padding:0 10px;
      display:flex;
      align-items:center;
      gap:10px;
      cursor:pointer;
      user-select:none;
      min-width: 160px;
      max-width: 230px;
      justify-content:space-between;
    }
    .variant-left{
      font-weight:950;
      letter-spacing:.10em;
      text-transform:uppercase;
      font-size:10px;
      color:#0b1220;
      white-space:nowrap;
    }
    .variant-value{
      font-weight:1000;
      font-size:11px;
      color:#0b1220;
      white-space:nowrap;
    }
    .variant-right{ display:flex; align-items:center; gap:8px; white-space:nowrap; }
    .variant-caret{ width:14px; height:14px; stroke:#0b1220; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; opacity:.9; }

    .addq{
      grid-column: 1;
      height:32px;
      border-radius:14px;
      border: var(--thin-outline);
      background: var(--metal-orange);
      color: #ffffff;
      font-weight:950;
      letter-spacing:.10em;
      text-transform:uppercase;
      font-size:10px;
      cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 10px 18px rgba(15,23,42,0.08);
      white-space:nowrap;
    }

    .qty-unified{
      grid-column: 2;
      justify-self:end;
      height:32px;
      border-radius:14px;
      border: var(--thin-outline);
      background: var(--mobile-green-grad);
      display:flex; align-items:stretch; overflow:hidden;
      box-shadow:0 10px 18px rgba(15,23,42,0.08);
      min-width:110px; max-width:160px;
    }
    .pm-stack{ width:30px; display:flex; flex-direction:column; }
    .pm-stack button{
      flex:1 1 0;
      border:none; background:transparent;
      color:#ffffff;
      font-weight:1000; font-size:12px;
      cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      user-select:none;
      line-height:1;
    }
    .pm-stack button + button{ border-top:1px solid rgba(255,255,255,0.35); }
    .qty-sep{ width:1px; background: rgba(255,255,255,0.45); }
    .qty-number{
      width:100%;
      border:none; outline:none; background:transparent;
      color:#ffffff;
      font-weight:1000; font-size:12px;
      text-align:center;
      -moz-appearance:textfield;
    }
    .qty-number::-webkit-outer-spin-button,
    .qty-number::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }

    .tagline{
      grid-column: 1 / -1;
      font-family: var(--font-pretty);
      font-style: italic;
      font-weight: 850;
      font-size: 11px;
      color: rgba(0,0,0,0.55);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      padding-left:2px;
      margin-top:2px;
    }

    .variant-menu{
      position:absolute;
      z-index:2000;
      min-width: 190px;
      border: var(--thin-outline);
      background: rgba(255,255,255,0.98);
      box-shadow: 0 18px 55px rgba(15,23,42,0.18);
      padding:6px;
    }
    .variant-menu .opt{
      border-radius:10px;
      padding:8px 10px;
      cursor:pointer;
      font-weight:950;
      font-size:12px;
      color: #ffffff;
      background: var(--head-grad);
      margin-bottom:6px;
    }
    .variant-menu .opt:last-child{ margin-bottom:0; }
    .variant-menu .opt.is-active{
      color: #ffffff;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25);
      outline: 2px solid rgba(255,255,255,0.25);
      outline-offset: -2px;
    }

    /* Modal */
    .overlay{
      position:fixed; inset:0; display:none;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(6px);
      z-index:3000;
      padding:18px;
    }
    body.modal-open .overlay{ display:block; }
    .modal{
      max-width: 880px;
      margin: 40px auto;
      border-radius:18px;
      background: rgba(255,255,255,0.98);
      border: var(--thin-outline);
      box-shadow:0 18px 60px rgba(15,23,42,0.35);
      overflow:hidden;
    }
    .modal-head{
      background: var(--head-grad);
      padding:12px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .modal-title{
      color:#ffffff;
      font-family: var(--font-pretty);
      font-style: italic;
      font-weight:900;
      letter-spacing:.04em;
      text-transform:uppercase;
      font-size:14px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .modal-close{
      width:40px; height:40px;
      border-radius:14px;
      border: 1px solid rgba(255,255,255,0.55);
      background: var(--metal-orange);
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .modal-close svg{ width:18px; height:18px; stroke: #ffffff; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
    .modal-body{
      padding:14px;
      display:grid;
      grid-template-columns: 1.2fr 1fr;
      gap:14px;
    }
    .modal-body img{
      width:100%;
      height:320px;
      object-fit:cover;
      border-radius:16px;
      border: var(--thin-outline);
      background:#fff;
    }
    .modal-copy{
      border-radius:16px;
      border: var(--thin-outline);
      background: var(--para-green);
      padding:12px;
      font-family: var(--font-pretty);
      font-style: italic;
      font-weight:850;
      line-height:1.7;
      color:#0b1220;
      white-space:pre-line;
    }

    /* FOOTER rotated background, 3 tiles across, using JPEG only */
    footer{
      position:relative;
      border-top: 2px solid var(--green);
      border-bottom: 2px solid var(--green);
      overflow:hidden;
      margin-top: 10px;
      color:#fff;
    }
    footer::before{
      content:"";
      position:absolute;
      inset:-40% -40%;
      background-image: url("mayanuts-the-maya-nut-company-image.jpeg");
      background-repeat: repeat-x;
      background-size: 33.333% 100%;
      background-position: center;
      transform: rotate(90deg);
      transform-origin: center;
      filter: saturate(1.05) contrast(1.02);
    }
    footer::after{
      content:"";
      position:absolute; inset:0;
      background: rgba(0,0,0,0.60);
    }

    .footer-wrap{
      position:relative;
      z-index:1;
      max-width:1200px;
      margin:0 auto;
      padding: 16px 22px 18px;
      display:grid;
      grid-template-columns: 1.2fr 1fr;
      gap:16px;
      align-items:stretch;
    }

    .newsletter{ border:none; background: transparent; padding: 0; display:flex; flex-direction:column; gap:8px; align-items:flex-start; min-width:0; }
    .nl-title{ font-weight:950; letter-spacing:0.12em; text-transform:uppercase; font-size:12px; color: #ffffff; text-shadow:0 2px 14px rgba(0,0,0,0.55); }
    .nl-sub{
      font-family: var(--font-pretty); font-style: italic; font-weight:850;
      letter-spacing:0.01em; color: #ffffff;
      font-size:13px; line-height:1.45;
      text-shadow:0 2px 14px rgba(0,0,0,0.55);
      max-width: 520px;
    }
    .newsletter-form{ display:flex; gap:10px; align-items:center; width:100%; max-width: 520px; }
    .newsletter-form input{
      flex:1; min-width: 180px; height:40px;
      border-radius:14px; border: 1px solid rgba(255,255,255,0.45);
      background: rgba(255,255,255,0.90);
      padding: 0 12px; font-weight:900; font-size:12px;
      outline:none; color:#111827;
    }
    .metal-btn{
      border: 1px solid rgba(255,255,255,0.45);
      background: var(--metal-orange);
      color: #ffffff;
      border-radius:14px;
      padding:10px 14px;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:0.10em;
      cursor:pointer;
      font-weight:950;
      min-height:40px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      white-space:nowrap;
      box-shadow:0 14px 36px rgba(0,0,0,0.25);
    }

    .footer-left{ display:flex; align-items:flex-start; gap:16px; min-width:0; }
    .footer-logo{
      width:116px; height:auto;
      cursor:pointer;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.45));
      flex:0 0 auto;
    }
    .footer-text{ display:flex; flex-direction:column; gap:10px; min-width:0; flex:1 1 auto; align-items:flex-start; }
    .based-line{
      display:flex; align-items:center; gap:8px;
      white-space:nowrap;
      font-family: var(--font-pretty);
      font-style: italic;
      font-weight: 900;
      font-size:14px;
      letter-spacing:0.04em;
      color: #ffffff;
      text-shadow:0 2px 14px rgba(0,0,0,0.60);
    }
    .florida-icon{ width:26px; height:26px; filter: drop-shadow(0 2px 12px rgba(0,0,0,0.55)); }
    .copyright-line{
      font-family: var(--font-pretty);
      font-style: italic;
      font-weight: 900;
      font-size:14px;
      letter-spacing:0.04em;
      color: #ffffff;
      text-shadow:0 2px 14px rgba(0,0,0,0.60);
      white-space:nowrap;
    }

    .footer-row3{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
    .footer-links{ display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
    .footer-links a{
      font-family: var(--font-pretty);
      font-style: italic;
      font-weight: 900;
      font-size:14px;
      letter-spacing:0.04em;
      color: #ffffff;
      text-decoration:none;
      border-bottom:1px solid rgba(255,255,255,0.40);
      padding-bottom:2px;
      white-space:nowrap;
      text-shadow:0 2px 14px rgba(0,0,0,0.60);
    }

    .footer-icons{ display:flex; align-items:center; gap:10px; flex-wrap:nowrap; }
    .icon-pill{
      width:36px; height:36px;
      border-radius:14px;
      border: 1px solid rgba(255,255,255,0.40);
      background: var(--metal-orange);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      box-shadow:0 12px 28px rgba(0,0,0,0.30);
      flex:0 0 auto;
    }
    .icon-pill svg{ width:20px; height:20px; stroke: #ffffff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .icon-pill .fill{ fill: #ffffff; stroke:none; }

    .email-inline{ display:flex; align-items:center; gap:10px; white-space:nowrap; }
    .email-text{
      font-family: var(--font-pretty);
      font-style: italic;
      font-weight: 900;
      font-size:13px;
      color: #ffffff;
      text-shadow:0 2px 14px rgba(0,0,0,0.60);
      white-space:nowrap;
    }

    .fab{
      position:fixed; z-index:1300;
      width:52px; height:52px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.35);
      display:flex; align-items:center; justify-content:center;
      cursor:pointer;
      box-shadow:0 10px 25px rgba(15,23,42,0.25);
      user-select:none;
      overflow:hidden;
      right:14px; bottom:14px;
      background: var(--a11y-blue);
    }
    .fab::before{
      content:""; position:absolute; inset:7px;
      border-radius:999px;
      border:2px solid rgba(255,255,255,0.95);
      opacity:.75;
      pointer-events:none;
    }
    .fab svg{
      width:28px; height:28px;
      fill:none; stroke:#ffffff;
      stroke-width:2.1;
      stroke-linecap:round; stroke-linejoin:round;
      position:relative; z-index:1;
    }

    @media(max-width:1100px){
      .product-grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media(max-width:980px){
      .store-layout{ grid-template-columns: 1fr; }
      .filter-col{ display:none; }
      .cat-tab{ display:none; }
      .section-sep{ width:100%; margin-left:0; }
      .store-content{ padding-left:0; }
      .footer-wrap{ grid-template-columns:1fr; }
      .newsletter-form{ flex-direction:column; align-items:stretch; }
      .newsletter-form input{ width:100%; min-width:0; }
      .footer-icons{ flex-wrap:wrap; }
      .email-inline{ flex-wrap:wrap; }
      .variant-box{ max-width: 999px; }
      .nav-logo img{ width:78px; height:78px; }
      .header-center-brand{ font-size: 28px; }
    }
    @media(max-width:780px){
      .header-center-brand{ display:none; }
      .nav-center{ display:none !important; }
      .based-line{ flex-wrap:wrap; white-space:normal; }
      .email-inline{ flex-wrap:wrap; }
    }
  </style>
</head>
