<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>MayaNut Store | The MayaNut Company</title>

<meta name="description" content="Shop MayaNut powder, merch, and plants from The MayaNut Company. Sustainable Brosimum alicastrum products grown and researched in South Florida." />
<meta name="keywords" content="MayaNut, maya nut, Brosimum alicastrum, MayaNut powder, MayaNut seeds, tropical food tree, sustainable agriculture" />
<link rel="canonical" href="https://mayanut.com/store.html" />

<link rel="icon" href="mayanut-the-mayanut-comapny-logo.png" />
<link href="https://fonts.googleapis.com/css2?family=Acme&display=swap" rel="stylesheet" />

<style>
:root{
  --green:#066100;
  --lime:#d8ff6a;
  --pale:#e9ffd6;
  --orange:#fd6c02;
  --darkOrange:#c84b02;
  --border:1px solid rgba(6,97,0,.35);
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Acme",system-ui,sans-serif;
  background:#fff;
  color:#0f172a;
}

/* SCROLLBAR */
::-webkit-scrollbar{width:14px}
::-webkit-scrollbar-track{background:#2f2f2f}
::-webkit-scrollbar-thumb{
  background:#9a9a9a;
  border-radius:999px;
  border:3px solid #2f2f2f;
}

/* HEADER */
header{
  background:url("menuart-the-maya-nut-company-art.jpeg") center/cover no-repeat;
  padding:24px 0 40px;
  border-bottom:1px solid rgba(6,97,0,.5);
}
.header-inner{
  max-width:1200px;
  margin:0 auto;
  padding:0 24px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
}
.brand img{width:64px}
.brand span{
  font-size:34px;
  color:var(--lime);
}

.nav-btn{
  position:absolute;
  top:10px;
  background:var(--orange);
  color:#fff;
  padding:8px 14px;
  border-radius:14px;
  text-decoration:none;
}
.nav-left{left:60px}
.nav-right{right:60px}

/* PAGE WRAP */
main{
  max-width:1200px;
  margin:0 auto;
  padding:24px;
}

/* STORE LAYOUT */
.store-layout{
  display:grid;
  grid-template-columns:240px 1fr;
  gap:20px;
}

/* FILTER */
.filter{
  border:var(--border);
  border-radius:18px;
  overflow:hidden;
}
.filter h3{
  background:var(--green);
  color:#fff;
  padding:14px;
  letter-spacing:.14em;
  font-size:14px;
}
.filter-body{
  background:#fff;
  padding:14px;
}
.filter-body label{
  display:block;
  margin:6px 0;
}

/* STORE MAIN */
.store-main{
  border:var(--border);
  border-radius:18px;
  overflow:hidden;
}

/* STORE BAR */
.store-bar{
  background:var(--green);
  padding:12px;
  display:flex;
  gap:12px;
  align-items:center;
}
.store-bar input{
  flex:1;
  border-radius:14px;
  border:none;
  padding:10px;
}
.checkout{
  background:var(--orange);
  color:#fff;
  padding:10px 16px;
  border-radius:14px;
  position:relative;
}
.checkout span{
  position:absolute;
  top:6px;
  right:8px;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#fff;
}

/* PRODUCT GRID */
.section{
  padding:18px;
}
.section h4{
  margin:0 0 10px;
  font-size:16px;
  text-transform:uppercase;
  letter-spacing:.12em;
}
.products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

/* PRODUCT CARD */
.card{
  border:var(--border);
  border-radius:18px;
  overflow:hidden;
}
.card-head{
  background:var(--pale);
  padding:10px;
  display:flex;
  justify-content:space-between;
  font-size:12px;
  text-transform:uppercase;
}
.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}
.card-body{
  background:var(--pale);
  padding:10px;
}
.actions{
  display:flex;
  gap:10px;
}
.add{
  flex:1;
  background:var(--orange);
  color:#fff;
  text-align:center;
  padding:12px;
  border-radius:14px;
}
.stack{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.stack div{
  background:#fff;
  border:var(--border);
  border-radius:14px;
  padding:6px 10px;
  text-align:center;
  font-size:12px;
}
.desc{
  margin-top:6px;
  font-size:12px;
  opacity:.7;
}

/* FOOTER */
footer{
  background:linear-gradient(#d8ff6a,#066100);
  padding:24px;
  color:#fff;
}
.footer-inner{
  max-width:1200px;
  margin:0 auto;
  display:grid;
  grid-template-columns:1fr 2fr;
  gap:24px;
}
.social a{
  display:inline-flex;
  width:38px;
  height:38px;
  background:var(--orange);
  border-radius:14px;
  align-items:center;
  justify-content:center;
  margin-right:8px;
}
.social svg{width:20px;height:20px;fill:#fff}

@media(max-width:900px){
  .store-layout{grid-template-columns:1fr}
  .products{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <a class="nav-btn nav-left" href="contact.html">Contact</a>
  <a class="nav-btn nav-right" href="store-es.html">Español</a>
  <div class="header-inner">
    <div class="brand">
      <img src="mayanut-the-mayanut-comapny-logo.png" alt="The MayaNut Company logo">
      <span>The MayaNut Company</span>
    </div>
  </div>
</header>

<main>

<div class="store-layout">

<!-- FILTER -->
<aside class="filter">
  <h3>FILTER</h3>
  <div class="filter-body">
    <label><input type="radio" name="cat" checked> All</label>
    <label><input type="radio" name="cat"> Powder</label>
    <label><input type="radio" name="cat"> Merch</label>
    <label><input type="radio" name="cat"> Plants</label>
  </div>
</aside>

<!-- STORE -->
<section class="store-main">

  <div class="store-bar">
    <input type="text" placeholder="Search MayaNut Store..." />
    <div class="checkout">Checkout <span></span></div>
  </div>

  <!-- POWDER -->
  <div class="section">
    <h4>Powder</h4>
    <div class="products">
      <div class="card">
        <div class="card-head"><span>MayaNut Powder</span><span>$9.95</span></div>
        <img src="mayanut-powder-maya-nut-brosimum-alicastrum.png" alt="MayaNut powder">
        <div class="card-body">
          <div class="actions">
            <div class="add">ADD</div>
            <div class="stack">
              <div>WEIGHT</div>
              <div>QTY</div>
            </div>
          </div>
          <div class="desc">Flavorful powder for bowls and baking</div>
        </div>
      </div>
    </div>
  </div>

  <!-- MERCH -->
  <div class="section">
    <h4>Merch</h4>
    <div class="products">
      <div class="card">
        <div class="card-head"><span>MayaNut Hat</span><span>$15</span></div>
        <img src="mayanut-merch-hat-brosimum-alicastrum.png" alt="MayaNut hat">
        <div class="card-body">
          <div class="actions">
            <div class="add">ADD</div>
            <div class="stack">
              <div>SIZE</div>
              <div>QTY</div>
            </div>
          </div>
          <div class="desc">Support MayaNut</div>
        </div>
      </div>
    </div>
  </div>

  <!-- PLANTS -->
  <div class="section">
    <h4>Plants</h4>
    <div class="products">
      <div class="card">
        <div class="card-head"><span>MayaNut Seeds</span><span>$9.95</span></div>
        <img src="maya-nut-mayanut-fruit-brosimum-alicastrum.jpg" alt="MayaNut seeds">
        <div class="card-body">
          <div class="actions">
            <div class="add">ADD</div>
            <div class="stack">
              <div>PACK</div>
              <div>QTY</div>
            </div>
          </div>
          <div class="desc">Grow your own MayaNut tree</div>
        </div>
      </div>
    </div>
  </div>

</section>

</div>
</main>

<footer>
  <div class="footer-inner">
    <div>
      <strong>Started in South Florida</strong>
      <img src="mayanut-the-mayanut-comapny-logo.png" width="200" alt="MayaNut logo">
    </div>
    <div class="social">
      <a href="#"><svg viewBox="0 0 24 24"><path d="M12 2..."/></svg></a>
      <a href="#"><svg viewBox="0 0 24 24"><path d="M10 8l6 4-6 4z"/></svg></a>
    </div>
  </div>
</footer>

</body>
</html>
