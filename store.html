  <link rel="preload" as="image" href="mayanut-the-mayanut-comapny-logo.png" />
  <link rel="preload" as="image" href="mayanuts-the-maya-nut-company-image.jpeg" />

  <style>
    :root{
      --green:#1a6800;
      --green-deep:#0b3b17;

      --page-bg:#ffffff;

      --orange:#fd6c02;
      --orange-dark:#e95f02;
      --orange-mid:#ff7a1a;
      --orange-hi:#ffd2a8;

      --lime:#d8ff6a;

      --shadow: 0 18px 55px rgba(15,23,42,0.18);

      --panel-green-grad: linear-gradient(
        90deg,
        #0b3b17 0%,
        #1a6800 20%,
        #2a8b2f 52%,
        #1a6800 82%,
        #0b3b17 100%
      );

      --panel-green-grad-vert: linear-gradient(
        180deg,
        #0b3b17 0%,
        #1a6800 20%,
        #2a8b2f 52%,
        #1a6800 82%,
        #0b3b17 100%
      );

      --head-grad: linear-gradient(180deg, #0b3b17 0%, #1a6800 60%, #0b3b17 100%);
      --mobile-green-grad: linear-gradient(180deg, #b7ff3f 0%, #2a8b2f 45%, #0b3b17 100%);

      --store-rest-bg: linear-gradient(
        180deg,
        rgba(11,59,23,0.08) 0%,
        rgba(26,104,0,0.06) 55%,
        rgba(216,255,106,0.08) 100%
      );

      --para-green: linear-gradient(
        180deg,
        rgba(233,255,214,0.98) 0%,
        rgba(201,245,165,0.92) 55%,
        rgba(179,232,135,0.96) 100%
      );

      --metal-orange: linear-gradient(
        180deg,
        var(--orange-hi) 0%,
        var(--orange-mid) 18%,
        var(--orange) 48%,
        var(--orange-dark) 72%,
        var(--orange-mid) 100%
      );

      --line-grad: linear-gradient(90deg, #d8ff6a 0%, #0b3b17 100%);

      --font-pretty: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;

      --stickyOffset: 140px; /* set via JS */
      --filterGap: 10px;

      --navH: 156px;

      --cardImgH: 196px;
      --cardMinH: 365px;

      --catTabW: 56px;

      --a11y-blue:#084ac5;

      --thin-outline: 1px solid rgba(12,90,42,0.45);
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
    html{
      background: var(--page-bg);
      overflow-x:hidden;
      scroll-padding-top: calc(var(--stickyOffset) + var(--filterGap) + 12px);
      text-rendering: geometricPrecision;
      -webkit-text-size-adjust: 100%;
    }
    body{
      font-family: var(--font-sans);
      background: var(--page-bg);
      color:#0f172a;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x:hidden;
      overscroll-behavior-y:none;
    }
    img{ max-width:100%; height:auto; display:block; }
    a{ color:inherit; text-decoration:none; }
    button,input,select{ font-family:inherit; }

    .frame-wrap{ position:relative; width:100%; min-height:100vh; padding-top: var(--stickyOffset); overflow-x: clip; }

    .sticky-top{
      position:fixed; top:0; left:0; right:0;
      z-index:999;
      background: var(--panel-green-grad);
      border-top: 2px solid var(--green);
      border-bottom: 2px solid var(--green);
      box-shadow:0 10px 28px rgba(15,23,42,0.12);
      overflow:hidden;
      transform: translateZ(0);
    }

    .site-header{
      width:100%;
      background-image:url("menuart-the-maya-nut-company-art.jpeg");
      background-size:cover;
      background-position:center center;
      background-repeat:no-repeat;
      padding: 26px 0 22px;
      display:flex; align-items:center; justify-content:center;
      position:relative; min-height: var(--navH);
    }
    .site-header::after{
      content:""; position:absolute; inset:0;
      background: linear-gradient(to bottom, rgba(255,255,255,0.06), rgba(255,255,255,0.0) 55%);
      pointer-events:none;
    }

    /* Center brand: logo next to brand text */
    .brand-center{
      position:absolute;
      left:50%;
      top:52%;
      transform: translate(-50%, -50%);
      display:flex;
      align-items:center;
      gap:10px;
      z-index:3;
      pointer-events:none;
      user-select:none;
      white-space:nowrap;
    }
    .brand-center img{
      width:86px;
      height:86px;
      object-fit:contain;
      filter: drop-shadow(0 14px 30px rgba(15,23,42,0.22));
    }
    .brand-center .brand-text{
      font-family: "Slackey", system-ui, sans-serif;
      font-weight: 400;
      letter-spacing: .02em;
      text-transform:none;
      font-size: 36px;
      color: var(--lime);
      -webkit-text-stroke: 0.6px rgba(11,59,23,0.95);
      text-shadow: 0 14px 34px rgba(15,23,42,0.20);
    }

    /* Top actions: email left, espanol right */
    .top-actions{
      position:absolute;
      left:0; right:0;
      top:52%;
      transform: translateY(-50%);
      z-index:4;
      pointer-events:none;
    }
    .actions-left{
      position:absolute;
      left:10px;
      top:50%;
      transform: translateY(-50%);
      display:flex;
      gap:10px;
      align-items:center;
      pointer-events:auto;
    }
    .actions-right{
      position:absolute;
      right:10px;
      top:50%;
      transform: translateY(-50%);
      display:flex;
      gap:10px;
      align-items:center;
      pointer-events:auto;
    }

    .email-top{
      width:40px; height:40px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.55);
      background: var(--mobile-green-grad);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 10px 22px rgba(15,23,42,0.12);
      flex:0 0 auto;
    }
    .email-top svg{
      width:20px; height:20px;
      stroke:#ffffff;
      fill:none;
      stroke-width:2.2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .lang-pill{
      height:40px; padding:0 14px; border-radius:14px;
      border:1px solid rgba(255,255,255,0.55);
      background: var(--mobile-green-grad);
      color:#ffffff;
      font-weight:950; letter-spacing:0.10em;
      text-transform:uppercase; font-size:12px;
      box-shadow:0 10px 22px rgba(15,23,42,0.12);
      display:inline-flex; align-items:center; justify-content:center;
      flex:0 0 auto;
      white-space:nowrap;
    }

    /* Slackey menu row under brand */
    .slackey-menu{
      position:absolute;
      left:50%;
      top:78%;
      transform: translate(-50%, -50%);
      display:flex;
      gap:26px;
      z-index:4;
      pointer-events:auto;
      user-select:none;
      white-space:nowrap;
    }
    .slackey-menu a{
      font-family:"Slackey", system-ui, sans-serif;
      font-weight:400;
      font-size:18px;
      color:#ffffff;
      letter-spacing:0.02em;
      -webkit-text-stroke: 0.45px rgba(11,59,23,0.90);
      text-shadow:0 10px 22px rgba(15,23,42,0.16);
      line-height:1;
      padding:2px 2px;
      text-decoration:none;
    }
    .slackey-menu a.is-active{
      color: var(--orange);
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 6px;
    }

    /* Frame banners inside main */
    .frame-banner{
      height:18px;               /* half height */
      background: var(--head-grad); /* exact match */
      border-left: 1px solid rgba(12,90,42,0.35);
      border-right: 1px solid rgba(12,90,42,0.35);
    }

    main{
      /* remove border-top to prevent double line with sticky bottom border */
      border-top: none;
      border-bottom: 2px solid rgba(12,90,42,0.95);
      box-shadow: var(--shadow);
      background: #ffffff;
      min-height: calc(100vh - var(--stickyOffset));
      overflow: visible;
    }

    .content-wrapper{ padding:10px 10px 22px; max-width:1400px; margin:0 auto; }
    .store-layout{ display:grid; grid-template-columns: 220px 1fr; gap:10px; align-items:start; }

    .filter-outline, .oframe{
      border-radius:18px;
      background: transparent;
      padding:0;
      box-shadow:0 14px 40px rgba(15,23,42,0.06);
      border: var(--thin-outline);
      overflow:hidden;
    }

    /* FILTER */
    .left-shell{
      position: sticky;
      top: calc(var(--stickyOffset) + var(--filterGap));
      width:100%;
    }
    .left-head{
      background: var(--head-grad);
      padding:10px 12px;
      font-family: "Slackey", system-ui, sans-serif;
      font-weight:400;
      letter-spacing:.06em;
      text-transform:uppercase;
      font-size:14px;
      color:#ffffff;
      border-bottom: var(--thin-outline);
      min-height:56px;
      display:flex;
      align-items:center;
      gap:10px;
      text-rendering: geometricPrecision;
    }
    .left-head::after{
      content:"";
      flex:1;
      height:2px;
      background: var(--line-grad);
      border-radius:999px;
      opacity:.95;
      transform: translateY(2px);
    }
    .left-body{ padding:12px; display:flex; flex-direction:column; gap:10px; background: rgba(255,255,255,0.08); }
    .filter-group{ border-radius:12px; background: var(--para-green); padding:10px; border: var(--thin-outline); }
    .filter-title{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
    .filter-title::after{ content:""; flex:1; height:2px; background: var(--line-grad); border-radius:999px; transform: translateY(2px); opacity:.85; }
    .filter-title .ftag{
      display:inline-flex; align-items:center;
      background: var(--head-grad);
      color:#ffffff;
      border-radius:12px;
      padding:5px 10px;
      border:1px solid rgba(255,255,255,0.35);
      font-family: "Slackey", system-ui, sans-serif;
      font-weight:400;
      letter-spacing:.06em;
      text-transform:uppercase;
      font-size:12px;
      white-space:nowrap;
      text-rendering: geometricPrecision;
    }
    .filter-item{ display:flex; align-items:center; gap:10px; padding:6px 0; font-weight:900; font-size:12px; color:#0b1220; }
    .filter-item input{ accent-color: #1a6800; }

    /* STORE */
    .grid-wrap{
      background: var(--store-rest-bg);
      display:flex;
      flex-direction:column;
      border-radius:18px;
      overflow:hidden;
    }
    .grid-head{
      background: var(--head-grad);
      padding:10px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      border-bottom: var(--thin-outline);
      min-height:56px;
    }

    /* Search left, line divider, checkout right */
    .grid-tools{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      width:100%;
    }

    .store-search{
      height:38px;
      border-radius:14px;
      border: var(--thin-outline);
      background:#fff;
      display:flex;
      align-items:center;
      overflow:hidden;
      width: 260px;          /* half-length */
      max-width: 58vw;
      box-shadow:0 10px 20px rgba(15,23,42,0.06);
      min-width: 220px;
    }
    .store-search .mag,
    .store-search .xbtn{
      width:38px; height:38px;
      display:flex; align-items:center; justify-content:center;
      flex:0 0 38px;
      cursor:pointer; user-select:none;
      background: transparent;
      border:none;           /* no internal vertical lines */
    }
    .store-search .mag svg,
    .store-search .xbtn svg{
      width:16px; height:16px;
      stroke: var(--orange);
      fill:none;
      stroke-width:2.2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    .store-search input{
      border:none; outline:none; background:transparent;
      color:#0b1220; font-weight:950; letter-spacing:.02em; font-size:12px;
      padding:0 10px; width:100%; min-width:0; caret-color:var(--orange);
    }
    .store-divider{
      height:2px;
      flex:1 1 auto;
      background: var(--line-grad);
      border-radius:999px;
      opacity:.9;
      transform: translateY(1px);
      min-width: 34px;
    }

    /* compact checkout */
    .checkout-fused{
      height:38px;
      border-radius:14px;
      padding:0 10px;
      border: 1px solid rgba(255,255,255,0.55);
      background: var(--metal-orange);
      display:flex; align-items:center; justify-content:center;
      gap:8px;
      cursor:pointer;
      box-shadow:0 10px 18px rgba(15,23,42,0.10);
      user-select:none;
      min-width: 0;
      width: auto;            /* shorter */
      position:relative;
    }
    .checkout-fused .txt{
      font-weight:950;
      letter-spacing:.10em;
      text-transform:uppercase;
      font-size:10px;
      color:#ffffff;
      white-space:nowrap;
    }
    .cart-icon-wrap{
      position:relative;
      width:18px; height:18px;
      display:flex; align-items:center; justify-content:center;
    }
    .cart-icon-wrap svg{
      width:18px; height:18px;
      stroke:#ffffff;
      fill:none;
      stroke-width:2.2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    /* badge at the front tip of cart, smaller */
    .cart-badge{
      position:absolute;
      top:-7px;
      left:-9px;              /* more left toward tip */
      min-width:14px;
      height:14px;
      padding:0 4px;
      border-radius:999px;
      background: var(--orange);
      border:1px solid rgba(255,255,255,0.65);
      color:#ffffff;          /* number white */
      font-weight:1000;
      font-size:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      line-height:1;
      pointer-events:none;
    }

    .grid-body{ padding:0; }               /* remove bottom gap so left tab meets bottom */
    .store-body-wrap{
      display:flex;
      align-items:stretch;
      gap:0;
      position:relative;
      padding:0 12px 12px;                 /* controlled padding here */
    }

    /* CONNECT left tab into store header area cleanly */
    .cat-tab{
      width: var(--catTabW);
      flex:0 0 var(--catTabW);
      background: var(--panel-green-grad-vert);
      border-right: var(--thin-outline);
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      padding-top: 56px;     /* header height */
      margin-top: -56px;     /* pull into header */
      border-top-left-radius:18px;
      border-bottom-left-radius:18px;
      overflow:hidden;
      position:relative;
    }
    /* rounded inner corner where tab meets header */
    .cat-tab::before{
      content:"";
      position:absolute;
      top:0;
      right:-18px;
      width:36px;
      height:36px;
      border-radius:18px;
      background: var(--store-rest-bg);
      box-shadow: -1px 0 0 rgba(12,90,42,0.20);
      pointer-events:none;
    }

    .cat-btn{
      border:none;
      background:transparent;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      flex:1 1 0;
      padding:12px 0;
    }
    .cat-btn:hover{ background: rgba(255,255,255,0.06); }
    .cat-btn.is-active{ background: rgba(255,255,255,0.10); }
    /* renamed category words */
    .cat-text{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;
      font-weight:1000;
      text-transform:uppercase;
      letter-spacing:0.08em; /* taller spacing feel */
      color: var(--lime);
      -webkit-text-stroke: 0.55px rgba(11,59,23,0.95);
      text-shadow: 0 2px 10px rgba(15,23,42,0.18);
      line-height:1.08;
      font-size:24px;
      width:100%;
      text-rendering: geometricPrecision;
    }

    .store-content{
      flex:1 1 auto;
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:10px;
      padding-left:12px;
      padding-top:10px;
      padding-bottom: 0;
    }

    /* remove full-width separators (requested) */
    .section-sep{ display:none; }

    .section-block{
      border-radius:18px;
      background: rgba(255,255,255,0.35);
      border: var(--thin-outline);
      padding:8px;
      box-shadow:0 10px 22px rgba(15,23,42,0.05);
    }

    .product-grid{ display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:10px; }

    .product-shell{
      border-radius:18px;
      background: rgba(255,255,255,0.55);
      box-shadow:0 10px 22px rgba(15,23,42,0.05);
      min-height: var(--cardMinH);
      border: var(--thin-outline);
      overflow:hidden;
      display:flex;
    }
    .product-inner{ flex:1; display:flex; flex-direction:column; }

    /* product top: left dark -> right pale green */
    .prod-head{
      background: linear-gradient(90deg, #0b3b17 0%, rgba(233,255,214,0.98) 62%, rgba(233,255,214,0.98) 100%);
      padding:8px 10px;
      display:flex; align-items:center; gap:10px;
      border-bottom: var(--thin-outline);
      min-height:44px;
    }
    .prod-title-pill{
      background: transparent;
      color:#ffffff;
      border-radius:0;
      padding:0;
      border:none;
      font-family: var(--font-sans); /* same family as rest of site */
      font-style: normal;
      font-weight: 950;
      letter-spacing:.02em;
      font-size:13px;
      white-space:nowrap;
      max-width: 100%;
      overflow:hidden;
      text-overflow:ellipsis;
      display:inline-flex;
      align-items:center;
      text-shadow: 0 2px 10px rgba(15,23,42,0.25);
    }
    .prod-title-line{
      flex:1; height:2px; background: var(--line-grad);
      border-radius:999px; transform: translateY(2px);
      opacity:.65; min-width: 18px;
    }

    .pimg{ background:#fff; border-bottom: var(--thin-outline); }
    .pimg img{ width:100%; height:var(--cardImgH); object-fit:cover; display:block; cursor:pointer; }

    .pbot{ padding:8px; flex:1 1 auto; display:flex; background: var(--para-green); }
    .click-inner{
      width:100%;
      display:grid;
      grid-template-columns: 1fr 1fr;
      grid-auto-rows: min-content;
      column-gap:10px;
      row-gap:6px;
      align-content:start;
    }

    .price-inline{
      grid-column: 1;
      height:26px;
      display:flex; align-items:center; justify-content:flex-start;
      color:#0b1220;
      font-weight:1000;
      font-size:13px;
      text-decoration: underline;
      text-underline-offset:2px;
      white-space:nowrap;
      padding-left:2px;
    }

    .variant-box{
      grid-column: 2;
      justify-self:end;
      height:26px;
      border: var(--thin-outline);
      background: rgba(255,255,255,0.55);
      border-radius:14px;
      padding:0 10px;
      display:flex;
      align-items:center;
      gap:10px;
      cursor:pointer;
      user-select:none;
      min-width: 160px;
      max-width: 230px;
      justify-content:space-between;
    }
    .variant-left{
      font-weight:950;
      letter-spacing:.10em;
      text-transform:uppercase;
      font-size:10px;
      color:#0b1220;
      white-space:nowrap;
    }
    .variant-value{
      font-weight:1000;
      font-size:11px;
      color:#0b1220;
      white-space:nowrap;
    }
    .variant-right{ display:flex; align-items:center; gap:8px; white-space:nowrap; }
    .variant-caret{ width:14px; height:14px; stroke:#0b1220; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; opacity:.9; }

    .addq{
      grid-column: 1;
      height:32px;
      border-radius:14px;
      border: var(--thin-outline);
      background: var(--metal-orange);
      color:#ffffff;
      font-weight:950;
      letter-spacing:.10em;
      text-transform:uppercase;
      font-size:10px;
      cursor:pointer;
      display:flex; align-items:center; justify-content:center;

      function openVariantMenu(anchorEl, options, activeKey, onPick){
        closeMenu();
        const r = anchorEl.getBoundingClientRect();
        const menu = document.createElement("div");
        menu.className = "variant-menu";
        menu.style.pointerEvents = "auto";

        const left = Math.min(window.innerWidth - 210, Math.max(10, Math.round(r.left)));
        const top = Math.min(window.innerHeight - 10, Math.round(r.bottom + 6));
        menu.style.left = left + "px";
        menu.style.top = top + "px";

        options.forEach(opt=>{
          const row = document.createElement("div");
          row.className = "opt" + (opt.key === activeKey ? " is-active" : "");
          row.textContent = opt.label;
          row.addEventListener("click", ()=>{ onPick(opt.key); closeMenu(); });
          menu.appendChild(row);
        });

        root.appendChild(menu);
        openMenu = { el: menu };
      }

      document.addEventListener("click", (e)=>{
        if(openMenu){
          const within = e.target.closest(".variant-menu");
          const anchor = e.target.closest("[data-variant-anchor]");
          if(!within && !anchor) closeMenu();
        }
      });
      document.addEventListener("keydown",(e)=>{ if(e.key==="Escape") closeMenu(); });

      window.__openVariantMenu = openVariantMenu;

      const overlay = document.getElementById("desc-overlay");
      const closeBtn = document.getElementById("modal-close");
      function openModal(title, imgSrc, text){
        document.body.classList.add("modal-open");
        overlay.setAttribute("aria-hidden","false");
        document.getElementById("modal-title").textContent = title || "Product";
        const mimg = document.getElementById("modal-img");
        mimg.src = imgSrc || "";
        mimg.alt = title || "Product image";
        document.getElementById("modal-copy").textContent = text || "";
      }
      function closeModal(){
        document.body.classList.remove("modal-open");
        overlay.setAttribute("aria-hidden","true");
      }
      closeBtn?.addEventListener("click", closeModal);
      overlay?.addEventListener("click", (e)=>{ if(e.target && e.target.id === "desc-overlay") closeModal(); });
      document.addEventListener("keydown",(e)=>{ if(e.key==="Escape") closeModal(); });
      window.__openDescModal = openModal;
    })();

    /* category jump */
    (function(){
      document.querySelectorAll("[data-jump]").forEach(b=>{
        b.addEventListener("click", ()=>{
          const id = b.getAttribute("data-jump");
          const el = id ? document.querySelector(id) : null;
          if(el) el.scrollIntoView({ behavior:"smooth", block:"start" });
        });
      });
    })();

    /* Store rendering */
    (function(){
      const PRODUCTS = [
        {
          id:"powder",
          cat:"powder",
          title:"MayaNut Powder",
          img:"mayanut-powder-maya-nut-brosimum-alicastrum.png",
          inStock:false,
          desc:"Concept preview: roasted and ground MayaNut (maya nut) powder from Brosimum alicastrum. Select a weight to see the preview price.",
          tagline:"Flavorful powder, great for acai bowls",
          variant:{ label:"WEIGHT", defaultKey:"qtr", options:[
            { key:"qtr", label:"1/4 lb", price:9.95 },
            { key:"half", label:"1/2 lb", price:18.95 },
            { key:"one", label:"1 lb", price:35.95 }
          ]}
        },
        {
          id:"pods",
          cat:"powder",
          title:"Instant MayaNut Pods",
          img:"mayanut-powder-maya-nut-brosimum-alicastrum.png",
          inStock:false,
          desc:"Concept preview: instant MayaNut pods for single-serve brewing. Select an amount to see the preview price.",
          tagline:"Enjoy a delicious beverage... NOW!",
          variant:{ label:"AMOUNT", defaultKey:"p25", options:[
            { key:"p25", label:"25", price:29.95 },
            { key:"p50", label:"50", price:49.95 },
            { key:"p100", label:"100", price:89.95 }
          ]}
        },
        { id:"hat",    cat:"merch",  title:"MayaNut Hat",     price:15.00, img:"mayanut-merch-hat-brosimum-alicastrum.png", inStock:false, desc:"Lookin' good, support us in style!", tagline:"" },
        { id:"shirt",  cat:"merch",  title:"MayaNut T-Shirt", price:18.00, img:"mayanut-merch-shirt-brosimum-alicastrum.png", inStock:false, desc:"MayaNut T-shirt for MayaNut lovers!", tagline:"", variant:{ label:"SIZE", defaultKey:"m", options:[
          { key:"s", label:"Small", price:18.00 }, { key:"m", label:"Medium", price:18.00 }, { key:"l", label:"Large", price:18.00 }, { key:"xl", label:"XL", price:18.00 }
        ]}},
        { id:"hoodie", cat:"merch",  title:"MayaNut Hoodie",  price:30.00, img:"mayanut-merch-hoodie-brosimum-alicastrum.png", inStock:false, desc:"Stay warm like our trees!", tagline:"", variant:{ label:"SIZE", defaultKey:"m", options:[
          { key:"s", label:"Small", price:30.00 }, { key:"m", label:"Medium", price:30.00 }, { key:"l", label:"Large", price:30.00 }, { key:"xl", label:"XL", price:30.00 }
        ]}},
        { id:"seedling", cat:"plants", title:"MayaNut Seedling", price:34.95, img:"maya-nut-mayanut-plant-tree-nursery.jpg", inStock:false, desc:"Seedlings will be shipped bareroot.", tagline:"", variant:{ label:"SIZE", defaultKey:"1gl", options:[
          { key:"1gl", label:"1 GL", price:34.95 }
        ]}},
        { id:"seeds", cat:"plants", title:"MayaNut Seeds", price:9.95, img:"maya-nut-mayanut-fruit-brosimum-alicastrum.jpg", inStock:false, desc:"Seeds are water tested for improved viability.", tagline:"", variant:{ label:"AMOUNT", defaultKey:"10pc", options:[
          { key:"10pc", label:"10 pc", price:9.95 }
        ]}}
      ];

      const grids = {
        powder: document.getElementById("grid-powder"),
        merch:  document.getElementById("grid-merch"),
        plants: document.getElementById("grid-plants")
      };

      const badge = document.getElementById("cart-badge");
      let cartCount = 0;
      const setBadge = ()=> { if(badge) badge.textContent = String(cartCount); };

      const money = (n)=> Number(n||0).toLocaleString(undefined,{style:"currency",currency:"USD"});
      const norm = (s)=> String(s||"").toLowerCase().trim();

      function getVariantPrice(p, key){
        const v = p.variant?.options?.find(o=>o.key===key) || p.variant?.options?.[0];
        return v ? v.price : (p.price || 0);
      }
      function getVariantLabel(p, key){
        const v = p.variant?.options?.find(o=>o.key===key) || p.variant?.options?.[0];
        return v ? v.label : "";
      }

      function cardHTML(p){
        const hasVariant = !!p.variant;
        const defaultKey = hasVariant ? p.variant.defaultKey : null;
        const basePrice = hasVariant ? getVariantPrice(p, defaultKey) : (p.price || 0);
        const variantLabel = hasVariant ? getVariantLabel(p, defaultKey) : "";

        const safeDesc = (p.desc || "").replace(/"/g,"&quot;");
        const safeTag = (p.tagline || "").replace(/"/g,"&quot;");

        return `
          <div class="product-shell" data-shell data-id="${p.id}" data-cat="${p.cat}" data-title="${p.title}"
               data-price="${basePrice}" data-stock="${p.inStock ? "1":"0"}" data-img="${p.img}" data-desc="${safeDesc}"
               ${hasVariant ? `data-variant-key="${defaultKey}"` : ""}>
            <article class="product-inner">
              <div class="prod-head">
                <span class="prod-title-pill">${p.title}</span>
                <span class="prod-title-line" aria-hidden="true"></span>
              </div>

              <div class="pimg">
                <img src="${p.img}" alt="${p.title}" loading="lazy" decoding="async" data-open-desc />
              </div>

              <div class="pbot">
                <div class="click-inner">
                  <div class="price-inline" data-price>${money(basePrice)}</div>

                  ${hasVariant ? `
                    <div class="variant-box" data-variant-anchor data-variant="${p.id}">
                      <div class="variant-left">${p.variant.label}</div>
                      <div class="variant-right">
                        <div class="variant-value" data-variant-value>${variantLabel}</div>
                        <svg class="variant-caret" viewBox="0 0 24 24" aria-hidden="true">
                          <path d="M6 9l6 6 6-6"></path>
                        </svg>
                      </div>
                    </div>
                  ` : `<div></div>`}

                  <button class="addq" type="button" data-add>ADD</button>

                  <div class="qty-h" aria-label="Quantity">
                    <button class="qty-minus" type="button" aria-label="Decrease">−</button>
                    <div class="qty-mid">
                      <input class="qty-number" type="number" min="1" max="99" step="1" value="1" inputmode="numeric" aria-label="Quantity value" />
                    </div>
                    <button class="qty-plus" type="button" aria-label="Increase">+</button>
                  </div>

                  ${safeTag ? `<div class="tagline">${safeTag}</div>` : `<div class="tagline" style="opacity:0">.</div>`}
                </div>
              </div>
            </article>
          </div>
        `;
      }

      const state = { sort:"newest", stockOnly:false, q:"" };

      function compareFn(sort){
        if(sort==="az") return (a,b)=> a.title.localeCompare(b.title);
        if(sort==="za") return (a,b)=> b.title.localeCompare(a.title);
        if(sort==="price_low") return (a,b)=> (a._priceSort||0) - (b._priceSort||0);
        if(sort==="price_high") return (a,b)=> (b._priceSort||0) - (a._priceSort||0);
        return (a,b)=> PRODUCTS.findIndex(x=>x.id===a.id) - PRODUCTS.findIndex(x=>x.id===b.id);
      }

      function wireQtyButtons(){
        const clamp = (n)=> Math.max(1, Math.min(99, n));
        const setQty = (input, v)=> { input.value = String(clamp(parseInt(v,10)||1)); };

        document.querySelectorAll(".product-shell").forEach(shell=>{
          const qty = shell.querySelector(".qty-number");
          const plus = shell.querySelector(".qty-plus");
          const minus = shell.querySelector(".qty-minus");
          if(!qty || !plus || !minus) return;

          setQty(qty, qty.value);
          qty.addEventListener("input", ()=> setQty(qty, qty.value));
          qty.addEventListener("blur", ()=> setQty(qty, qty.value));

          plus.addEventListener("click", ()=> setQty(qty, (parseInt(qty.value,10)||1)+1));
          minus.addEventListener("click", ()=> setQty(qty, (parseInt(qty.value,10)||1)-1));
        });
      }

      function wireAddButtons(){
        document.querySelectorAll(".product-shell [data-add]").forEach(add=>{
          add.addEventListener("click", ()=>{
            const shell = add.closest(".product-shell");
            const qtyEl = shell?.querySelector(".qty-number");
            const q = Math.max(1, Math.min(99, parseInt(qtyEl?.value || "1",10) || 1));
            cartCount += q;
            setBadge();
          });
        });
      }

      function wireVariants(){
        document.querySelectorAll(".variant-box").forEach(box=>{
          const pid = box.getAttribute("data-variant");
          const p = PRODUCTS.find(x=>x.id===pid);
          if(!p || !p.variant) return;

          box.addEventListener("click", (e)=>{
            e.stopPropagation();
            const shell = box.closest(".product-shell");
            const activeKey = shell?.getAttribute("data-variant-key") || p.variant.defaultKey;

            window.__openVariantMenu?.(
              box,
              p.variant.options.map(o=>({ key:o.key, label:o.label })),
              activeKey,
              (newKey)=>{
                if(!shell) return;
                shell.setAttribute("data-variant-key", newKey);

                const newPrice = getVariantPrice(p, newKey);
                shell.setAttribute("data-price", String(newPrice));

                const priceEl = shell.querySelector("[data-price]");
                if(priceEl) priceEl.textContent = money(newPrice);

                const valEl = shell.querySelector("[data-variant-value]");
                if(valEl) valEl.textContent = getVariantLabel(p, newKey);
              }
            );
          });
        });
      }

      function wireImageDesc(){
        document.addEventListener("click", (e)=>{
          const img = e.target?.closest?.("[data-open-desc]");
          if(!img) return;
          const shell = img.closest(".product-shell");
          if(!shell) return;

          const title = shell.getAttribute("data-title") || "Product";
          const imgSrc = shell.getAttribute("data-img") || img.getAttribute("src") || "";
          const desc = shell.getAttribute("data-desc") || "";

          const vid = shell.getAttribute("data-id");
          const p = PRODUCTS.find(x=>x.id===vid);
          let extra = "";
          if(p?.variant){
            const key = shell.getAttribute("data-variant-key") || p.variant.defaultKey;
            const vLabel = getVariantLabel(p, key);
            const vPrice = getVariantPrice(p, key);
            extra = `\n\nSelected ${p.variant.label.toLowerCase()}: ${vLabel}\nPreview price: ${money(vPrice)}`;
          }else{
            extra = `\n\nPreview price: ${money(parseFloat(shell.getAttribute("data-price")||"0")||0)}`;
          }

          window.__openDescModal?.(title, imgSrc, (desc || "Product details are conceptual while the store is under development.") + extra);
        });
      }

      function apply(){
        const q = norm(state.q);

        const listByCat = { powder:[], merch:[], plants:[] };
        PRODUCTS.forEach(p=>{
          let priceForSort = p.price || 0;
          if(p.variant) priceForSort = getVariantPrice(p, p.variant.defaultKey);
          const clone = { ...p, _priceSort: priceForSort };
          listByCat[p.cat].push(clone);
        });

        for(const k of ["powder","merch","plants"]){
          let list = listByCat[k];
          if(state.stockOnly) list = list.filter(p=>p.inStock);
          if(q) list = list.filter(p=> norm(p.title).includes(q));
          list = list.slice().sort(compareFn(state.sort));
          grids[k].innerHTML = list.map(cardHTML).join("");
        }

        wireQtyButtons();
        wireAddButtons();
        wireVariants();
      }

      function bindDesktopFilters(){
        document.querySelectorAll('input[name="sortmode"]').forEach(r=>{
          r.addEventListener("change", ()=>{ state.sort = r.value; apply(); });
        });
        const stock = document.getElementById("in-stock-only");
        stock?.addEventListener("change", ()=>{ state.stockOnly = !!stock.checked; apply(); });
      }

      function bindSearch(){
        const s = document.getElementById("store-search");
        const sc = document.getElementById("store-search-clear");
        s?.addEventListener("input", ()=>{ state.q = s.value; apply(); });
        sc?.addEventListener("click", ()=>{ if(!s) return; s.value=""; state.q=""; apply(); s.focus(); });
      }

      setBadge();
      apply();
      bindDesktopFilters();
      bindSearch();
      wireImageDesc();
      wireVariants();
    })();
  </script>
</body>
</html>
