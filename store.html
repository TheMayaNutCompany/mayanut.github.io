<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Store | The MayaNut Company</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fauna+One&family=Acme&family=DM+Serif+Display&display=swap" rel="stylesheet">

<style>
:root{
  --green-main:#066100;
  --green-pale:#e9ffd6;
  --orange-main:#fd6c02;
  --orange-dark:#e05f00;
  --text-dark:#0b1220;
}

/* ===== Base ===== */
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Acme,system-ui,sans-serif;
  background:#fff;
  color:var(--text-dark);
}
a{text-decoration:none;color:inherit}

/* ===== Top thin banner ===== */
.top-banner{
  height:14px;
  background:var(--green-main);
}

/* ===== Header ===== */
.header{
  background:var(--green-main);
  position:sticky;
  top:0;
  z-index:100;
}
.header-inner{
  position:relative;
  padding:20px 16px 48px;
  text-align:center;
}
.brand{
  font-family:"DM Serif Display",serif;
  font-size:34px;
  color:#fff;
}

/* ===== Mobile controls ===== */
.mobile-controls{
  display:none;
}
.mobile-controls a{
  color:#fff;
  font-weight:900;
}

/* ===== Desktop controls ===== */
.desktop-controls{
  position:absolute;
  top:18px;
  left:16px;
  right:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.desktop-controls a{
  color:#fff;
  font-weight:900;
}

/* ===== Store bar ===== */
.store-bar{
  background:var(--green-main);
  padding:12px 16px;
  display:flex;
  gap:16px;
  align-items:center;
}
.search{
  flex:1;
  background:#fff;
  border-radius:14px;
  display:flex;
  align-items:center;
  padding:0 10px;
}
.search input{
  border:none;
  outline:none;
  flex:1;
  font-size:13px;
}
.checkout-btn{
  background:var(--orange-main);
  color:#fff;
  border:none;
  border-radius:14px;
  padding:8px 14px;
  font-weight:900;
  cursor:pointer;
}
.checkout-btn:hover{background:var(--orange-dark)}

/* ===== Layout ===== */
.main{
  max-width:1200px;
  margin:auto;
  padding:16px;
}
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:14px;
}

/* ===== Product card ===== */
.card{
  border-radius:16px;
  overflow:hidden;
  border:1px solid rgba(0,0,0,.08);
  background:#fff;
}
.card-top{
  background:var(--green-pale);
  padding:10px;
  font-weight:900;
}
.card-img img{
  width:100%;
  height:200px;
  object-fit:cover;
}
.card-bottom{
  background:var(--green-pale);
  padding:10px;
}
.price{
  font-weight:900;
  color:#000;
}
.controls{
  display:flex;
  gap:8px;
  margin-top:8px;
}
.qty{
  display:flex;
  border-radius:12px;
  overflow:hidden;
}
.qty button{
  background:var(--orange-main);
  color:#fff;
  border:none;
  width:32px;
  cursor:pointer;
}
.qty span{
  background:var(--orange-dark);
  color:#fff;
  padding:0 10px;
  display:flex;
  align-items:center;
}
.add{
  flex:1;
  background:var(--orange-main);
  border:none;
  border-radius:12px;
  color:#fff;
  font-weight:900;
  cursor:pointer;
}
.add:hover{background:var(--orange-dark)}

/* ===== Cart Drawer ===== */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.25);
  display:none;
  z-index:200;
}
.cart{
  position:fixed;
  top:0;
  right:0;
  width:33%;
  height:100%;
  background:#fff;
  box-shadow:-10px 0 30px rgba(0,0,0,.25);
  transform:translateX(100%);
  transition:.3s;
  z-index:300;
  display:flex;
  flex-direction:column;
}
.cart.open{transform:translateX(0)}
.overlay.show{display:block}

.cart-header{
  padding:16px;
  font-weight:900;
}
.cart-items{
  flex:1;
  padding:16px;
}
.cart-footer{
  padding:16px;
}
.cart-footer hr{
  border:none;
  height:2px;
  background:var(--green-main);
  margin-bottom:10px;
}
.cart-footer button{
  width:100%;
  background:var(--orange-main);
  border:none;
  padding:10px;
  color:#fff;
  font-weight:900;
}

/* ===== Mobile ===== */
@media(max-width:800px){
  .desktop-controls{display:none}
  .mobile-controls{
    display:flex;
    justify-content:space-between;
    padding:8px 16px;
    background:var(--green-main);
  }
  .cart{width:100%}
}
</style>
</head>

<body>

<div class="top-banner"></div>

<div class="header">
  <div class="mobile-controls">
    <a href="mailto:info@mayanut.com">EMAIL</a>
    <a href="#">ESPAÑOL</a>
  </div>

  <div class="header-inner">
    <div class="desktop-controls">
      <a href="mailto:info@mayanut.com">EMAIL</a>
      <a href="#">ESPAÑOL</a>
    </div>
    <div class="brand">The MayaNut Company</div>
  </div>

  <div class="store-bar">
    <div class="search">
      🔍 <input placeholder="Search MayaNut Store..." />
    </div>
    <button class="checkout-btn" id="openCart">CHECKOUT</button>
  </div>
</div>

<div class="main">
  <div class="products">
    <div class="card">
      <div class="card-top">MayaNut Powder</div>
      <div class="card-img"><img src="mayanut-powder-maya-nut-brosimum-alicastrum.png"></div>
      <div class="card-bottom">
        <div class="price">$9.95</div>
        <div class="controls">
          <div class="qty">
            <button>-</button><span>1</span><button>+</button>
          </div>
          <button class="add">ADD</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"></div>

<div class="cart" id="cart">
  <div class="cart-header">Your Cart</div>
  <div class="cart-items">Items will appear here.</div>
  <div class="cart-footer">
    <hr>
    <button>This function is currently unavailable</button>
  </div>
</div>

<script>
const cart=document.getElementById("cart");
const overlay=document.getElementById("overlay");
document.getElementById("openCart").onclick=()=>{
  cart.classList.add("open");
  overlay.classList.add("show");
};
overlay.onclick=()=>{
  cart.classList.remove("open");
  overlay.classList.remove("show");
};
</script>

</body>
</html>
