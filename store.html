<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="x-ua-compatible" content="ie=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>MayaNut Store | The MayaNut Company</title>

  <!-- SEO -->
  <meta name="description" content="Shop MayaNut food products, merch, and plants from The MayaNut Company. Concept preview store supporting the development of America’s first MayaNut farm in South Florida and ongoing cultivation research on Brosimum alicastrum." />
  <meta name="keywords" content="MayaNut store,Mayanut store,Brosimum alicastrum,MayaNut powder,MayaNut pods,MayaNut seeds,MayaNut seedlings,MayaNut merch,MayaNut t-shirt,MayaNut hoodie,MayaNut hat,South Florida farm,The MayaNut Company" />
  <link rel="canonical" href="https://mayanut.com/store.html" />
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />

  <link rel="icon" type="image/png" href="mayanut-the-mayanut-comapny-logo.png" />
  <link rel="apple-touch-icon" href="mayanut-the-mayanut-comapny-logo.png" />
  <meta name="theme-color" content="#1a6800" />
  <meta name="format-detection" content="telephone=no" />

  <!-- Preload -->
  <link rel="preload" as="image" href="menuart-the-maya-nut-company-art.jpeg" />
  <link rel="preload" as="image" href="mayanut-the-mayanut-comapny-logo.png" />
  <link rel="preload" as="image" href="mayanuts-the-maya-nut-company-image.webp" />

  <style>
    :root{
      --green:#1a6800;
      --green-deep:#0b3b17;

      --tan:#f3e6d1;

      --orange:#fd6c02;
      --orange-dark:#e95f02;
      --orange-mid:#ff7a1a;
      --orange-hi:#ffd2a8;

      --lime:#d8ff6a;
      --cream:#ffffc5;

      --shadow: 0 18px 55px rgba(15,23,42,0.18);

      --sideW: 170px;
      --frameBorder: 2px;

      /* “dark green slight gradient” */
      --dark-tab-grad: linear-gradient(180deg, #0b3b17 0%, #1a6800 55%, #0b3b17 100%);

      /* top sticky bar */
      --panel-green-grad: linear-gradient(
        90deg,
        #0b3b17 0%,
        #2a8b2f 22%,
        #7fe06e 50%,
        #2a8b2f 78%,
        #0b3b17 100%
      );

      /* lime -> dark green (for sort/store backgrounds + outlines) */
      --lime-dark-grad: linear-gradient(180deg, #d8ff6a 0%, #2a8b2f 45%, #0b3b17 100%);

      /* orange outline (single ring) */
      --metal-orange: linear-gradient(
        180deg,
        var(--orange-hi) 0%,
        var(--orange-mid) 18%,
        var(--orange) 48%,
        var(--orange-dark) 72%,
        var(--orange-mid) 100%
      );

      --line-grad: linear-gradient(90deg, #d8ff6a 0%, #0b3b17 100%);

      /* paragraph background green */
      --para-green-bg: linear-gradient(
        180deg,
        rgba(233,255,214,0.98) 0%,
        rgba(201,245,165,0.92) 55%,
        rgba(179,232,135,0.96) 100%
      );

      --mobile-green-grad: linear-gradient(180deg, #b7ff3f 0%, #2a8b2f 45%, #0b3b17 100%);

      --font-pretty: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;

      --stickyOffset: 170px;
      --bannerH: 24px;
      --navH: 84px;

      /* tighter cards */
      --cardImgH: 132px;
      --cardMinH: 308px;
      --btnH: 34px;

      /* thicknesses */
      --outerPad: 6px;         /* orange outline thickness */
      --productPad: 6px;       /* orange per-product outline thickness */
      --clickablePad: 3px;     /* lime->dark outline around clickables */

      /* left tab width = store header height vibe (matches ~grid-head height visually) */
      --catTabW: 64px;
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
    html{ background: var(--tan); overflow-x:hidden; scroll-padding-top: calc(var(--stickyOffset) + 12px); }
    body{
      font-family: var(--font-sans);
      color:#0f172a;
      background: var(--tan);
      -webkit-font-smoothing: antialiased;
      overflow-x:hidden;
      overscroll-behavior-y:none;
    }
    img{ max-width:100%; height:auto; display:block; }
    a{ color:inherit; text-decoration:none; }
    button,input,select{ font-family:inherit; }

    /* SIDE FRAMES */
    .side-frames{ position:fixed; inset:0; pointer-events:none; z-index:0; }
    .side{ position:absolute; top:0; bottom:0; width:var(--sideW); overflow:hidden; background:#ffffff; pointer-events:none; }
    .side.left{ left:0; border-right: var(--frameBorder) solid rgba(12,90,42,0.95); }
    .side.right{ right:0; border-left: var(--frameBorder) solid rgba(12,90,42,0.95); }
    .stack{ position:absolute; inset:0; display:flex; flex-direction:column; }
    .stack img{ width:100%; height:220px; flex:0 0 220px; object-fit:cover; border-bottom:1px solid rgba(15,23,42,0.10); filter:saturate(1.07) contrast(1.03); }

    /* WRAP + TOP */
    .frame-wrap{
      position:relative;
      z-index:2;
      width: calc(100vw - (var(--sideW) * 2));
      margin-left: var(--sideW);
      margin-right: var(--sideW);
      min-height:100vh;
      padding-top: var(--stickyOffset);
      overflow-x: clip;
    }

    .sticky-top{
      position:fixed;
      top:0;
      left: var(--sideW);
      right: var(--sideW);
      z-index:999;
      background: var(--panel-green-grad);
      border-left: var(--frameBorder) solid rgba(12,90,42,0.95);
      border-right: var(--frameBorder) solid rgba(12,90,42,0.95);
      border-top: 2px solid var(--green);
      border-bottom: 2px solid var(--green);
      box-shadow:0 10px 28px rgba(15,23,42,0.12);
      overflow:hidden;
    }

    .top-banner{
      min-height: var(--bannerH);
      display:flex; align-items:center; justify-content:center;
      gap:10px; padding: 3px 12px;
      background: rgba(255,255,255,0.14);
      border-bottom: 2px solid rgba(12,90,42,0.35);
    }
    .top-banner .flag{ width:24px; height:auto; filter: drop-shadow(0 2px 6px rgba(15,23,42,0.18)); }
    .top-banner .txt{
      font-weight:950; letter-spacing:0.14em; text-transform:uppercase; font-size:12px; color:#0b1220;
      text-shadow:0 1px 0 rgba(255,255,255,0.35);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      max-width: min(980px, calc(100% - 120px));
    }

    .site-header{
      width:100%;
      background-image:url("menuart-the-maya-nut-company-art.jpeg");
      background-size:cover; background-position:center center; background-repeat:no-repeat;
      padding: 18px 14px 22px;
      display:flex; align-items:center; justify-content:center;
      position:relative; min-height: var(--navH);
    }
    .site-header::after{
      content:""; position:absolute; inset:0;
      background: linear-gradient(to bottom, rgba(255,255,255,0.06), rgba(255,255,255,0.0) 55%);
      pointer-events:none;
    }

    .main-nav{
      width:100%; max-width:1120px;
      display:flex; align-items:center; justify-content:center;
      gap:12px; padding:0 8px;
      position:relative; z-index:1; min-height:56px;
    }

    /* Header search upper-left */
    .nav-search{ position:absolute; left:8px; top:0; height:56px; display:flex; align-items:center; width:42px; z-index:2; }
    .nav-search-btn{
      width:42px; height:40px; border-radius:14px;
      border:1px solid rgba(12,90,42,.85);
      background: var(--mobile-green-grad);
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; box-shadow: 0 10px 22px rgba(15,23,42,0.10);
    }
    .nav-search-btn svg{ width:18px; height:18px; stroke:var(--cream); fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
    .nav-search-box{
      position:absolute; left:48px; top:8px;
      width:0; opacity:0; pointer-events:none;
      height:40px; border-radius:14px;
      border:1px solid rgba(12,90,42,.85);
      background:#fff; box-shadow:0 10px 22px rgba(15,23,42,0.10);
      overflow:hidden; display:flex; align-items:center;
      transition: width .18s ease, opacity .12s ease;
      z-index:1200;
    }
    body.site-search-open .nav-search-box{ width: min(320px, 56vw); opacity:1; pointer-events:auto; }
    .nav-search-input{ height:40px; width:100%; border:none; outline:none; background:transparent; color:#0b1220; font-weight:950; font-size:12px; letter-spacing:.04em; padding:0 12px; }
    .nav-search-clear{ width:40px; height:40px; border:none; background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; border-left:1px solid rgba(12,90,42,.25); }
    .nav-search-clear svg{ width:18px; height:18px; stroke:#0b1220; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }

    .nav-center{ display:flex; align-items:center; justify-content:center; gap:12px; width:100%; padding-left:66px; padding-right:140px; }
    .nav-pill{
      height:40px; padding:0 12px; border-radius:14px;
      border:1px solid var(--cream);
      background: var(--mobile-green-grad);
      display:inline-flex; align-items:center; justify-content:center;
      box-shadow: 0 10px 22px rgba(15,23,42,0.10);
      transition: transform .12s ease;
    }
    .nav-pill:hover{ transform: translateY(-1px) scale(1.02); }
    .nav-pill span{ font-size:12px; letter-spacing:0.20em; text-transform:uppercase; font-weight:950; color:var(--cream); text-shadow:0 1px 0 rgba(0,0,0,0.18); white-space:nowrap; }
    .nav-pill.is-active{ background: var(--metal-orange); }

    .nav-right{ position:absolute; right:8px; top:0; height:56px; display:flex; align-items:center; justify-content:flex-end; z-index:2; }
    .lang-pill{
      height:40px; padding:0 14px; border-radius:14px;
      border:1px solid var(--cream);
      background: var(--mobile-green-grad);
      color:var(--cream);
      font-weight:950; letter-spacing:0.14em; text-transform:uppercase; font-size:12px;
      box-shadow: 0 10px 22px rgba(15,23,42,0.12);
      display:inline-flex; align-items:center; justify-content:center;
    }

    /* MAIN */
    main{
      border-left: var(--frameBorder) solid rgba(12,90,42,0.95);
      border-right: var(--frameBorder) solid rgba(12,90,42,0.95);
      box-shadow: var(--shadow);
      background: transparent;
      min-height: calc(100vh - var(--stickyOffset));
      overflow:hidden;
    }
    .content-wrapper{ padding: 0 18px 0; max-width:1400px; margin:0 auto; }

    .store-layout{ display:grid; grid-template-columns: 220px 1fr; gap:14px; align-items:start; }

    /* SORT: single outline (lime->dark), no orange here */
    .left-shell{ position: sticky; top: var(--stickyOffset); align-self:start; }
    .left-outer{
      border-radius:18px;
      background: var(--lime-dark-grad);
      padding: var(--outerPad);
      box-shadow:0 14px 40px rgba(15,23,42,0.12);
    }
    .left-panel{
      border-radius:14px;
      background: var(--lime-dark-grad);
      overflow:hidden;
    }
    .left-head{
      background: var(--dark-tab-grad);
      padding:10px 12px;
      font-family: var(--font-pretty);
      font-style: italic;
      font-weight:900;
      letter-spacing:.14em;
      text-transform:uppercase;
      font-size:13px;
      color: var(--lime);
      display:flex;
      align-items:center;
      gap:10px;
      border-bottom:2px solid rgba(216,255,106,0.22);
    }
    .left-head .line{ height:2px; background: var(--line-grad); border-radius:999px; flex:1; transform: translateY(2px); }
    .left-body{ padding:12px; display:flex; flex-direction:column; gap:10px; background: rgba(255,255,255,0.08); }

    .filter-shell{ border-radius:16px; background: rgba(255,255,255,0.12); padding:6px; }
    .filter-group{ border-radius:12px; background: var(--para-green-bg); padding:10px; }
    .filter-title{
      font-family: var(--font-pretty); font-style: italic; font-weight:900;
      letter-spacing:.10em; text-transform:uppercase; font-size:12px; color:#0b1220;
      margin-bottom:8px; display:flex; align-items:center; gap:10px;
    }
    .filter-title::after{ content:""; flex:1; height:2px; background: var(--line-grad); border-radius:999px; transform: translateY(2px); }
    .filter-item{ display:flex; align-items:center; gap:10px; padding:6px 0; font-weight:900; font-size:12px; color:#0b1220; }
    .filter-item input{ accent-color: #1a6800; }

    /* STORE: background lime->dark, keep outer outline lime->dark (NOT orange) */
    .grid-outer{
      border-radius:18px;
      background: var(--lime-dark-grad);
      padding: var(--outerPad);
      box-shadow:0 14px 40px rgba(15,23,42,0.12);
      overflow:hidden;
    }
    .grid-wrap{
      border-radius:14px;
      overflow:hidden;
      background: var(--lime-dark-grad);
    }
    .grid-head{
      background: var(--dark-tab-grad);
      padding:10px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      border-bottom:2px solid rgba(12,90,42,0.25);
    }

    .store-brand{ display:flex; align-items:center; gap:10px; min-width:0; flex:1 1 auto; }
    .store-logo{ width:44px; height:44px; filter: drop-shadow(0 10px 18px rgba(15,23,42,0.18)); flex:0 0 auto; }
    .grid-title{
      font-family: var(--font-pretty); font-style: italic; font-weight: 900;
      letter-spacing:.12em; text-transform:uppercase; font-size:16px; color: var(--lime);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:320px;
      text-shadow:0 1px 0 rgba(0,0,0,0.22);
    }
    .title-line{ height:2px; background: var(--line-grad); border-radius:999px; margin-left:12px; margin-right:12px; flex:1 1 auto; max-width:260px; transform: translateY(2px); opacity:.95; }

    .grid-tools{ display:flex; align-items:center; justify-content:flex-end; gap:10px; flex:0 0 auto; }
    .store-search{
      height:40px; border-radius:14px; border:2px solid rgba(12,90,42,.55);
      background:#fff; display:flex; align-items:center; overflow:hidden;
      width:min(260px, 30vw); box-shadow:0 10px 20px rgba(15,23,42,0.10); min-width:180px;
    }
    .store-search .mag, .store-search .xbtn{ width:40px; height:40px; display:flex; align-items:center; justify-content:center; flex:0 0 40px; cursor:pointer; user-select:none; }
    .store-search .xbtn{ border-left:none; background:transparent; }
    .store-search .mag svg, .store-search .xbtn svg{ width:16px; height:16px; stroke:var(--orange); fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
    .store-search input{ border:none; outline:none; background:transparent; color:#0b1220; font-weight:950; letter-spacing:.02em; font-size:11px; padding:0 10px; width:100%; min-width:0; caret-color:var(--orange); }

    /* cart pack */
    .cart-pack{
      display:flex; align-items:center; gap:10px;
      height:40px; padding:0 10px;
      border-radius:14px;
      background: rgba(0,0,0,0.18);
      border:2px solid rgba(216,255,106,0.30);
      box-shadow:0 10px 20px rgba(15,23,42,0.10);
      overflow:hidden;
    }
    .cart-left{ display:flex; align-items:center; gap:2px; }
    .dust{ display:flex; flex-direction:column; gap:3px; align-items:flex-end; justify-content:center; width:14px; flex:0 0 14px; margin-right:2px; }
    .dust i{ display:block; height:2px; border-radius:999px; background: var(--lime); filter: drop-shadow(0 2px 4px rgba(15,23,42,0.18)); }
    .dust i:nth-child(1){ width:7px; opacity:.80; }
    .dust i:nth-child(2){ width:14px; opacity:.95; }
    .dust i:nth-child(3){ width:10px; opacity:.88; }
    .cart-btn{ width:42px; height:40px; border:none; background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .cart-btn svg{ width:18px; height:18px; stroke: var(--lime); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .checkout-btn{
      height:40px; padding:0 12px; border-radius:12px;
      border:2px solid rgba(216,255,106,0.75);
      background: transparent;
      color: var(--lime);
      font-weight:950; letter-spacing:.10em; text-transform:uppercase; font-size:10px;
      cursor:pointer;
      display:inline-flex; align-items:center; justify-content:center;
      white-space:nowrap;
      text-shadow:0 1px 0 rgba(0,0,0,0.18);
    }

    /* BODY */
    .grid-body{ padding:0; }
    .store-body-wrap{ display:flex; align-items:stretch; gap:0; }

    /* left tab width == top tab height vibe */
    .cat-tab{
      width: var(--catTabW);
      background: var(--dark-tab-grad);
      border-right:2px solid rgba(12,90,42,0.25);
      display:grid;
      grid-template-rows: 1fr 1fr 1fr;
      padding:0;
      flex:0 0 var(--catTabW);
    }
    .cat-btn{ border:none; background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; transition: background .12s ease; user-select:none; -webkit-user-select:none; }
    .cat-btn:hover{ background: rgba(255,255,255,0.06); }
    .cat-btn.is-active{ background: rgba(255,255,255,0.10); }
    .cat-text{
      width:100%;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:2px;
      font-weight:1000;
      color: var(--lime);
      -webkit-text-stroke: 1px rgba(12,90,42,0.95);
      text-shadow: 0 2px 10px rgba(15,23,42,0.25);
      letter-spacing:.06em;
      line-height:1;
    }
    .cat-text span{ display:block; font-size:28px; line-height:1; }

    .store-content{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:10px; padding:10px; }

    .section-block{
      border-radius:18px;
      background: rgba(255,255,255,0.06);
      border:2px solid rgba(12,90,42,0.18);
      padding:10px;
      box-shadow:0 14px 30px rgba(15,23,42,0.08);
    }

    .product-grid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap:12px;
      grid-auto-rows: 1fr;
    }

    /* PER-PRODUCT SINGLE ORANGE OUTLINE (not doubled) */
    .product-shell{
      border-radius:18px;
      background: var(--metal-orange);
      padding: var(--productPad);
      box-shadow:0 12px 26px rgba(15,23,42,0.10);
      min-height: var(--cardMinH);
      height:100%;
    }
    .product-mid{
      border-radius:14px;
      background: rgba(0,0,0,0.08);
      padding:6px;
      height:100%;
    }
    .product-card{
      border-radius:12px;
      overflow:hidden;
      background:#ffffff;
      height:100%;
      display:flex;
      flex-direction:column;
    }

    /* Underline product title */
    .prod-head{
      background: var(--dark-tab-grad);
      border-bottom:2px solid rgba(12,90,42,0.25);
      padding:6px 10px;
      font-family: var(--font-pretty);
      font-style: italic;
      font-weight:900;
      letter-spacing:.10em;
      text-transform:uppercase;
      font-size:12px;
      color: var(--lime);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      display:flex;
      align-items:center;
      gap:8px;
      flex:0 0 auto;
      text-shadow:0 1px 0 rgba(0,0,0,0.22);
    }
    .prod-head .ptitle{
      text-decoration: underline;
      text-decoration-color: var(--lime);
      text-decoration-thickness: 2px;
      text-underline-offset: 2px;
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .dot{ width:10px; height:10px; border-radius:999px; flex:0 0 auto; border:1px solid rgba(12,90,42,0.55); }

    .pimg{ background:#fff; border-bottom:2px solid rgba(12,90,42,0.20); flex:0 0 auto; }
    .pimg img{ width:100%; height:var(--cardImgH); object-fit:cover; display:block; cursor:pointer; }

    /* rectangle outline around clickables: lime->dark gradient */
    .pbot{ padding:8px; background: transparent; flex:1 1 auto; display:flex; }
    .pbot-outline{
      width:100%;
      border-radius:14px;
      background: var(--lime-dark-grad);
      padding: var(--clickablePad);
      box-shadow:0 10px 22px rgba(15,23,42,0.10);
    }
    .pbot-inner{
      width:100%;
      display:flex;
      flex-direction:column;
      gap:6px;
      justify-content:flex-end;
      background: var(--para-green-bg);
      border-radius:12px;
      padding:9px;
    }

    .top-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:0; }
    .price-text{ font-weight:1000; letter-spacing:.08em; text-transform:uppercase; font-size:14px; color:#0b1220; text-decoration: underline; text-underline-offset:2px; white-space:nowrap; }

    /* DESCRIPTION back to red gradient */
    .desc-btn{
      height:30px; padding:0 10px; border-radius:12px;
      border:2px solid var(--lime);
      background: linear-gradient(180deg, #ff4d4d 0%, #d31515 60%, #a90000 100%);
      color: var(--lime);
      font-family: var(--font-pretty);
      font-style: italic;
      font-weight:900;
      letter-spacing:.10em;
      text-transform:uppercase;
      font-size:9.5px;
      cursor:pointer;
      display:inline-flex; align-items:center; justify-content:center;
      gap:6px;
      white-space:nowrap;
      text-shadow:0 1px 0 rgba(0,0,0,0.22);
      flex:0 0 auto;
    }
    .desc-btn svg{ width:14px; height:14px; stroke: var(--lime); fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }

    .bottom-row{ display:flex; gap:10px; align-items:stretch; margin-top:2px; }
    .qty-pack{ flex:1 1 auto; min-height: var(--btnH); display:flex; align-items:center; gap:8px; padding:0; background:transparent; border:none; box-shadow:none; }
    .pm-box{
      width:30px; height: var(--btnH);
      border-radius:12px;
      border:2px solid var(--lime);
      background: var(--lime-dark-grad);
      overflow:hidden;
      display:flex; flex-direction:column; flex:0 0 auto;
    }
    .pm-btn{
      flex:1 1 0;
      border:none;
      background: transparent;
      color: var(--lime);
      font-weight:1000;
      font-size:12px;
      cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      user-select:none; -webkit-user-select:none;
      line-height:1;
      text-shadow:0 1px 0 rgba(0,0,0,0.22);
    }
    .pm-btn + .pm-btn{ border-top:1px solid rgba(255,255,255,0.20); }

    .qty-val{
      width:64px; height: var(--btnH);
      border-radius:12px;
      border:2px solid var(--lime);
      background: var(--lime-dark-grad);
      color: var(--lime);
      font-weight:1000;
      font-size:12px;
      text-align:center;
      outline:none;
      -moz-appearance:textfield;
      text-shadow:0 1px 0 rgba(0,0,0,0.22);
    }
    .qty-val::-webkit-outer-spin-button,
    .qty-val::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }

    .addq{
      height: var(--btnH);
      border:none;
      padding:0 14px;
      font-weight:1000;
      letter-spacing:.10em;
      text-transform:uppercase;
      font-size:10px;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      color: var(--lime);
      background: var(--metal-orange);
      border-radius:12px;
      border:2px solid var(--lime);
      flex:0 0 40%;
      white-space:nowrap;
      text-shadow:0 1px 0 rgba(0,0,0,0.18);
    }

    /* Responsive */
    @media(max-width:1100px){
      .product-grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .cat-text span{ font-size:26px; }
      :root{ --catTabW: 60px; }
    }
    @media(max-width:980px){
      :root{ --sideW: 120px; }
      .frame-wrap{ width: calc(100vw - (var(--sideW) * 2)); margin-left: var(--sideW); margin-right: var(--sideW); }
      .sticky-top{ left: var(--sideW); right: var(--sideW); }
      .store-layout{ grid-template-columns: 1fr; }
      .left-shell{ position:relative; top:auto; }
      .product-grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media(max-width:780px){
      .side-frames{ display:none !important; }
      .frame-wrap{ width:100% !important; margin:0 !important; }
      .sticky-top{ left:0 !important; right:0 !important; border-left:none !important; border-right:none !important; }
      main{ border-left:none !important; border-right:none !important; }
      .nav-center{ display:none !important; }
      .store-layout{ grid-template-columns: 1fr; }
      .left-shell{ display:none !important; }
      .store-search{ width: 100%; min-width:0; }
      .cat-tab{ display:none; }
    }
  </style>
</head>

<body>
  <!-- SIDE FRAMES -->
  <div class="side-frames" aria-hidden="true">
    <div class="side left"><div class="stack" id="stack-left"></div></div>
    <div class="side right"><div class="stack" id="stack-right"></div></div>
  </div>

  <div class="frame-wrap">
    <div class="sticky-top" id="sticky-top">
      <div class="top-banner" aria-label="Top banner">
        <img class="flag" src="american-flag-the-maya-nut-company.svg" alt="USA" onerror="this.style.display='none';" />
        <div class="txt">America’s Premier MayaNut Farm | The MayaNut Company</div>
      </div>

      <header class="site-header" aria-label="Site header">
        <nav class="main-nav" aria-label="Primary navigation">
          <div class="nav-search" aria-label="Site search">
            <button class="nav-search-btn" id="nav-search-btn" type="button" aria-label="Open site search">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="6.5"></circle>
                <path d="M16.2 16.2L21 21"></path>
              </svg>
            </button>
            <div class="nav-search-box" id="nav-search-box" aria-hidden="true">
              <input id="site-search" class="nav-search-input" type="text" placeholder="Search the site" autocomplete="off" />
              <button class="nav-search-clear" id="site-search-clear" type="button" aria-label="Clear site search">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M6 6l12 12"></path>
                  <path d="M18 6L6 18"></path>
                </svg>
              </button>
            </div>
          </div>

          <div class="nav-center" aria-label="Primary links">
            <a class="nav-pill" href="index.html"><span>HOME</span></a>
            <a class="nav-pill is-active" href="store.html" aria-current="page"><span>STORE</span></a>
            <a class="nav-pill" href="about.html"><span>ABOUT</span></a>
            <a class="nav-pill" href="research.html"><span>RESEARCH</span></a>
            <a class="nav-pill" href="contact.html"><span>CONTACT</span></a>
          </div>

          <div class="nav-right">
            <a class="lang-pill" href="store-es.html" aria-label="Switch to Español">ESPAÑOL</a>
          </div>
        </nav>
      </header>
    </div>

    <main id="main-content" tabindex="-1" aria-label="Store">
      <div class="content-wrapper">
        <div class="store-layout">

          <!-- SORT -->
          <div class="left-shell" aria-label="Sort column">
            <div class="left-outer">
              <aside class="left-panel" aria-label="Sort">
                <div class="left-head">
                  <span>SORT</span>
                  <span class="line" aria-hidden="true"></span>
                </div>

                <div class="left-body">
                  <div class="filter-shell">
                    <div class="filter-group" aria-label="Sort options">
                      <div class="filter-title">Order</div>
                      <label class="filter-item"><input type="radio" name="sortmode" value="newest" checked> Newest</label>
                      <label class="filter-item"><input type="radio" name="sortmode" value="az"> A → Z</label>
                      <label class="filter-item"><input type="radio" name="sortmode" value="za"> Z → A</label>
                      <label class="filter-item"><input type="radio" name="sortmode" value="price_low"> Price (Low)</label>
                      <label class="filter-item"><input type="radio" name="sortmode" value="price_high"> Price (High)</label>
                      <div style="height:6px"></div>
                      <label class="filter-item"><input type="checkbox" id="in-stock-only"> In Stock</label>
                    </div>
                  </div>
                </div>
              </aside>
            </div>
          </div>

          <!-- STORE -->
          <section class="grid-outer" aria-label="Store listings">
            <div class="grid-wrap">
              <div class="grid-head">
                <div class="store-brand" aria-label="Store brand">
                  <img class="store-logo" src="mayanut-the-mayanut-comapny-logo.png" alt="The MayaNut Company logo" onerror="this.style.opacity='.35';" />
                  <div class="grid-title">MayaNut Store</div>
                  <div class="title-line" aria-hidden="true"></div>
                </div>

                <div class="grid-tools">
                  <div class="store-search" aria-label="Search products">
                    <div class="mag" aria-hidden="true">
                      <svg viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="6.5"></circle>
                        <path d="M16.2 16.2L21 21"></path>
                      </svg>
                    </div>
                    <input id="store-search" type="text" placeholder="Search MayaNut powder, merch, plants…" autocomplete="off" />
                    <div class="xbtn" id="store-search-clear" aria-label="Clear search">
                      <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6 6l12 12"></path>
                        <path d="M18 6L6 18"></path>
                      </svg>
                    </div>
                  </div>

                  <div class="cart-pack" aria-label="Cart and checkout">
                    <div class="cart-left">
                      <span class="dust" aria-hidden="true"><i></i><i></i><i></i></span>
                      <button class="cart-btn" id="cart-btn" type="button" aria-label="Open cart">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                          <path d="M6 7h15l-1.5 8.5H7.2L6 7z"></path>
                          <path d="M6 7l-1-3H2.5"></path>
                          <circle cx="9" cy="19" r="1.6"></circle>
                          <circle cx="17" cy="19" r="1.6"></circle>
                        </svg>
                      </button>
                    </div>
                    <button class="checkout-btn" id="checkout-top" type="button" aria-label="Checkout">CHECKOUT</button>
                  </div>
                </div>
              </div>

              <div class="grid-body">
                <div class="store-body-wrap">
                  <aside class="cat-tab" aria-label="Categories">
                    <button class="cat-btn is-active" type="button" data-jump="#sec-powder" aria-label="Powder">
                      <span class="cat-text" aria-hidden="true">
                        <span>P</span><span>O</span><span>W</span><span>D</span><span>E</span><span>R</span>
                      </span>
                    </button>
                    <button class="cat-btn" type="button" data-jump="#sec-merch" aria-label="Merch">
                      <span class="cat-text" aria-hidden="true">
                        <span>M</span><span>E</span><span>R</span><span>C</span><span>H</span>
                      </span>
                    </button>
                    <button class="cat-btn" type="button" data-jump="#sec-plants" aria-label="Plants">
                      <span class="cat-text" aria-hidden="true">
                        <span>P</span><span>L</span><span>A</span><span>N</span><span>T</span><span>S</span>
                      </span>
                    </button>
                  </aside>

                  <div class="store-content">
                    <div class="section-block" id="sec-powder" aria-label="Powder products">
                      <div class="product-grid" id="grid-food"></div>
                    </div>
                    <div class="section-block" id="sec-merch" aria-label="Merch products">
                      <div class="product-grid" id="grid-merch"></div>
                    </div>
                    <div class="section-block" id="sec-plants" aria-label="Plant products">
                      <div class="product-grid" id="grid-plants"></div>
                    </div>
                  </div>
                </div>
              </div>

            </div>
          </section>

        </div>
      </div>
    </main>
  </div>

  <script>
    const PRODUCTS = [
      { id:"powder_qtr",  cat:"powder", title:"¼ lb MayaNut Powder", price:9.95,  newest:5, inStock:true,  dot:"orange", img:"mayanut-powder-maya-nut-brosimum-alicastrum.png", desc:"You will receive a quarter-pound of MayaNut powder." },
      { id:"powder_lb",   cat:"powder", title:"1 lb MayaNut Powder",  price:34.95, newest:4, inStock:true,  dot:"orange", img:"mayanut-powder-maya-nut-brosimum-alicastrum.png", desc:"You will receive 1 pound of MayaNut powder." },
      { id:"pods_25",     cat:"powder", title:"MayaNut Instant Pods (25)", price:29.95, newest:3, inStock:true,  dot:"orange", img:"mayanut-powder-maya-nut-brosimum-alicastrum.png", desc:"You will receive MayaNut instant pods (25 pack)." },

      { id:"hat",         cat:"merch",  title:"MayaNut Hat", price:15.00, newest:1, inStock:true,  dot:"white", img:"mayanut-merch-hat-brosimum-alicastrum.png", desc:"MayaNut hat (concept merch)." },
      { id:"shirt",       cat:"merch",  title:"MayaNut T-Shirt", price:18.00, newest:1, inStock:true,  dot:"white", img:"mayanut-merch-shirt-brosimum-alicastrum.png", desc:"MayaNut T-shirt (concept merch)." },
      { id:"hoodie",      cat:"merch",  title:"MayaNut Hoodie", price:30.00, newest:1, inStock:true,  dot:"white", img:"mayanut-merch-hoodie-brosimum-alicastrum.png", desc:"MayaNut hoodie (concept merch)." },

      { id:"seedling_1g", cat:"plants", title:"MayaNut Seedling (1 Gallon)", price:34.95, newest:2, inStock:true,  dot:"yellow", img:"maya-nut-mayanut-plant-tree-nursery.jpg", desc:"MayaNut seedling in a 1-gallon pot (concept)." },
      { id:"seeds_10",    cat:"plants", title:"MayaNut Seeds (10 Pack)", price:9.95, newest:1, inStock:true,  dot:"yellow", img:"maya-nut-mayanut-fruit-brosimum-alicastrum.jpg", desc:"MayaNut seeds (10 pack) for planting (concept)." }
    ];

    const DOT_COLOR = { orange:"#fd6c02", white:"#ffffff", yellow:"#ffd400" };
    const $ = (s, r=document)=> r.querySelector(s);
    const $$ = (s, r=document)=> Array.from(r.querySelectorAll(s));
    const money = (n)=> Number(n||0).toLocaleString(undefined,{style:"currency",currency:"USD"});

    const UI = { search:"", sortmode:"newest", inStockOnly:false };

    function getFilteredSorted(cat){
      let arr = PRODUCTS.filter(p=>p.cat===cat);
      if(UI.inStockOnly) arr = arr.filter(p=>p.inStock);

      const q = (UI.search||"").trim().toLowerCase();
      if(q){
        arr = arr.filter(p=>{
          const hay = (p.title + " " + (p.desc||"") + " " + p.cat).toLowerCase();
          return hay.includes(q);
        });
      }

      const sm = UI.sortmode;
      arr.sort((a,b)=>{
        if(sm==="newest") return (b.newest||0)-(a.newest||0);
        if(sm==="az") return a.title.localeCompare(b.title);
        if(sm==="za") return b.title.localeCompare(a.title);
        if(sm==="price_low") return (a.price||0)-(b.price||0);
        if(sm==="price_high") return (b.price||0)-(a.price||0);
        return 0;
      });
      return arr;
    }

    function cardHTML(p){
      const dot = DOT_COLOR[p.dot] || "#fd6c02";
      const safe = (s)=> String(s||"").replace(/"/g,"&quot;");
      return `
        <div class="product-shell" data-shell data-id="${safe(p.id)}">
          <div class="product-mid">
            <article class="product-card" data-id="${safe(p.id)}">
              <div class="prod-head">
                <span class="dot" style="background:${dot}"></span>
                <span class="ptitle">${p.title}</span>
              </div>

              <div class="pimg">
                <img src="${safe(p.img)}" alt="${safe(p.title)}" />
              </div>

              <div class="pbot">
                <div class="pbot-outline">
                  <div class="pbot-inner">
                    <div class="top-row">
                      <div class="price-text">${money(p.price)}</div>
                      <button class="desc-btn" type="button" aria-label="Description">
                        DESCRIPTION
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                          <path d="M6 18c4-6 8-9 12-9"></path>
                          <path d="M18 9V5"></path>
                          <path d="M18 5h-4"></path>
                        </svg>
                      </button>
                    </div>

                    <div class="bottom-row">
                      <div class="qty-pack">
                        <div class="pm-box">
                          <button class="pm-btn pm-plus" type="button" aria-label="Increase">+</button>
                          <button class="pm-btn pm-minus" type="button" aria-label="Decrease">-</button>
                        </div>
                        <input class="qty-val" type="number" min="1" max="99" step="1" value="1" inputmode="numeric" aria-label="Quantity" />
                      </div>

                      <button class="addq" type="button">ADD</button>
                    </div>
                  </div>
                </div>
              </div>

            </article>
          </div>
        </div>
      `;
    }

    function renderCategory(cat, gridEl){
      const items = getFilteredSorted(cat);
      gridEl.innerHTML = items.map(cardHTML).join("");
    }

    function renderAll(){
      renderCategory("powder", $("#grid-food"));
      renderCategory("merch",  $("#grid-merch"));
      renderCategory("plants", $("#grid-plants"));
    }
    renderAll();

    /* Store search */
    (function(){
      const input = $("#store-search");
      const clear = $("#store-search-clear");
      if(!input) return;

      function apply(){
        UI.search = input.value || "";
        renderAll();
      }
      input.addEventListener("input", ()=>{ clearTimeout(window.__ss); window.__ss=setTimeout(apply,60); });
      clear?.addEventListener("click", ()=>{ input.value=""; UI.search=""; renderAll(); input.focus(); });
    })();

    /* Sorting mechanism */
    (function(){
      const radios = $$("input[name='sortmode']");
      radios.forEach(r=>{
        r.addEventListener("change", ()=>{
          if(r.checked){
            UI.sortmode = r.value;
            renderAll();
          }
        });
      });

      const cb = $("#in-stock-only");
      cb?.addEventListener("change", ()=>{
        UI.inStockOnly = !!cb.checked;
        renderAll();
      });
    })();

    /* Category jump */
    (function(){
      const btns = Array.from(document.querySelectorAll("[data-jump]"));
      btns.forEach(b=>{
        b.addEventListener("click", ()=>{
          const id = b.getAttribute("data-jump");
          const el = id ? document.querySelector(id) : null;
          if(el) el.scrollIntoView({ behavior:"smooth", block:"start" });
        });
      });
    })();

    /* Header search open/close */
    (function(){
      const btn = $("#nav-search-btn");
      const box = $("#nav-search-box");
      const input = $("#site-search");
      const clear = $("#site-search-clear");

      function open(){
        document.body.classList.add("site-search-open");
        box?.setAttribute("aria-hidden","false");
        input?.focus();
      }
      function close(){
        document.body.classList.remove("site-search-open");
        box?.setAttribute("aria-hidden","true");
      }

      btn?.addEventListener("click", ()=> {
        if(document.body.classList.contains("site-search-open")) close();
        else open();
      });

      clear?.addEventListener("click", ()=>{ if(input){ input.value=""; input.focus(); } });

      document.addEventListener("click",(e)=>{
        const t = e.target;
        const within = (t && (btn?.contains(t) || box?.contains(t)));
        if(!within) close();
      });
      document.addEventListener("keydown",(e)=>{ if(e.key==="Escape") close(); });
    })();

    /* Side frames populate */
    (function(){
      const webp = "mayanuts-the-maya-nut-company-image.webp";
      const jpg  = "mayanuts-the-maya-nut-company-image.jpeg";
      const L = document.getElementById("stack-left");
      const R = document.getElementById("stack-right");
      if(!L || !R) return;
      const count = 12;
      function makeImg(){
        const im = document.createElement("img");
        im.alt = "";
        im.decoding = "async";
        im.src = webp;
        im.onerror = ()=>{ if(im.src.indexOf(jpg) === -1) im.src = jpg; };
        return im;
      }
      for(let i=0;i<count;i++){ L.appendChild(makeImg()); R.appendChild(makeImg()); }
    })();

    /* Sticky offset */
    (function(){
      function setStickyOffset(){
        const sticky = document.getElementById("sticky-top");
        if(!sticky) return;
        const h = Math.ceil(sticky.getBoundingClientRect().height);
        document.documentElement.style.setProperty("--stickyOffset", h + "px");
      }
      window.addEventListener("load", setStickyOffset, { once:true });
      window.addEventListener("resize", ()=>{ clearTimeout(window.__st); window.__st=setTimeout(setStickyOffset,80); });
      window.addEventListener("pageshow", setStickyOffset);
      document.addEventListener("DOMContentLoaded", setStickyOffset);
    })();
  </script>
</body>
</html>
