<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MayaNut Store | The MayaNut Company</title>

<style>
/* =========================
   GLOBAL VARIABLES
   ========================= */
:root{
  --green-dark:#0b3b17;
  --green-mid:#1a6800;
  --green-lime:#b7ff3f;

  /* index-page paragraph green */
  --para-green: linear-gradient(
    180deg,
    #e9ffd6 0%,
    #c9f5a5 55%,
    #b3e887 100%
  );

  --orange:#ff7a1a;
  --orange-metal: linear-gradient(
    180deg,
    #ffd1a8 0%,
    #ff9a4a 35%,
    #ff7a1a 60%,
    #e45f00 100%
  );

  --cream:#ffffc5;
  --ink:#0b1220;

  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:18px;

  --shadow:0 14px 40px rgba(15,23,42,.18);

  --title-font:"Palatino Linotype", Palatino, Georgia, serif;
  --ui-font:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:var(--ui-font);
  background:linear-gradient(180deg,#1a6800 0%,#0b3b17 100%);
  color:var(--ink);
}

/* =========================
   TOP BAR (NO GLITCH)
   ========================= */
.topbar{
  position:sticky;
  top:0;
  z-index:1000;
  background:linear-gradient(90deg,#0b3b17,#1a6800,#0b3b17);
  border-bottom:2px solid var(--green-dark);
}
.topbar-inner{
  max-width:1400px;
  margin:auto;
  padding:10px 18px;
  display:flex;
  align-items:center;
  gap:18px;
}
.logo{
  display:flex;
  align-items:center;
  gap:10px;
}
.logo img{
  width:46px;
}
.store-title{
  font-family:var(--title-font);
  font-weight:900;
  font-size:22px;
  letter-spacing:.1em;
  color:var(--cream);
  white-space:nowrap;
}
.title-line{
  flex:1;
  height:2px;
  background:var(--green-lime);
}
.search-wrap{
  display:flex;
  align-items:center;
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  border:2px solid var(--green-dark);
}
.search-wrap input{
  border:none;
  padding:8px 10px;
  font-weight:700;
  outline:none;
}
.search-wrap button{
  border:none;
  background:transparent;
  padding:8px 10px;
  cursor:pointer;
  font-weight:900;
}

/* =========================
   MAIN LAYOUT
   ========================= */
.main{
  max-width:1400px;
  margin:auto;
  padding:24px 18px 80px;
  display:grid;
  grid-template-columns:260px 1fr;
  gap:22px;
}

/* =========================
   SORT PANEL
   ========================= */
.sort-panel{
  position:sticky;
  top:86px;
  border-radius:var(--radius-lg);
  background:var(--para-green);
  border:4px solid var(--orange);
  box-shadow:var(--shadow);
  padding:14px;
}
.sort-header{
  font-family:var(--title-font);
  font-weight:900;
  letter-spacing:.12em;
  margin-bottom:10px;
}
.sort-header::after{
  content:"";
  display:block;
  height:2px;
  background:var(--green-dark);
  margin-top:6px;
}
.sort-group{
  background:#fff;
  border-radius:12px;
  padding:10px;
  border:2px solid var(--green-dark);
  margin-bottom:12px;
}
.sort-group label{
  display:block;
  font-weight:800;
  font-size:13px;
  margin-bottom:6px;
}
.checkout-sticky{
  margin-top:12px;
  width:100%;
  border:none;
  border-radius:14px;
  padding:12px;
  font-weight:900;
  letter-spacing:.12em;
  background:var(--orange-metal);
  color:var(--cream);
  cursor:pointer;
}

/* =========================
   SECTION TITLES
   ========================= */
.section{
  margin-bottom:36px;
}
.section-title{
  display:flex;
  align-items:center;
  gap:12px;
  font-family:var(--title-font);
  font-weight:900;
  font-size:20px;
  letter-spacing:.12em;
  color:var(--cream);
  margin-bottom:14px;
}
.section-title::after{
  content:"";
  flex:1;
  height:2px;
  background:var(--green-lime);
}

/* =========================
   PRODUCT GRID
   ========================= */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:18px;
}

.product{
  background:var(--para-green);
  border-radius:var(--radius-lg);
  border:4px solid var(--orange);
  box-shadow:var(--shadow);
  overflow:hidden;
  transition:transform .15s ease;
}
.product:hover{transform:scale(1.03)}

.product-header{
  background:var(--cream);
  border-bottom:2px solid var(--green-dark);
  text-align:center;
  font-family:var(--title-font);
  font-weight:900;
  letter-spacing:.1em;
  padding:6px 8px;
  white-space:nowrap;
}

/* =========================
   IMAGE
   ========================= */
.image-wrap{
  position:relative;
}
.image-wrap img{
  width:100%;
  height:160px;
  object-fit:cover;
  display:block;
}
.heart{
  position:absolute;
  top:8px;
  right:8px;
  width:34px;
  height:34px;
  border-radius:10px;
  border:2px solid var(--green-dark);
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.heart svg{
  width:18px;
  height:18px;
  fill:url(#heartGrad);
}

/* =========================
   BUY AREA
   ========================= */
.buy{
  background:var(--para-green);
  border-top:2px solid var(--green-dark);
  padding:10px;
}
.buy-inner{
  border-radius:14px;
  border:3px solid;
  border-image:linear-gradient(180deg,var(--green-lime),var(--green-dark)) 1;
  padding:8px;
  display:grid;
  grid-template-columns:auto auto 1fr auto;
  gap:8px;
  align-items:center;
}

/* quantity */
.qty{
  display:flex;
  align-items:center;
  gap:4px;
}
.qty button{
  width:24px;
  height:24px;
  border-radius:6px;
  border:2px solid var(--green-dark);
  background:#fff;
  font-weight:900;
  cursor:pointer;
}
.qty span{
  min-width:26px;
  text-align:center;
  font-weight:900;
  background:#fff;
  border-radius:8px;
  border:2px solid var(--green-dark);
}

/* info */
.info-btn{
  font-size:11px;
  font-weight:900;
  letter-spacing:.12em;
  background:#bdbdbd;
  border:2px solid var(--green-dark);
  color:var(--cream);
  padding:4px 6px;
  cursor:pointer;
}

/* add / price */
.add-price{
  display:flex;
  overflow:hidden;
  border-radius:12px;
  border:2px solid var(--green-dark);
}
.add-price button{
  flex:1;
  border:none;
  padding:8px;
  font-weight:900;
  cursor:pointer;
}
.add-btn{
  background:var(--orange-metal);
  color:var(--cream);
}
.price-btn{
  background:linear-gradient(180deg,#2a8b2f,#0b3b17);
  color:var(--cream);
}

/* =========================
   FOOTER
   ========================= */
footer{
  margin-top:40px;
  padding:18px;
  background:linear-gradient(90deg,#0b3b17,#1a6800,#0b3b17);
  border-top:2px solid var(--green-dark);
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:var(--cream);
}
.share-btn{
  border-radius:14px;
  padding:8px 14px;
  font-weight:900;
  background:var(--orange-metal);
  color:var(--cream);
  border:2px solid var(--cream);
  cursor:pointer;
}

/* =========================
   MOBILE
   ========================= */
@media(max-width:900px){
  .main{grid-template-columns:1fr}
  .sort-panel{position:relative;top:auto}
}
</style>
</head>

<body>

<!-- heart gradient -->
<svg width="0" height="0">
  <defs>
    <linearGradient id="heartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5aa5"/>
      <stop offset="100%" stop-color="#ff003c"/>
    </linearGradient>
  </defs>
</svg>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-inner">
    <div class="logo">
      <img src="mayanut-the-mayanut-comapny-logo.png" alt="MayaNut logo">
      <div class="store-title">MayaNut Store</div>
    </div>
    <div class="title-line"></div>
    <div class="search-wrap">
      <input type="text" placeholder="Search MayaNut products…">
      <button>✕</button>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- SORT -->
  <aside class="sort-panel">

    <div class="sort-group">
      <label><input type="checkbox"> In Stock</label>
    </div>
    <button class="checkout-sticky">CHECKOUT (COMING SOON)</button>
  </aside>

  <!-- PRODUCTS -->
  <section>

    <div class="section">
      <div class="section-title">MayaNut Food Products</div>
      <div class="grid">

        <!-- PRODUCT 1 -->
        <div class="product">
          <div class="product-header">¼ lb MayaNut Powder</div>
          <div class="image-wrap">
            <img src="mayanut-powder-maya-nut-brosimum-alicastrum.png" alt="">
            <div class="heart">
              <svg viewBox="0 0 24 24">
                <path d="M12 21s-7-4.35-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.65-7 10-7 10z"/>
              </svg>
            </div>
          </div>
          <div class="buy">
            <div class="buy-inner">
              <div class="qty">
                <button>-</button><span>1</span><button>+</button>
              </div>
              <button class="info-btn">INFO</button>
              <div class="add-price">
                <button class="add-btn">ADD</button>
                <button class="price-btn">$0.00</button>
              </div>
            </div>
          </div>
        </div>

        <!-- PRODUCT 2 -->
        <div class="product">
          <div class="product-header">1 lb MayaNut Powder</div>
          <div class="image-wrap">
            <img src="mayanut-powder-maya-nut-brosimum-alicastrum.png" alt="">
            <div class="heart">
              <svg viewBox="0 0 24 24">
                <path d="M12 21s-7-4.35-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.65-7 10-7 10z"/>
              </svg>
            </div>
          </div>
          <div class="buy">
            <div class="buy-inner">
              <div class="qty">
                <button>-</button><span>1</span><button>+</button>
              </div>
              <button class="info-btn">INFO</button>
              <div class="add-price">
                <button class="add-btn">ADD</button>
                <button class="price-btn">$0.00</button>
              </div>
            </div>
          </div>
        </div>

        <!-- PRODUCT 3 -->
        <div class="product">
          <div class="product-header">Instant MayaNut Pods</div>
          <div class="image-wrap">
            <img src="mayanut-powder-maya-nut-brosimum-alicastrum.png" alt="">
            <div class="heart">
              <svg viewBox="0 0 24 24">
                <path d="M12 21s-7-4.35-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.65-7 10-7 10z"/>
              </svg>
            </div>
          </div>
          <div class="buy">
            <div class="buy-inner">
              <div class="qty">
                <button>-</button><span>1</span><button>+</button>
              </div>
              <button class="info-btn">INFO</button>
              <div class="add-price">
                <button class="add-btn">ADD</button>
                <button class="price-btn">$0.00</button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>

  </section>
</div>

<footer>
  <div>© 2026 The MayaNut Company</div>
  <button class="share-btn">SHARE</button>
</footer>

</body>
</html>
